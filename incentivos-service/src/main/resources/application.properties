server.port=${PORT:8082}
spring.application.name=incentivos-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI
# TODO: ajustar server-url cuando se despliegue en Docker/preprod.
donatrack.openapi.title=DonaTrack - Servicio de Incentivos
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar misiones, incentivos y ranking de donantes.
donatrack.openapi.server-url=http://localhost:8082
donatrack.openapi.server-description=Servicio de Incentivos local

# n8n Webhook URLs
n8n.webhook.insignia-url=${N8N_INSIGNIA_WEBHOOK_URL:http://localhost:5678/webhook/insignia-ganada}
n8n.webhook.ranking-url=${N8N_RANKING_WEBHOOK_URL:http://localhost:5678/webhook/ranking-calculado}

spring.main.allow-bean-definition-overriding=true
notificaciones.service.url=${NOTIFICACIONES_SERVICE_URL:http://localhost:8081}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASS:donatrack}

# Migración a Rabbit: true = habilitado por defecto
incentivos.rabbitmq.enabled=${INCENTIVOS_RABBITMQ_ENABLED:true}
management.health.rabbit.enabled=${incentivos.rabbitmq.enabled:true}

# MinIO: imágenes de las insignias. Apagado por defecto (en memoria/tests no requieren MinIO).
# endpoint = host interno que usa el servicio (red de Docker); public-base-url = host que ve el navegador.
incentivos.minio.enabled=${INCENTIVOS_MINIO_ENABLED:false}
incentivos.minio.endpoint=${INCENTIVOS_MINIO_ENDPOINT:http://localhost:9000}
incentivos.minio.public-base-url=${INCENTIVOS_MINIO_PUBLIC_BASE_URL:http://localhost:9000}
incentivos.minio.access-key=${INCENTIVOS_MINIO_ACCESS_KEY:minioadmin}
incentivos.minio.secret-key=${INCENTIVOS_MINIO_SECRET_KEY:minioadmin}
incentivos.minio.bucket=${INCENTIVOS_MINIO_BUCKET:insignias}

# Desactivar autoconfiguración de BD relacional en perfil default (en memoria)
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
