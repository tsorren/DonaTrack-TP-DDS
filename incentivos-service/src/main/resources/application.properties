server.port=${PORT:8082}
spring.application.name=incentivos-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI
# TODO: ajustar server-url cuando se despliegue en Docker/preprod.
donatrack.openapi.title=DonaTrack - Servicio de Incentivos
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar misiones, incentivos y ranking de donantes.
donatrack.openapi.server-url=http://localhost:8082
donatrack.openapi.server-description=Servicio de Incentivos local

# n8n Webhook URLs
n8n.webhook.insignia-url=${N8N_INSIGNIA_WEBHOOK_URL:http://localhost:5678/webhook/insignia-ganada}
n8n.webhook.ranking-url=${N8N_RANKING_WEBHOOK_URL:http://localhost:5678/webhook/ranking-calculado}

spring.main.allow-bean-definition-overriding=true
notificaciones.service.url=${NOTIFICACIONES_SERVICE_URL:http://localhost:8081}
