# PERFIL POSTGRESQL (Producción / Preprod / Docker)
# Reactivar autoconfiguración de base de datos relacional
spring.autoconfigure.exclude=

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donatrack?currentSchema=incentivos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:incentivos_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:inc_pass_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=incentivos
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MinIO encendido en el perfil postgres (override con INCENTIVOS_MINIO_ENABLED=false si no hay MinIO)
incentivos.minio.enabled=${INCENTIVOS_MINIO_ENABLED:true}

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.schemas=incentivos
spring.flyway.locations=classpath:db/migration
