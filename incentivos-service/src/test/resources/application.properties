notificaciones.service.url=${NOTIFICACIONES_SERVICE_URL:http://localhost:8081}
n8n.webhook.insignia-url=http://localhost:5678/webhook/insignia-ganada
n8n.webhook.ranking-url=http://localhost:5678/webhook/ranking-calculado
spring.main.allow-bean-definition-overriding=true
spring.cloud.openfeign.lazy-attributes-resolution=true
feign.autoconfiguration.jackson.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# Desactivar autoconfiguración de BD relacional en perfil default (en memoria)
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
