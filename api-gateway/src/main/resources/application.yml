spring:
  application:
    name: api-gateway
  # Resource server (ADR-E6-02, etapa 2). El issuer y las claves de Keycloak llegan por
  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI y _JWK_SET_URI: no definirlas acá, con valor
  # vacío Spring igual intenta armar el decoder y falla.
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${GATEWAY_JWT_AUDIENCIA:donatrack-api}

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Grupos liveness y readiness (K3): el healthcheck de Swarm mira liveness
      probes:
        enabled: true

donatrack:
  # Apagada por defecto: Postman, integration-tests y k6 llaman sin token (decisión M-07 de la matriz).
  seguridad:
    habilitada: ${GATEWAY_SEGURIDAD_HABILITADA:false}
  gateway:
    servicios:
      donaciones: ${DONACIONES_SERVICE_URL:http://localhost:8080}
      notificaciones: ${NOTIFICACIONES_SERVICE_URL:http://localhost:8081}
      incentivos: ${INCENTIVOS_SERVICE_URL:http://localhost:8082}
      logistica: ${LOGISTICA_SERVICE_URL:http://localhost:8083}
    # Límites de espera hacia los servicios (R11-04). Pasados, el gateway contesta 504 y el cliente
    # liviano muestra su página de falla con el código de soporte. Van por debajo de los del
    # cliente (15 s de lectura, 120 s de subida) para que el gateway conteste primero.
    # conexion: abrir la conexión; lectura: que el servicio empiece a responder; subida: lo mismo
    # para subir un archivo (CSV de donantes, fotos del acta).
    limites:
      conexion: ${GATEWAY_TIMEOUT_CONEXION:3s}
      lectura: ${GATEWAY_TIMEOUT_LECTURA:10s}
      subida: ${GATEWAY_TIMEOUT_SUBIDA:100s}
    # Rate limiting (E7, requerimiento 3; ADR 20261115). Cada pedido enrutado consume una ficha de su
    # cubeta; sin fichas, 429 con Retry-After y el pedido no llega al servicio. La cubeta es de la
    # cuenta si el token fue validado (sub del JWT) y, si no, de la IP de origen. Lecturas (GET, HEAD,
    # OPTIONS) y escrituras tienen cupos separados, por ventana, con recarga gradual.
    # Dimensionado: una pantalla del cliente liviano hace hasta ~10 lecturas; el mapa público consulta
    # cada 30 s (2 por minuto, ADR 20261106). Los healthchecks (/actuator) no pasan por acá.
    limite-de-solicitudes:
      habilitado: ${GATEWAY_LIMITE_HABILITADO:true}
      ventana: ${GATEWAY_LIMITE_VENTANA:1m}
      lecturas-por-usuario: ${GATEWAY_LIMITE_LECTURAS_USUARIO:300}
      escrituras-por-usuario: ${GATEWAY_LIMITE_ESCRITURAS_USUARIO:60}
      lecturas-por-ip: ${GATEWAY_LIMITE_LECTURAS_IP:120}
      escrituras-por-ip: ${GATEWAY_LIMITE_ESCRITURAS_IP:30}
      # Regex de las IPs de los proxies que pueden informar la IP del navegador en X-Forwarded-For (el
      # cliente liviano). Vacía: el encabezado se ignora y cuenta la IP de la conexión. No abrirla a
      # redes por las que entra tráfico de afuera: quien llegue desde ahí podría inventar su IP.
      proxies-confiables: ${GATEWAY_LIMITE_PROXIES_CONFIABLES:}
      # Dónde viven las cubetas (Q11): un Redis compartido por todas las réplicas. Si no contesta en
      # `timeout`, el pedido pasa sin límite (fail-open, Q11b) y queda un WARN [REDIS-NO-DISPONIBLE];
      # si no conecta, no se reintenta hasta pasado `reintento`.
      redis:
        host: ${GATEWAY_REDIS_HOST:localhost}
        puerto: ${GATEWAY_REDIS_PUERTO:6379}
        timeout: ${GATEWAY_REDIS_TIMEOUT:100ms}
        reintento: ${GATEWAY_REDIS_REINTENTO:5s}
    # Allowlist pública (D26, RI-GW-03): con la seguridad encendida pasan sin token. Formato
    # "MÉTODO /ruta". El gateway abre la RUTA, sin distinguir método, como las `ReglasDeAcceso*` de los
    # servicios: el método lo decide el @PreAuthorize del servicio (segunda capa). Tiene que coincidir
    # con esas reglas. Si una pantalla pública suma una llamada, su ruta entra acá y en el servicio en
    # el mismo cambio.
    rutas-publicas:
      - GET /api/donaciones/contadores
      - GET /api/donaciones/destacadas
      - GET /api/entidades/publicas
      - GET /api/necesidades/publicas
      - GET /api/entregas/mapa
      - POST /api/contacto
      # GraphQL de solo lectura (SPEC-11): necesidades y entidades son públicas; donaciones pide
      # rol y lo decide el @PreAuthorize del resolver con el Bearer que el gateway reenvía intacto.
      - POST /api/donaciones/graphql
