server.port=${PORT:8081}
spring.application.name=notificaciones-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI
# TODO: ajustar server-url cuando se despliegue en Docker/preprod.
donatrack.openapi.title=DonaTrack - Servicio de Notificaciones
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar personas replicadas y notificaciones enviadas a partir de eventos de donaciones, incentivos y logistica.
donatrack.openapi.server-url=http://localhost:8081
donatrack.openapi.server-description=Servicio de Notificaciones local

# ==========================================
# CONFIGURACIÓN DE PERSISTENCIA (PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/club?options=-c%20timezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:club_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:club_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

