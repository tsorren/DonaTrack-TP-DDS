server.port=${PORT:8081}
spring.application.name=notificaciones-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI
donatrack.openapi.title=DonaTrack - Servicio de Notificaciones
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar personas replicadas y notificaciones enviadas a partir de eventos de donaciones, incentivos y logistica.
donatrack.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8081}
donatrack.openapi.server-description=Servicio de Notificaciones local

# Desactivar autoconfiguración de BD relacional en perfil default (en memoria)
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration