# Override del stack de Docker Swarm de un nodo (ADR 20261118-despliegue-en-docker-swarm-de-un-nodo-con-replicas).
# Va encima del stack que genera scripts/swarm/generar-stack.js; se despliega con scripts/swarm/desplegar.sh.
# No nombrar servicios que no estén en docker-compose.preprod.yml: un servicio solo en el override rompe el stack.
#
# [PROPOSED] Réplicas: DONATRACK_REPLICAS (1 por defecto, 2 en la defensa) en los seis módulos propios.
# [PROPOSED] Límites de memoria: lo medido en la prueba del 2026-11-18 más margen sobre -Xmx o
#   MaxRAMPercentage=75 (cliente liviano). Son techos, sin reservas: no frenan la planificación en un nodo.
#   minio-init: 128M terminó en OOMKilled en la corrida de SW2; queda en 256M, sin medir su pico.
# [PROPOSED] Healthcheck de los replicados: interval 5s, timeout 3s, retries 3 (una réplica colgada saldría
#   en unos 15 a 25 s, [INFERRED]; con retries 20 tardó 160 s). start_period 120s porque con retries 3 un arranque lento
#   con 14 contenedores a la vez no puede contar como falla. El test es el del compose:
#   /actuator/health/liveness (K3), que no mira la base ni RabbitMQ.
version: "3.9"

x-replicado: &replicado
  replicas: ${DONATRACK_REPLICAS:-1}

x-salud-replicado: &salud-replicado
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 120s

services:
  api-gateway:
    # [VERIFIED] R4 (24/11): con el timeout por defecto (100ms) la primera conexión a Redis no llegaba a
    # resolver el nombre en el DNS de Swarm ("redis/<unresolved>:6379"), el gateway quedaba en fail-open
    # y la ráfaga no recibía 429. Con 1s se conecta y el escenario de k6 pasa.
    environment:
      GATEWAY_REDIS_TIMEOUT: 1s
    deploy:
      <<: *replicado
      resources:
        limits:
          memory: 448M
    healthcheck: *salud-replicado

  cliente-liviano:
    deploy:
      <<: *replicado
      resources:
        limits:
          memory: 640M
    healthcheck: *salud-replicado

  donaciones-service:
    deploy:
      <<: *replicado
      resources:
        limits:
          memory: 640M
    healthcheck: *salud-replicado

  incentivos-service:
    deploy:
      <<: *replicado
      resources:
        limits:
          memory: 640M
    healthcheck: *salud-replicado

  logistica-service:
    deploy:
      <<: *replicado
      resources:
        limits:
          memory: 640M
    healthcheck: *salud-replicado

  notificaciones-service:
    deploy:
      <<: *replicado
      resources:
        limits:
          memory: 640M
    healthcheck: *salud-replicado

  # Su healthcheck inicia el replica set contra mongodb:27017. En Swarm ese nombre es la VIP, que no
  # enruta a una tarea todavía no sana: con hostname resuelve al propio contenedor (prueba, chequeo 5).
  mongodb:
    hostname: mongodb
    deploy:
      resources:
        limits:
          memory: 512M

  # Tarea de una vez: con la política por defecto (any) Swarm la relanzaría para siempre.
  # [VERIFIED] 128M no alcanzaba: en la corrida de SW2 (2026-11-19) una tarea terminó con OOMKilled (exit 137).
  # [PROPOSED] 256M, el doble, sin medir su pico.
  minio-init:
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

  keycloak:
    deploy:
      resources:
        limits:
          memory: 1024M

  postgres:
    deploy:
      resources:
        limits:
          memory: 384M

  # [INFERRED] RabbitMQ toma el límite como su memoria: con 768M su marca de 40 % (~300 MiB) queda
  # lejos de los 160 MiB medidos; si la pasa, bloquea a los que publican.
  rabbitmq:
    deploy:
      resources:
        limits:
          memory: 768M

  minio:
    deploy:
      resources:
        limits:
          memory: 256M

  n8n:
    deploy:
      resources:
        limits:
          memory: 640M

  # Stack de observabilidad unificado (ADR observabilidad E7): 1 sola réplica, guarda estado en /data.
  otel-lgtm:
    deploy:
      resources:
        limits:
          memory: 1024M
