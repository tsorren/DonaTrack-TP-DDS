server.port=${PORT:8080}
spring.application.name=donaciones-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

// TODO: Utilizar variables de entorno
donatrack.openapi.title=DonaTrack - Servicio de Donaciones
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar personas donantes, donaciones, entidades beneficiarias, necesidades y asignaciones.
donatrack.openapi.server-url=http://localhost:8080
donatrack.openapi.server-description=Servicio de Donaciones local
donatrack.notificaciones.url=${NOTIFICACIONES_SERVICE_URL:http://localhost:8081}
donatrack.incentivos.url=${INCENTIVOS_SERVICE_URL:http://localhost:8082}
donatrack.logistica.url=${LOGISTICA_SERVICE_URL:http://localhost:8083}
donatrack.normalizacion.umbral-aceptacion=${UMBRAL_NORMALIZACION:1.0}
donatrack.catalogo.seed-enabled=${SEED_CATALOGO_ENABLED:false}
planificador.algoritmos.cron.expression=${PLANIFICADOR_ALGORITMOS_CRON:0 0 0 * * ?}

# Broker de integración con logística
donatrack.logistica.proveedores=${LOGISTICA_PROVEEDORES:donatrack,externo}
donatrack.logistica.proveedor-preferido=${LOGISTICA_PROVEEDOR:donatrack}
donatrack.logistica.outbox.intervalo-ms=${LOGISTICA_OUTBOX_INTERVALO_MS:10000}
donatrack.logistica.outbox.max-intentos=${LOGISTICA_OUTBOX_MAX_INTENTOS:5}
donatrack.logistica.outbox.backoff-base-segundos=${LOGISTICA_OUTBOX_BACKOFF_BASE_SEGUNDOS:30}
donatrack.logistica.acuse-timeout-ms=${LOGISTICA_ACUSE_TIMEOUT_MS:5000}
donatrack.logistica.proveedor.donatrack.transporte=amqp
donatrack.logistica.proveedor.externo.transporte=http
donatrack.logistica.proveedor.externo.url=${LOGISTICA_EXTERNA_URL:http://localhost:8084}
donatrack.logistica.proveedor.externo.connect-timeout-ms=${LOGISTICA_EXTERNA_CONNECT_TIMEOUT_MS:1000}
donatrack.logistica.proveedor.externo.read-timeout-ms=${LOGISTICA_EXTERNA_READ_TIMEOUT_MS:3000}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASS:donatrack}
# Acuse de recibo y devolución al remitente: los usa el adapter AMQP del broker de logística
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true