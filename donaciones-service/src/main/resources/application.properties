server.port=${PORT:8080}
spring.application.name=donaciones-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

// TODO: Utilizar variables de entorno
donatrack.openapi.title=DonaTrack - Servicio de Donaciones
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar personas donantes, donaciones, entidades beneficiarias, necesidades y asignaciones.
donatrack.openapi.server-url=http://localhost:8080
donatrack.openapi.server-description=Servicio de Donaciones local
donatrack.notificaciones.url=${NOTIFICACIONES_SERVICE_URL:http://localhost:8081}
donatrack.incentivos.url=${INCENTIVOS_SERVICE_URL:http://localhost:8082}
donatrack.normalizacion.umbral-aceptacion=${UMBRAL_NORMALIZACION:1.0}
planificador.algoritmos.cron.expression=${PLANIFICADOR_ALGORITMOS_CRON:0 0 0 * * ?}