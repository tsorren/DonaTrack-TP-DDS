# Reactivar autoconfiguración de base de datos relacional
spring.autoconfigure.exclude=

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donaciones?currentSchema=donaciones}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:donaciones_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Los adapters devuelven dominio, no entidades: no hace falta mantener la sesión abierta en la vista
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=donaciones
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Carga las colecciones lazy de a lotes en vez de una consulta por entidad (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=donaciones
spring.flyway.locations=classpath:db/migration
# Con base persistente el catálogo se siembra por defecto: sin categorías el matching no funciona.
# El seeder es idempotente (no inserta si ya hay categorías); SEED_CATALOGO_ENABLED=false lo apaga.
donatrack.catalogo.seed-enabled=${SEED_CATALOGO_ENABLED:true}

# MinIO encendido en el perfil postgres (override con DONACIONES_MINIO_ENABLED=false si no hay MinIO)
donaciones.minio.enabled=${DONACIONES_MINIO_ENABLED:true}
