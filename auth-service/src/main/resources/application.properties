server.port=${PORT:8084}
spring.application.name=auth-service
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# [INFERRED] subclaves de donatrack.openapi.* a confirmar contra notificaciones-service
donatrack.openapi.title=DonaTrack - auth-service
donatrack.openapi.version=1.0
donatrack.openapi.description=IdP de DonaTrack: cuentas, roles y administración de solicitudes
donatrack.openapi.server-url=http://localhost:8084

# --- Contrato del IdP (ver README, sección contrato) ---
auth.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8084}
auth.audiencia=donatrack-api
auth.jwt.access-ttl-minutos=15
auth.jwt.refresh-ttl-horas=8
auth.jwt.permitir-clave-efimera=false
auth.jwt.private-key-pem=${AUTH_JWT_PRIVATE_KEY_PEM:}
auth.jwt.previous-public-keys-pem=${AUTH_JWT_PREVIOUS_PUBLIC_KEYS_PEM:}

# --- RNF-AUTH-07: bloqueo por fuerza bruta ---
auth.bloqueo.max-intentos=5
auth.bloqueo.ventana-minutos=15
auth.bloqueo.duracion-minutos=15

# --- Sesión SSO: Secure true salvo que se desactive explícitamente (solo local HTTP) ---
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# --- Social login: el botón solo aparece si ambas variables existen ---
auth.social.google.client-id=${GOOGLE_CLIENT_ID:}
auth.social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.social.vincular-sin-password-si-email-verificado=false

# --- Seed del primer ADMIN (solo si no existe ninguno) ---
auth.seed.admin-email=${AUTH_ADMIN_EMAIL:}
auth.seed.admin-password=${AUTH_ADMIN_PASSWORD:}
