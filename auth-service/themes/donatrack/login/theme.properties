# Tema de login, registro y demás pantallas de Keycloak con la identidad Raíces (SPEC-06 E2-09). Extiende keycloak.v2 (PatternFly 5).
parent=keycloak.v2
# El sitio tiene una sola piel (tokens.css, sin modo oscuro): el login tampoco, para que quien tiene el sistema en
# oscuro no pase de un sitio crema a una pantalla oscura. Con esto Keycloak declara `color-scheme: light` y no agrega
# el script que cambia de modo.
darkMode=false
# `styles` reemplaza al del tema base: se repite css/styles.css. tokens.css es una copia idéntica de la del sitio
# (D20, `scripts/sincronizar_tema.py`) y el CSS propio va al final, para ganarle a PatternFly.
styles=css/styles.css css/tokens.css css/donatrack.css
