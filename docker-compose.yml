services:
  notificaciones-service:
    image: donatrack/notificaciones-service:local
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
      target: local
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - donatrack-network

  incentivos-service:
    image: donatrack/incentivos-service:local
    build:
      context: .
      dockerfile: incentivos-service/Dockerfile
      target: local
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - N8N_INSIGNIA_WEBHOOK_URL=http://n8n:5678/webhook/insignia-ganada
      - N8N_RANKING_WEBHOOK_URL=http://n8n:5678/webhook/ranking-calculado
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - donatrack-network

  donaciones-service:
    image: donatrack/donaciones-service:local
    build:
      context: .
      dockerfile: donaciones-service/Dockerfile
      target: local
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - INCENTIVOS_SERVICE_URL=http://incentivos-service:8082
      - LOGISTICA_SERVICE_URL=http://logistica-service:8083
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - RABBITMQ_HOST=rabbitmq
      - SEED_CATALOGO_ENABLED=false
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - donatrack-network

  logistica-service:
    image: donatrack/logistica-service:local
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: local
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - LOGISTICA_MAX_DONACIONES_POR_LOTE=${LOGISTICA_MAX_DONACIONES_POR_LOTE:-100}
      - RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - donatrack-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=donatrack
      - RABBITMQ_DEFAULT_PASS=donatrack
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - donatrack-network

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_METRICS_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - ./n8n:/etc/n8n/workflows
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5678/healthz', (res) => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
      start_interval: 1s
    networks:
      - donatrack-network

networks:
  donatrack-network:
    driver: bridge