version: '3.8'

services:
  notificaciones-service:
    image: donatrack/notificaciones-service:local
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
      target: local
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
    volumes:
      - ./logs:/app/logs
    networks:
      - donatrack-network

  incentivos-service:
    image: donatrack/incentivos-service:local
    build:
      context: .
      dockerfile: incentivos-service/Dockerfile
      target: local
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - N8N_INSIGNIA_WEBHOOK_URL=http://n8n:5678/webhook/insignia-ganada
      - N8N_RANKING_WEBHOOK_URL=http://n8n:5678/webhook/ranking-calculado
    depends_on:
      - notificaciones-service
      - n8n
    volumes:
      - ./logs:/app/logs
    networks:
      - donatrack-network

  donaciones-service:
    image: donatrack/donaciones-service:local
    build:
      context: .
      dockerfile: donaciones-service/Dockerfile
      target: local
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - INCENTIVOS_SERVICE_URL=http://incentivos-service:8082
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-donatrack}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-donatrack}
    depends_on:
      rabbitmq:
        condition: service_healthy
      notificaciones-service:
        condition: service_started
      incentivos-service:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - donatrack-network

  logistica-service:
    image: donatrack/logistica-service:local
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: local
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - RUTEADOR_EXTERNO_URL=${RUTEADOR_EXTERNO_URL:-http://localhost:8090}
      - LOGISTICA_MAX_DONACIONES_POR_LOTE=${LOGISTICA_MAX_DONACIONES_POR_LOTE:-100}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-donatrack}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-donatrack}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - donatrack-network

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/etc/n8n/workflows
    networks:
      - donatrack-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Panel de administración web
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-donatrack}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-donatrack}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - donatrack-network

networks:
  donatrack-network:
    driver: bridge

volumes:
  n8n_data: