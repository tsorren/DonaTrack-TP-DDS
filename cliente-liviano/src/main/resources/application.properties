spring.application.name=cliente-liviano
server.port=${PORT:8090}

management.endpoints.web.exposure.include=health

# De dónde saca sus datos cada puerto: rest (la API) o maqueta (datos de ejemplo).
cliente.datos.ranking=rest
cliente.datos.donaciones=rest
cliente.datos.recibidas=rest
# Sin login, la cuenta llega por ?donante=<id> o ?entidad=<id> (F4 lo cambia por el usuario de la sesión).
cliente.datos.cuenta=parametro
cliente.api.incentivos.url=${INCENTIVOS_URL:http://localhost:8082}
cliente.api.donaciones.url=${DONACIONES_URL:http://localhost:8080}
cliente.api.logistica.url=${LOGISTICA_URL:http://localhost:8083}
