spring.application.name=cliente-liviano
server.port=${PORT:8090}

management.endpoints.web.exposure.include=health

# De dónde saca sus datos cada puerto: rest (la API) o maqueta (datos de ejemplo). La cuenta
# la da el token del ingreso; el perfil maqueta usa la de ejemplo. Las claves de la conexión de
# pantallas (SPEC-08) las fija el esqueleto: publico y contacto (frente publico); donaciones,
# donante y misiones (donante); recibidas y entidad (entidad); admin-personas; admin-operacion y
# ranking; avisos (el conteo de sin leer de la cabecera, compartido).
cliente.datos.ranking=rest
cliente.datos.donaciones=rest
cliente.datos.recibidas=rest
cliente.datos.publico=rest
cliente.datos.contacto=rest
cliente.datos.donante=rest
cliente.datos.misiones=rest
cliente.datos.entidad=rest
cliente.datos.admin-personas=rest
cliente.datos.admin-operacion=rest
cliente.datos.avisos=rest
cliente.api.incentivos.url=${INCENTIVOS_URL:http://localhost:8082}
cliente.api.donaciones.url=${DONACIONES_URL:http://localhost:8080}
cliente.api.logistica.url=${LOGISTICA_URL:http://localhost:8083}
cliente.api.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8081}

# Límites de espera de las llamadas a las APIs (R11-04). Pasado el límite, la llamada falla y el
# visitante ve la página de falla con su código de soporte, en vez de una pantalla colgada.
# conexión: abrir la conexión; lectura: que la API empiece a responder; subida: lo mismo para las
# llamadas que suben un archivo (CSV de donantes y fotos del acta), que tardan más. Los del
# gateway (api-gateway) van un poco por debajo de estos, para que él conteste primero.
cliente.http.timeout-conexion=${CLIENTE_HTTP_TIMEOUT_CONEXION:3s}
cliente.http.timeout-lectura=${CLIENTE_HTTP_TIMEOUT_LECTURA:15s}
cliente.http.timeout-subida=${CLIENTE_HTTP_TIMEOUT_SUBIDA:120s}

# Subidas (sin esto rige el tope de 1 MB de Spring): las fotos del acta de Confirmar recepción, que
# Logística acepta hasta 5 MB cada una y 25 MB por pedido, y el CSV de Importar donantes, que
# Donaciones acepta hasta 50 MB. El servicio que recibe aplica su propio tope.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Ingreso con Keycloak (fuera del perfil maqueta). El secreto es el de CLIENTE_LIVIANO_SECRET del
# realm; el issuer se descubre al arrancar, así que Keycloak tiene que estar levantado.
# (Spring no reconoce un #--- pegado a un comentario: va con una línea en blanco antes.)

#---
spring.config.activate.on-profile=!maqueta
spring.security.oauth2.client.registration.keycloak.client-id=cliente-liviano
spring.security.oauth2.client.registration.keycloak.client-secret=${CLIENTE_LIVIANO_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/donatrack}
# El token técnico del sitio (cuenta de servicio de cliente-liviano): altas en Donaciones y Admin API.
spring.security.oauth2.client.registration.servicio.provider=keycloak
spring.security.oauth2.client.registration.servicio.client-id=cliente-liviano
spring.security.oauth2.client.registration.servicio.client-secret=${CLIENTE_LIVIANO_SECRET}
spring.security.oauth2.client.registration.servicio.authorization-grant-type=client_credentials

# Sesión del sitio (SPEC-06 E2-02, D5). Apagada, vive en memoria y no hace falta base de datos: así siguen
# andando la maqueta y los tests. El compose la enciende con CLIENTE_SESIONES_JDBC_HABILITADO=true y pasa
# CLIENTE_SESIONES_JDBC_URL, _USUARIO y _CLAVE (la base `cliente`); ver SesionesJdbcConfig.
cliente.sesiones.jdbc.habilitado=${CLIENTE_SESIONES_JDBC_HABILITADO:false}
cliente.sesiones.inactividad-minutos=${CLIENTE_SESIONES_INACTIVIDAD_MINUTOS:30}
# El DataSource y el store de sesión los arma SesionesJdbcConfig, no Spring Boot. Si alguna versión de Boot
# los autoconfigurara al ver las librerías en el classpath, fallaría en cada contexto sin base de datos. Una
# clase que no existe en la versión en uso se ignora sin error.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.session.SessionAutoConfiguration,\
  org.springframework.boot.session.autoconfigure.SessionAutoConfiguration
