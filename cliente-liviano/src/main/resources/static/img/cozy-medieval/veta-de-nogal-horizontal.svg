<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 72">
  <!-- La misma veta de nogal, a lo ancho, para la barra de abajo del celular. Dibujo propio de la
       Alternativa Cozy / Medieval, de un solo color: app.css lo usa como máscara. Cada línea
       empieza y termina a la misma altura, para que el dibujo se repita hacia el costado. -->
  <g fill="none" stroke="#000" stroke-linecap="round">
    <path d="M0 5C160 8 320 2 480 5" stroke-width="1" stroke-opacity="0.6"/>
    <path d="M0 13C160 9 320 17 480 13" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M0 22C160 25 320 19 480 22" stroke-width="0.9" stroke-opacity="0.65"/>
    <path d="M0 30C120 30 220 27 280 26C320 25 350 25 380 27C420 29 450 30 480 30"
          stroke-width="1.3" stroke-opacity="0.5"/>
    <path d="M0 44C120 44 220 47 280 48C320 49 350 49 380 47C420 45 450 44 480 44"
          stroke-width="1.6" stroke-opacity="0.45"/>
    <path d="M0 53C160 57 320 49 480 53" stroke-width="2.4" stroke-opacity="0.3"/>
    <path d="M0 61C160 58 320 64 480 61" stroke-width="1" stroke-opacity="0.6"/>
    <path d="M0 68C160 70 320 66 480 68" stroke-width="1.4" stroke-opacity="0.45"/>
  </g>
  <!-- El nudo, entre las dos líneas que se abren. -->
  <g fill="none" stroke="#000">
    <ellipse cx="330" cy="37" rx="22" ry="7" stroke-width="1" stroke-opacity="0.3"/>
    <ellipse cx="330" cy="37" rx="11" ry="3.6" stroke-width="1.2" stroke-opacity="0.55"/>
  </g>
</svg>
