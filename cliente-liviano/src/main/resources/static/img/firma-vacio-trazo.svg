        d="M3 32C12 33 18 27 24 22C30 16 40 15 40 22C40 28 31 28 31 22C31 16 44 22 52 25C58 27 63 18 69 15"/>
  <use href="#abeja" transform="translate(50 25) scale(0.8)"/>
  <use href="#abeja" transform="translate(80 15)"/>
</svg>
