<!DOCTYPE html>
<!--/* Estructura de las páginas públicas que no son la portada (Entregas confirmadas, Mapa,
       Entidades, Ingresar, Crear una cuenta, los registros, Contacto y Términos y privacidad): la
       cabecera con la marca y la navegación pública, el contenido y el pie. La portada tiene la
       suya, por su lámina a todo el ancho. La usan todas las públicas
       salvo la portada.
       Uso: <html th:replace="~{layout-publico :: pagina(~{::title}, 'hoja', ~{::contenido})}">,
       donde 'hoja' es el nombre de la hoja de la pantalla en css/. La navegación
       (navegacion-publica.html) marca la sección de la hoja: cada sección tiene la suya, con su
       nombre (publico-donaciones, publico-mapa, publico-entidades, publico-ingresar y
       publico-registro, que usan también los dos registros). Contacto y Términos (publico-paginas)
       son pantallas aprobadas antes de la corrida A/B y el sitio A no las toca (encargo
       raices-ab-navegable.md, sección 1): no llevan la navegación pública, ni su hoja ni su script. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, hoja, contenido)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="stylesheet" href="/css/publico-paginas.css"
        th:href="@{/css/{hoja}.css(hoja=${hoja})}">
  <link th:if="${hoja != 'publico-paginas'}" rel="stylesheet" href="/css/publico-navegacion.css"
        th:href="@{/css/publico-navegacion.css}">
</head>
<body class="raices-publico">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="raices-cabecera">
  <a class="marca" href="/publico-portada" th:href="@{/publico-portada}"
     aria-label="DonaTrack, ir a la portada">
    <img src="/img/logo.svg" th:src="@{/img/logo.svg}" alt="" width="18" height="24">
    <span>Dona<em>Track</em></span>
  </a>
  <th:block th:if="${hoja != 'publico-paginas'}"><nav th:replace="~{navegacion-publica :: navegacion(${hoja})}"></nav></th:block>
</header>
<main id="contenido" tabindex="-1" th:insert="${contenido}"></main>
<footer th:replace="~{pie :: pie}"></footer>
<script th:if="${hoja != 'publico-paginas'}" src="/js/publico.js" th:src="@{/js/publico.js}" defer></script>
</body>
</html>
