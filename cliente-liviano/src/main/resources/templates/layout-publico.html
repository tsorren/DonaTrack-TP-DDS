<!DOCTYPE html>
<!--/* Estructura de las páginas públicas que no son la portada (Entregas confirmadas, Mapa,
       Entidades, Ingresar, Crear una cuenta, los registros, Contacto y Términos y privacidad): la
       cabecera con la marca y la navegación pública, el contenido y el pie. La portada tiene la
       suya, por su lámina a todo el ancho. La usan todas las públicas
       salvo la portada.
       Uso: <html th:replace="~{layout-publico :: pagina(~{::title}, 'hoja', ~{::contenido})}">,
       donde 'hoja' es el nombre de la hoja de la pantalla en css/. La navegación
       (navegacion-publica.html) marca la sección de la hoja: cada sección tiene la suya, con su
       nombre (publico-donaciones, publico-mapa, publico-entidades, publico-ingresar y
       publico-registro, que usan también los dos registros). Contacto y Términos (publico-paginas)
       la llevan sin sección marcada desde el pulido del 2026-11-03 (usuario): antes, en el celular,
       la marca era la única salida. Con la sesión iniciada, la cabecera muestra la cuenta y "Ir a
       mi inicio" (docs/interfaz/flujos/r11-p1-portada.md, R11-15). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, hoja, contenido)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="stylesheet" href="/css/publico-paginas.css"
        th:href="@{/css/{hoja}.css(hoja=${hoja})}">
  <link rel="stylesheet" href="/css/publico-navegacion.css"
        th:href="@{/css/publico-navegacion.css}">
  <link th:if="${varianteCss}" rel="stylesheet" href="/css/variantes/variante.css"
        th:href="@{/css/variantes/{nombre}.css(nombre=${varianteCss})}">
  <th:block th:replace="~{interaccion :: cargar}"></th:block>
</head>
<body class="raices-publico">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="raices-cabecera">
  <a class="marca" href="/publico-portada" th:href="@{/publico-portada}"
     aria-label="DonaTrack, ir a la portada">
    <img src="/img/logo.svg" th:src="@{/img/logo.svg}" alt="" width="18" height="24">
    <span>Dona<em>Track</em></span>
  </a>
  <nav th:replace="~{navegacion-publica :: navegacion(${hoja})}"></nav>
  <th:block th:replace="~{navegacion-publica :: cuenta}"></th:block>
</header>
<main id="contenido" tabindex="-1" hx-target="#contenido" hx-select="#contenido" hx-swap="outerHTML show:none" th:insert="${contenido}"></main>
<footer th:replace="~{pie :: pie}"></footer>
<!--/* La región de los avisos breves, igual que en layout-privado. */-->
<div id="avisos" class="avisos" aria-live="polite" x-data="avisos" x-on:click="cerrar"
     x-on:mouseenter="pausar" x-on:mouseleave="seguir" x-on:focusin="pausar" x-on:focusout="seguir"><th:block th:if="${avisoDelServidor}"><p th:replace="~{envio :: aviso(${avisoDelServidor})}"></p></th:block></div>
<script src="/js/publico.js" th:src="@{/js/publico.js}" defer></script>
</body>
</html>
