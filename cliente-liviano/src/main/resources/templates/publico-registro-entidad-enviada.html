<!DOCTYPE html>
<!--/* Raíces, sitio A: Solicitud enviada (ficha docs/interfaz/flujos/raices-publico-navegable.md, 4.7):
       el sello de recibido, qué pasa ahora y "Cómo sigue" con el paso 2 como actual. Sin plazo de
       revisión: no hay uno acordado. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-publico :: pagina(~{::title}, 'publico-registro', ~{::contenido})}">
<head>
  <title>Solicitud recibida - Crear una cuenta - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <div class="publica cuenta cuenta--enviada">
    <div class="recibido" role="status">
      <svg viewBox="-30 -30 64 64" aria-hidden="true" focusable="false">
        <circle class="sello-tinta" cx="4" cy="4" r="26"/><circle class="sello-disco" r="26"/>
        <path class="sello-calado sello-calado--fino" d="M-10 1L-3 8L11 -7"/>
      </svg>
      <p class="recibido-sello">Solicitud recibida</p>
    </div>
    <h1>Recibimos la solicitud <em>de tu entidad</em></h1>
    <p class="lectura-bajada">El equipo de DonaTrack la revisa antes de sumarla. Te escribimos al correo que
      dejaste cuando esté aprobada; desde ese día podés ingresar y publicar lo que le hace falta a tu
      entidad.</p>
    <section th:replace="~{publico-registro-entidad :: comoSigue(2)}"></section>
    <div class="salidas">
      <a class="boton" data-tono="principal" href="/publico-entidades"
         th:href="@{/publico-entidades}">Ver las entidades y lo que piden</a>
      <a class="boton" data-tono="secundario" href="/publico-portada"
         th:href="@{/publico-portada}">Ir a la portada</a>
    </div>
  </div>
</th:block>
</body>
</html>
