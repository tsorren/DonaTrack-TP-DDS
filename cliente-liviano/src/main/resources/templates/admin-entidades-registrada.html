<!DOCTYPE html>
<!--/* La organización quedó registrada, solo en la maqueta (DA-06, ADM2-13: sin página de respuesta
       propia). Es Organizaciones (admin-entidades :: hoja('')) con el aviso breve del registro; los
       datos de la lista los arma AdminEntidadesController como en /admin-entidades. Fuera de la
       maqueta, el envío vuelve a /admin-entidades con el aviso del servidor
       (AdminEntidadesEnvioController), con el mismo texto. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'admin-secciones', ~{::contenido})}">
<head>
  <title>Organización registrada - Organizaciones - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <!--/* El aviso breve, debajo de la cabecera de Organizaciones como en las otras respuestas
         (admin-donaciones :: hecho, que la hoja lee de avisoHecho). Fuera de la maqueta lo trae el
         layout (envio :: aviso). */-->
  <th:block th:with="avisoHecho='Registraste a Escuela Ejemplo N.º 5. Queda activa: la registraste vos, no necesita aprobación.'">
    <th:block th:replace="~{admin-entidades :: hoja('')}"></th:block>
  </th:block>
</th:block>
</body>
</html>
