<!DOCTYPE html>
<!--/* Estructura de las pantallas privadas: la marca, el
       menú del rol, la campana de notificaciones y la foto de perfil con el menú de la cuenta en una sola cabecera de papel (piel Huerta, 2026-11-08); el contenido debajo. En el
       celular, el menú es una barra inferior; desde la tableta, va horizontal en la cabecera
       (privado.css; usuario, 2026-11-03). La usan todas las pantallas privadas.
       Uso: <html th:replace="~{layout-privado :: pagina(~{::title}, 'hoja', ~{::contenido})}">,
       donde 'hoja' es el nombre de la hoja de la pantalla en css/. El modelo trae
       navegacion (List<OpcionNavegacion>), cuenta (CuentaVista) y perfil (la dirección de Mi perfil
       del rol). Al final, el pie de todas las páginas (pie.html). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, hoja, contenido)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="stylesheet" href="/css/privado.css"
        th:href="@{/css/{hoja}.css(hoja=${hoja})}">
  <link th:if="${varianteCss}" rel="stylesheet" href="/css/variantes/variante.css"
        th:href="@{/css/variantes/{nombre}.css(nombre=${varianteCss})}">
  <link th:if="${hoja == 'donante-misiones'}" rel="stylesheet"
        href="/css/variantes/misiones-b.css">
  <th:block th:replace="~{interaccion :: cargar}"></th:block>
</head>
<body class="raices-privado">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="armazon">
  <a class="marca" href="/publico-portada" th:href="@{/publico-portada}"
     aria-label="DonaTrack, ir a la portada">
    <img src="/img/logo.svg" th:src="@{/img/logo.svg}" alt="" width="18" height="24">
    <span>Dona<em>Track</em></span>
  </a>
  <nav id="menu" class="navegacion" aria-label="Secciones">
    <ul role="list">
      <li th:each="opcion : ${navegacion}"><a href="#" th:href="${opcion.ruta}"
          th:aria-current="${opcion.actual} ? 'page' : null" th:text="${opcion.texto}">Sección</a></li>
      <!--/* Con más de 5 secciones (la administración), en el celular la barra muestra las 4 primeras y
             "Más", que abre todas en una hoja desde abajo, una fila por sección (pulido, 2026-11-03,
             alternativa del usuario; A/B del panel, F). Es una ventana del navegador (popover): anda sin
             JavaScript. Desde la tableta, "Más" no se ve: el menú entra entero en la cabecera. */-->
      <li th:if="${#lists.size(navegacion) > 5}" class="navegacion-mas">
        <button type="button" popovertarget="menu-completo"><span aria-hidden="true">+</span>
          Más</button>
        <div id="menu-completo" class="navegacion-hoja" popover role="dialog"
             aria-labelledby="menu-completo-titulo">
          <div class="navegacion-hoja-cabecera">
            <!--/* "Todas las secciones": el menú ya se llama "Secciones" (pulido de Nico, 2026-11-04). */-->
            <p id="menu-completo-titulo" class="navegacion-hoja-titulo">Todas las secciones</p>
            <button class="boton" data-tono="secundario" type="button" popovertarget="menu-completo"
                    popovertargetaction="hide">Cerrar</button>
          </div>
          <!--/* Al abrirse, el foco entra a la hoja, en la primera sección (autofocus de la ventana). */-->
          <ul role="list">
            <li th:each="opcion, vuelta : ${navegacion}"><a href="#" th:href="${opcion.ruta}"
                th:autofocus="${vuelta.first}"
                th:aria-current="${opcion.actual} ? 'page' : null" th:text="${opcion.texto}">Sección</a></li>
          </ul>
        </div>
      </li>
    </ul>
  </nav>
  <!--/* El acceso fijo a Notificaciones del donante y de la entidad (fichas raices-donante-navegable.md
         y raices-entidad-navegable.md, sección 2): no es una sección del menú; va en todas las
         pantallas del rol, con la cantidad sin leer. En la maqueta son 4 del donante y 3 de la
         entidad, y ninguna en la pantalla de después de marcarlas como leídas (al volver a otra
         pantalla, la cuenta vuelve a la de ejemplo: límite de la maqueta). Un agregado: no mueve nada.
         Desde la conexión de pantallas (SPEC-08) la cantidad la trae el modelo (sinLeer, de
         Pantallas y el puerto AvisosSinLeer): en la maqueta, las de ejemplo; fuera, Notificaciones.
         Desde el pulido del 2026-11-03 va también en Mi perfil, Seguimiento, Necesidades y Confirmar
         recepción, que la corrida A/B había dejado sin tocar. Con la cuenta de la persona que dona
         (F5), las 3 sin leer de su bandeja (templates/persona/donante-notificaciones.html). */-->
  <a th:if="${perfil != null and (#strings.endsWith(perfil, '/donante-perfil') or #strings.endsWith(perfil, '/entidad-perfil'))}"
     th:with="pantalla=${#execInfo.processedTemplateName},
              avisos=${#strings.replace(perfil, '-perfil', '-notificaciones')},
              sinLeer=${#strings.endsWith(pantalla, '-leidas') ? 0 : sinLeer}"
     class="armazon-avisos" href="/donante-notificaciones"
     th:href="${avisos}"
     th:aria-label="${sinLeer > 0} ? |Notificaciones, ${sinLeer} sin leer| : 'Notificaciones'"
     th:aria-current="${#strings.contains(pantalla, #strings.substringAfter(avisos, '/'))} ? 'page' : null">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
      <path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/>
    </svg>
    <span class="armazon-avisos-texto">Notificaciones</span>
    <b th:if="${sinLeer > 0}" class="armazon-avisos-cuenta" th:text="${sinLeer}">4</b>
  </a>
  <!--/* La campana de la administración (usuario, ronda 2026-11-09: "agregá la bell de notificaciones"):
         la misma pieza, hacia admin-notificaciones, con 3 sin leer en la maqueta y ninguna después de
         marcarlas como leídas. Se reconoce por su Mi perfil (R11-10: la administración tiene el suyo).
         Un agregado: no cambia la de los otros roles ni el controlador. */-->
  <a th:if="${perfil != null and #strings.endsWith(perfil, '/admin-perfil')}"
     th:with="pantalla=${#execInfo.processedTemplateName},
              sinLeer=${#strings.endsWith(pantalla, '-leidas') ? 0 : sinLeer}"
     class="armazon-avisos" href="/admin-notificaciones" th:href="@{/admin-notificaciones}"
     th:aria-label="${sinLeer > 0} ? |Notificaciones, ${sinLeer} sin leer| : 'Notificaciones'"
     th:aria-current="${#strings.contains(pantalla, 'admin-notificaciones')} ? 'page' : null">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
      <path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/>
    </svg>
    <span class="armazon-avisos-texto">Notificaciones</span>
    <b th:if="${sinLeer > 0}" class="armazon-avisos-cuenta" th:text="${sinLeer}">3</b>
  </a>
  <!--/* La cuenta: la foto de perfil y su menú (cuenta-menu.html), el mismo que lo público muestra
         con la sesión iniciada (docs/interfaz/flujos/r11-p1-portada.md). */-->
  <details th:replace="~{cuenta-menu :: menu}"></details>
</header>
<main id="contenido" tabindex="-1" hx-target="#contenido" hx-select="#contenido" hx-swap="outerHTML show:none" th:insert="${contenido}"></main>
<footer th:replace="~{pie :: pie}"></footer>
<!--/* Los avisos breves se agregan acá: los lectores de pantalla los anuncian, y la cola de Alpine
       (avisos, static/js/interfaz.js) deja ver tres a la vez y los quita a los 6 segundos. */-->
<div id="avisos" class="avisos" aria-live="polite" x-data="avisos" x-on:click="cerrar"
     x-on:mouseenter="pausar" x-on:mouseleave="seguir" x-on:focusin="pausar" x-on:focusout="seguir"><th:block th:if="${avisoDelServidor}"><p th:replace="~{envio :: aviso(${avisoDelServidor})}"></p></th:block></div>
</body>
</html>
