<!DOCTYPE html>
<!--/* Estructura de las páginas públicas de Raíces que no son la portada (Entregas confirmadas, Mapa,
       Entidades, Ingresar, Crear una cuenta, los registros, Contacto y Términos y privacidad): la
       cabecera con la marca y la navegación pública, el contenido y el pie. La portada tiene la
       suya, por su lámina a todo el ancho. No es un juego de plantillas: solo lo usa el prototipo
       (ADR 20261101).
       Uso: <html th:replace="~{prototipo/raices/layout-publico :: pagina(~{::title}, 'hoja', ~{::contenido})}">,
       donde 'hoja' es el nombre de la hoja de la pantalla en css/prototipo/raices/. La navegación
       (navegacion-publica.html) marca la sección de la hoja: cada sección tiene la suya, con su
       nombre (publico-donaciones, publico-mapa, publico-entidades, publico-ingresar y
       publico-registro, que usan también los dos registros); Contacto y Términos usan
       publico-paginas y no marcan ninguna. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, hoja, contenido)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="stylesheet" href="/css/prototipo/raices/publico-paginas.css"
        th:href="@{/css/prototipo/raices/{hoja}.css(hoja=${hoja})}">
  <link rel="stylesheet" href="/css/prototipo/raices/publico-navegacion.css"
        th:href="@{/css/prototipo/raices/publico-navegacion.css}">
</head>
<body class="raices-publico">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="raices-cabecera">
  <a class="marca" href="/prototipo/raices/publico-portada" th:href="@{/prototipo/raices/publico-portada}"
     aria-label="DonaTrack, ir a la portada">
    <img src="/img/logo.svg" th:src="@{/img/logo.svg}" alt="" width="18" height="24">
    <span>Dona<em>Track</em></span>
  </a>
  <nav th:replace="~{prototipo/raices/navegacion-publica :: navegacion(${hoja})}"></nav>
</header>
<main id="contenido" tabindex="-1" th:insert="${contenido}"></main>
<footer th:replace="~{prototipo/raices/pie :: pie}"></footer>
<script src="/js/raices-publico.js" th:src="@{/js/raices-publico.js}" defer></script>
</body>
</html>
