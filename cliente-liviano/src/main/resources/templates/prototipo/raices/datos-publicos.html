<!DOCTYPE html>
<!--/* Raíces, sitio A: los datos de ejemplo de las páginas públicas (ficha
       docs/interfaz/flujos/raices-publico-navegable.md, sección 6.3), escritos una sola vez para
       Entregas confirmadas, Mapa y Entidades. No es una pantalla: su nombre no empieza con un rol,
       así que PrototipoController no la muestra. Sintéticos; "hoy" es el 15 de octubre de 2026.
       Uso: <th:block th:replace="~{prototipo/raices/datos-publicos :: datos(~{::pantalla})}">, con
       <th:block th:fragment="pantalla"> en la página. Adentro están:
       - entregas: las 10 confirmadas del último mes, la más reciente primero (semana: entra en la
         última semana).
       - entidades: las 6 con pedidos vigentes, en el orden de la portada; numero es su estación en
         el mapa (null si no confirmó entregas en el período) y x, y, su barrio en el dibujo.
       - categorias: las del catálogo, con su nombre y cómo se dice dentro de una frase.
       - categoria: la elegida en ?categoria=, solo si es una de esas; si no, ''.
       ponytail: datos fijos del caso de ejemplo; en el sistema salen del modelo (HB-01, HB-07,
       HB-08, HB-15 y HB-18). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="datos(pantalla)"
    th:with="fotoComedor='/img/ejemplo-entrega.svg', fotoRopa='/img/raices/ejemplo-entrega-ropa.svg',
             fotoSillas='/img/raices/ejemplo-entrega-sillas.svg',
             altComedor='Cajas con la donación junto a la puerta del comedor',
             categorias=${ {
      {clave: 'alimentos', texto: 'Alimentos', enFrase: 'alimentos'},
      {clave: 'ropa', texto: 'Ropa', enFrase: 'ropa'},
      {clave: 'muebles', texto: 'Muebles', enFrase: 'muebles'},
      {clave: 'escolares', texto: 'Útiles escolares', enFrase: 'útiles escolares'} } },
             categoria=${param.categoria != null and #lists.contains({'alimentos', 'ropa', 'muebles', 'escolares'}, param.categoria[0]) ? param.categoria[0] : ''},
             entregas=${ {
      {que: 'Sillas, 6 unidades', cat: 'muebles', entidad: 'Escuela Ejemplo N.º 12', barrio: 'Centro Ejemplo',
       dia: '14 de octubre', fecha: '2026-10-14', semana: true, foto: fotoSillas, alt: 'Sillas apiladas en un aula'},
      {que: 'Lentejas secas, 10 kg', cat: 'alimentos', entidad: 'Comedor Barrio Ejemplo', barrio: 'Barrio Ejemplo',
       dia: '10 de octubre', fecha: '2026-10-10', semana: true, foto: fotoComedor, alt: altComedor},
      {que: 'Arroz, 5 kg', cat: 'alimentos', entidad: 'Comedor Barrio Ejemplo', barrio: 'Barrio Ejemplo',
       dia: '9 de octubre', fecha: '2026-10-09', semana: true, foto: fotoComedor, alt: altComedor},
      {que: 'Ropa de abrigo, 12 prendas', cat: 'ropa', entidad: 'Merendero Ejemplo Sur', barrio: 'Ejemplo Sur',
       dia: '9 de octubre', fecha: '2026-10-09', semana: true, foto: fotoRopa,
       alt: 'Bolsas con ropa de abrigo junto a la puerta del merendero'},
      {que: 'Ropa de abrigo, 5 unidades', cat: 'ropa', entidad: 'Comedor Barrio Ejemplo', barrio: 'Barrio Ejemplo',
       dia: '8 de octubre', fecha: '2026-10-08', semana: true, foto: fotoRopa,
       alt: 'Bolsas con ropa de abrigo junto a la puerta del comedor'},
      {que: 'Frazadas, 10 unidades', cat: 'ropa', entidad: 'Hogar Casa Ejemplo', barrio: 'Parque Ejemplo',
       dia: '7 de octubre', fecha: '2026-10-07', semana: false, foto: fotoRopa,
       alt: 'Bolsas con frazadas junto a la puerta del hogar'},
      {que: 'Leche en polvo, 12 unidades', cat: 'alimentos', entidad: 'Comedor Barrio Ejemplo', barrio: 'Barrio Ejemplo',
       dia: '6 de octubre', fecha: '2026-10-06', semana: false, foto: fotoComedor, alt: altComedor},
      {que: 'Fideos secos, 8 kg', cat: 'alimentos', entidad: 'Comedor Barrio Ejemplo', barrio: 'Barrio Ejemplo',
       dia: '5 de octubre', fecha: '2026-10-05', semana: false, foto: fotoComedor, alt: altComedor},
      {que: 'Arroz, 10 kg', cat: 'alimentos', entidad: 'Comedor Barrio Ejemplo', barrio: 'Barrio Ejemplo',
       dia: '2 de octubre', fecha: '2026-10-02', semana: false, foto: fotoComedor, alt: altComedor},
      {que: 'Sillas, 4 unidades', cat: 'muebles', entidad: 'Biblioteca Popular Ejemplo', barrio: 'Villa Ejemplo',
       dia: '22 de septiembre', fecha: '2026-09-22', semana: false, foto: fotoSillas,
       alt: 'Sillas apiladas en la sala de lectura'} } },
             entidades=${ {
      {clave: 'comedor', numero: 1, tipo: 'Comedor', nombre: 'Comedor Barrio Ejemplo', barrio: 'Barrio Ejemplo',
       cat: 'alimentos', x: 230, y: 380,
       pedidos: { {que: 'Lentejas secas', cat: 'alimentos', falta: 'Faltan 30 de 40 kg este mes', cuando: 'Se repite cada mes',
                   porque: 'para el almuerzo de lunes a viernes.'},
                  {que: 'Arroz', cat: 'alimentos', falta: 'Faltan 25 de 40 kg este mes', cuando: 'Se repite cada mes',
                   porque: 'para el almuerzo de lunes a viernes.'},
                  {que: 'Aceite de girasol', cat: 'alimentos', falta: 'Faltan 20 litros', cuando: 'Hasta el 20 de octubre',
                   porque: 'para cocinar el almuerzo.'},
                  {que: 'Leche en polvo', cat: 'alimentos', falta: 'Faltan 12 de 24 unidades', cuando: 'Hasta el 25 de octubre',
                   porque: 'para la merienda de los más chicos.'},
                  {que: 'Ropa de abrigo', cat: 'ropa', falta: 'Faltan 25 de 30 unidades', cuando: 'Hasta el 15 de noviembre',
                   porque: 'para las familias del barrio que perdieron ropa en el temporal del 3 de octubre.'} } },
      {clave: 'escuela', numero: 2, tipo: 'Escuela', nombre: 'Escuela Ejemplo N.º 12', barrio: 'Centro Ejemplo',
       cat: 'muebles', x: 470, y: 250,
       pedidos: { {que: 'Sillas', cat: 'muebles', falta: 'Faltan 14 de 20 unidades', cuando: 'Hasta el 30 de noviembre',
                   porque: 'para el aula nueva de primer grado.'},
                  {que: 'Útiles escolares', cat: 'escolares', falta: 'Faltan 4 cajas', cuando: 'Hasta el 30 de noviembre',
                   porque: 'para los chicos de primer grado.'} } },
      {clave: 'merendero', numero: 3, tipo: 'Merendero', nombre: 'Merendero Ejemplo Sur', barrio: 'Ejemplo Sur',
       cat: 'alimentos', x: 340, y: 480,
       pedidos: { {que: 'Galletitas', cat: 'alimentos', falta: 'Faltan 10 de 20 kg este mes', cuando: 'Se repite cada mes',
                   porque: 'para la merienda de la tarde.'},
                  {que: 'Leche en polvo', cat: 'alimentos', falta: 'Faltan 20 unidades', cuando: 'Hasta el 31 de octubre',
                   porque: 'para la merienda de la tarde.'} } },
      {clave: 'hogar', numero: 4, tipo: 'Hogar', nombre: 'Hogar Casa Ejemplo', barrio: 'Parque Ejemplo',
       cat: 'ropa', x: 640, y: 400,
       pedidos: { {que: 'Frazadas', cat: 'ropa', falta: 'Faltan 10 de 20 unidades', cuando: 'Hasta el 15 de noviembre',
                   porque: 'para las camas del hogar.'} } },
      {clave: 'club', numero: null, tipo: 'Club', nombre: 'Club Ejemplo Norte', barrio: 'Ejemplo Norte',
       cat: 'ropa', x: null, y: null,
       pedidos: { {que: 'Camisetas deportivas', cat: 'ropa', falta: 'Faltan 15 unidades', cuando: 'Hasta el 30 de noviembre',
                   porque: 'para el equipo infantil de fútbol.'} } },
      {clave: 'biblioteca', numero: 5, tipo: 'Biblioteca', nombre: 'Biblioteca Popular Ejemplo', barrio: 'Villa Ejemplo',
       cat: 'muebles', x: 90, y: 480,
       pedidos: { {que: 'Sillas', cat: 'muebles', falta: 'Faltan 4 de 8 unidades', cuando: 'Hasta el 31 de diciembre',
                   porque: 'para la sala de lectura infantil.'} } } } }">
  <th:block th:insert="${pantalla}"></th:block>
</th:block>

<!--/* Piezas que repiten las públicas del sitio A.
       - avisoError(titulo, texto, volver, recargar): el error del servidor, con el código y
         "escribinos", que lleva a Contacto con el código y el regreso (volver: la pantalla);
         recargar, el botón "Volver a cargar" de las que cargan datos.
       - fotoVentana(id, e): la foto grande de una entrega, en el popover del navegador (se abre y
         se cierra sin JavaScript, con Esc o tocando afuera), con el texto de la portada.
       - filtroCategorias(leyenda, todas): las categorías de ?categoria=, como opciones con su
         ícono; va dentro de un formulario get [data-al-cambiar]. */-->
<section th:fragment="avisoError(titulo, texto, volver, recargar)" class="aviso aviso--error" role="alert"
         aria-labelledby="error-titulo">
  <h2 id="error-titulo" th:text="${titulo}">No pudimos cargar las entregas confirmadas.</h2>
  <p><th:block th:text="${texto}">Es un problema nuestro. Probá de nuevo en unos minutos;</th:block> si sigue,
    <a href="/prototipo/raices/publico-contacto?codigo=a1b2c3d4e5f6"
       th:href="@{/prototipo/raices/publico-contacto(codigo='a1b2c3d4e5f6',volver=${volver})}">escribinos</a>
    con este código.</p>
  <p class="aviso-codigo">Código: <code>a1b2c3d4e5f6</code></p>
  <a th:if="${recargar}" class="boton boton--secundario" href="/prototipo/raices/publico-donaciones"
     th:href="${volver}">Volver a cargar</a>
</section>

<div th:fragment="fotoVentana(id, e)" class="foto-ventana" th:id="${id}" popover role="dialog"
     th:attr="aria-labelledby=${id + '-titulo'}">
  <img src="/img/ejemplo-entrega.svg" th:src="@{${e.foto}}" th:alt="${e.alt}" width="640" height="400"
       loading="lazy">
  <p class="foto-titulo" th:id="${id + '-titulo'}" th:text="${e.que}">Sillas, 6 unidades</p>
  <p><th:block th:text="${e.entidad}">Escuela Ejemplo N.º 12</th:block> confirmó la entrega el
    <time th:datetime="${e.fecha}" th:text="|${e.dia} de 2026|">14 de
      octubre de 2026</time> y subió esta foto.</p>
  <button type="button" class="boton boton--secundario" th:attr="popovertarget=${id}"
          popovertargetaction="hide">Cerrar</button>
</div>

<fieldset th:fragment="filtroCategorias(leyenda, todas)" class="filtro-opciones">
  <legend th:text="${leyenda}">Qué se donó</legend>
  <label class="filtro-opcion"><input type="radio" name="categoria" value=""
         th:checked="${categoria == ''}"><span th:text="${todas}">Todas</span></label>
  <label th:each="c : ${categorias}" class="filtro-opcion"><input type="radio" name="categoria"
         th:value="${c.clave}" th:checked="${categoria == c.clave}"><svg class="filtro-icono"
         viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use th:href="${'#cat-' + c.clave}"
         href="#cat-alimentos"/></svg><span th:text="${c.texto}">Alimentos</span></label>
</fieldset>
</body>
</html>
