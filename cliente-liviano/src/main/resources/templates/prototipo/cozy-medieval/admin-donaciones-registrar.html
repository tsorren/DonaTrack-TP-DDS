<!DOCTYPE html>
<!--/* Prototipo, admin (iteración 3): registrar una donación (nivel 3, cuelga de Donaciones). El
       mismo libro del depósito, con un renglón nuevo: el formulario en la hoja, los campos en el
       orden en que se lee el remito (quién, qué, cuánto y cuándo vence) y la ayuda donde hay duda.
       Envía a admin-donaciones (?que=<nombre>), que muestra el aviso. Con ?error=cantidad, el
       error junto al campo. Estilos: prototipo/admin.css. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{alternativas/cozy-medieval/layout-privado :: pagina(~{::title}, ~{::contenido})}">
<head>
  <title>Registrar donación - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <link rel="stylesheet" href="/css/alternativas/cozy-medieval/prototipo/admin.css"
        th:href="@{/css/alternativas/cozy-medieval/prototipo/admin.css}">
  <section class="admin-libro admin-libro--angosto" aria-labelledby="registrar-titulo">
    <a class="enlace-fuerte admin-volver" href="/prototipo/admin-donaciones"
       th:href="@{/prototipo/admin-donaciones}">Volver a donaciones</a>
    <header class="admin-etiqueta">
      <p class="admin-rotulo">Donaciones</p>
      <h1 id="registrar-titulo">Registrar una donación</h1>
    </header>
    <div class="admin-hoja">
      <p class="admin-bajada">Anotala como figura en el remito. Queda en el depósito hasta que se
        asigne.</p>
      <form class="admin-formulario" action="/prototipo/admin-donaciones"
            th:action="@{/prototipo/admin-donaciones}" method="get">
        <div th:replace="~{alternativas/cozy-medieval/fragmentos/campo :: campo('donante', 'Quién la donó', 'text',
             'El nombre de la persona o de la organización.', null, false)}"></div>
        <div th:replace="~{alternativas/cozy-medieval/fragmentos/campo :: campo('que', 'Qué se donó', 'text',
             'Por ejemplo, arroz, ropa de abrigo o cuadernos.', null, false)}"></div>
        <div class="campo">
          <label for="rubro">Categoría</label>
          <select id="rubro" name="rubro">
            <option>Alimentos</option>
            <option>Vestimenta</option>
            <option>Útiles escolares</option>
          </select>
        </div>
        <div class="admin-formulario-par"
             th:with="error=${param.error != null ? 'Falta la cantidad. Escribí cuántos kilos, paquetes o unidades llegaron.' : null}">
          <div th:replace="~{alternativas/cozy-medieval/fragmentos/campo :: campo('cantidad', 'Cantidad', 'number', null,
               ${error}, false)}"></div>
          <div class="campo">
            <label for="unidad">Unidad</label>
            <select id="unidad" name="unidad">
              <option>kg</option>
              <option>unidades</option>
              <option>paquetes</option>
              <option>latas</option>
              <option>bolsas</option>
              <option>cajas</option>
            </select>
          </div>
        </div>
        <div th:replace="~{alternativas/cozy-medieval/fragmentos/campo :: campo('vencimiento', 'Vence el', 'date',
             'Dejalo vacío si no vence, como la ropa o los útiles.', null, false)}"></div>
        <div class="admin-formulario-acciones">
          <button type="submit">Registrar donación</button>
          <a href="/prototipo/admin-donaciones" th:href="@{/prototipo/admin-donaciones}"
             class="enlace-fuerte">Cancelar</a>
        </div>
      </form>
    </div>
  </section>
</th:block>
</body>
</html>
