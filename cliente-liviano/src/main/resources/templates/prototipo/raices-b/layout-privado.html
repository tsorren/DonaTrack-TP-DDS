<!DOCTYPE html>
<!--/* Raíces B: la estructura de las pantallas privadas (sistema de B, corrida A/B, 2026-11-02). Arriba,
       la cabecera: una franja de tierra honda con el cartel de la marca, el buzón de notificaciones
       (donante y entidad), la cuenta, Mi perfil y Salir, y debajo la línea del rol, con una estación
       por sección del menú (via.html). El contenido, en papel, cuelga de la línea: el rótulo de
       cada pantalla es una estación con su ramal (privado.css). Abajo, la terminal (pie.html). Sin
       JavaScript: la línea se acomoda sola en cualquier ancho. No es un juego de plantillas: solo lo
       usa el prototipo.
       Uso: <html th:replace="~{prototipo/raices-b/layout-privado :: pagina(~{::title}, 'hoja', ~{::contenido})}">,
       donde 'hoja' es el nombre de la hoja de la pantalla en css/prototipo/raices-b/. El modelo trae
       navegacion (List<OpcionNavegacion>), cuenta (CuentaVista), seccion y perfil (la dirección de
       Mi perfil del rol, de la que sale el rol). Las notificaciones sin leer son datos de maqueta: 4
       del donante y 3 de la entidad (fichas raices-donante-navegable y raices-entidad-navegable).
       El buzón se marca como actual en la pantalla cuya hoja es <rol>-notificaciones. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, hoja, contenido)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="stylesheet" href="/css/prototipo/raices-b/privado.css"
        th:href="@{/css/prototipo/raices-b/{hoja}.css(hoja=${hoja})}">
  <link th:if="${varianteCss}" rel="stylesheet" href="/css/variantes/variante.css"
        th:href="@{/css/variantes/{nombre}.css(nombre=${varianteCss})}">
</head>
<body class="raices-privado"
      th:with="rol=${perfil != null ? #strings.substringBefore(#strings.substringAfter(perfil, '/prototipo/raices-b/'), '-') : ''},
               sinLeer=${rol == 'donante' ? 4 : (rol == 'entidad' ? 3 : null)}">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cabecera tierra-impresa">
  <div class="cabecera-fila franja">
    <a class="marca" href="/prototipo/raices-b/publico-portada" th:href="@{/prototipo/raices-b/publico-portada}"
       aria-label="DonaTrack, ir a la portada">
      <img src="/img/logo.svg" th:src="@{/img/logo.svg}" alt="" width="18" height="24">
      <span>Dona<em>Track</em></span>
    </a>
    <div class="cabecera-acceso">
      <a th:if="${sinLeer != null}" href="/prototipo/raices-b/donante-notificaciones"
         th:href="@{/prototipo/raices-b/{pantalla}(pantalla=${rol + '-notificaciones'})}"
         th:aria-current="${hoja == rol + '-notificaciones'} ? 'page' : null"
         class="buzon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path
         d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15ZM10 21h4"/></svg><span class="buzon-texto">Notificaciones</span>
         <span class="buzon-cantidad" th:text="${sinLeer}">4</span><span class="solo-lectores">sin leer</span></a>
      <!--/* Con lugar, la cuenta a la vista; en el celular, plegada en "Cuenta" (sin JavaScript): la
             cabecera entra en una fila y la acción de la pantalla queda en la primera pantalla. Se
             muestra una sola de las dos. */-->
      <th:block th:fragment="cuenta">
        <p class="cuenta" th:if="${cuenta}"><b th:text="${cuenta.nombre}">Nombre</b><small
           th:text="${cuenta.rol}">Rol</small></p>
        <a th:if="${perfil}" href="/prototipo/raices-b/donante-perfil" th:href="${perfil}"
           th:aria-current="${seccion == 'Mi perfil'} ? 'page' : null">Mi perfil</a>
        <a href="/prototipo/raices-b/publico-portada" th:href="@{/prototipo/raices-b/publico-portada}">Salir</a>
      </th:block>
      <details class="cuenta-plegada">
        <summary>Cuenta</summary>
        <div class="cuenta-panel">
          <th:block th:replace="~{prototipo/raices-b/layout-privado :: cuenta}"></th:block>
        </div>
      </details>
    </div>
  </div>
  <nav th:replace="~{prototipo/raices-b/via :: via(${navegacion}, 'Secciones')}"></nav>
</header>
<main id="contenido" class="franja" tabindex="-1" th:insert="${contenido}"></main>
<footer th:replace="~{prototipo/raices-b/pie :: pie}"></footer>
<!--/* Los avisos breves se agregan acá: los lectores de pantalla los anuncian. */-->
<div id="avisos" class="avisos" aria-live="polite"></div>
</body>
</html>
