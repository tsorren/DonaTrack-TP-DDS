<!DOCTYPE html>
<!--/* Raíces: una pantalla del menú que todavía no está dibujada en su prototipo (decisión del
       usuario, 2026-11-01). Dice qué falta y enlaza a la misma pantalla en Cozy; desde Cozy se vuelve
       con Atrás. PrototipoController la muestra para toda pantalla de una sección del menú sin
       plantilla, con la dirección de la de Cozy en ${enCozy}, o null si Cozy tampoco la dibujó (como
       "Llegó con un problema" de la entidad, que vuelve a su entrega con ?entrega=). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{prototipo/raices-b/layout-privado :: pagina(~{::title}, 'privado', ~{::contenido})}">
<head>
  <title th:text="|${seccion} - DonaTrack|">Sección - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <div class="sin-dibujar">
    <p class="rotulo" th:text="${seccion}">Sección</p>
    <h1>Esta pantalla todavía no está dibujada en este sitio.</h1>
    <th:block th:unless="${enCozy}">
      <p>Tampoco está dibujada en la alternativa Cozy / Medieval.</p>
      <a th:if="${seccion == 'Seguir entregas' and param.entrega != null}" class="boton boton--secundario"
         href="/prototipo/raices-b/entidad-seguimiento-confirmar?entrega=lentejas"
         th:href="@{/prototipo/raices-b/entidad-seguimiento-confirmar(entrega=${param.entrega[0]})}">
        Volver a la entrega</a>
    </th:block>
    <!--/* En B, primero la vuelta al inicio del rol (la primera estación de su línea); salir a Cozy
           queda como segunda opción (arreglo de la crítica, 2026-11-02). */-->
    <p class="acciones" th:if="${navegacion != null and !#lists.isEmpty(navegacion)}">
      <a class="boton boton--secundario" href="#" th:href="${navegacion[0].ruta}">Volver al inicio</a>
      <a th:if="${enCozy}" class="boton boton--secundario" href="#" th:href="${enCozy}">Verla en
        la alternativa Cozy</a>
    </p>
  </div>
</th:block>
</body>
</html>
