<!DOCTYPE html>
<!--/* Raíces B: la estructura de todas las páginas públicas, también la portada (sistema de B, corrida
       A/B, 2026-11-02). Arriba, la cabecera: una franja de tierra honda con el cartel de la marca,
       Ingresar y la línea pública (Entregas confirmadas, Mapa, Entidades y Crear una cuenta, de
       ${navegacion}); abajo, la terminal (pie.html). Ingresar se marca como actual en la pantalla
       cuya hoja es publico-ingresar. No es un juego de plantillas: solo lo usa el prototipo
       (ADR 20261101).
       Uso: <html th:replace="~{prototipo/raices-b/layout-publico :: pagina(~{::title}, 'hoja', ~{::contenido})}">,
       donde 'hoja' es el nombre de la hoja de la pantalla en css/prototipo/raices-b/. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, hoja, contenido)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">DonaTrack</title>
  <link rel="stylesheet" href="/css/prototipo/raices-b/publico-paginas.css"
        th:href="@{/css/prototipo/raices-b/{hoja}.css(hoja=${hoja})}">
</head>
<body class="raices-publico">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cabecera tierra-impresa">
  <div class="cabecera-fila franja">
    <a class="marca" href="/prototipo/raices-b/publico-portada" th:href="@{/prototipo/raices-b/publico-portada}"
       aria-label="DonaTrack, ir a la portada">
      <img src="/img/logo.svg" th:src="@{/img/logo.svg}" alt="" width="18" height="24">
      <span>Dona<em>Track</em></span>
    </a>
    <div class="cabecera-acceso">
      <a class="boton boton--chico" href="/prototipo/raices-b/publico-ingresar"
         th:href="@{/prototipo/raices-b/publico-ingresar}"
         th:aria-current="${hoja == 'publico-ingresar'} ? 'page' : null">Ingresar</a>
    </div>
  </div>
  <nav th:replace="~{prototipo/raices-b/via :: via(${navegacion}, 'Recorrer DonaTrack')}"></nav>
</header>
<main id="contenido" tabindex="-1" th:insert="${contenido}"></main>
<footer th:replace="~{prototipo/raices-b/pie :: pie}"></footer>
</body>
</html>
