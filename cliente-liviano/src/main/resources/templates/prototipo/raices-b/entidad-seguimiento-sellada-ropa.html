<!DOCTYPE html>

<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{prototipo/raices-b/layout-privado :: pagina(~{::title}, 'entidad-seguimiento-confirmar', ~{::contenido})}">
<head>
  <title>Recepción confirmada - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{prototipo/raices-b/entidad-seguimiento-confirmar :: entrega('ropa',
            ~{prototipo/raices-b/entidad-seguimiento-sellada :: sellada(true)})}"></th:block>
</th:block>
</body>
</html>
