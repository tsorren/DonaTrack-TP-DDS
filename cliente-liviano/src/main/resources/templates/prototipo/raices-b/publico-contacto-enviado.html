<!DOCTYPE html>
<!--/* Raíces, Contacto enviado (docs/interfaz/flujos/raices-contacto.md): el sello de recibido, el
       número del mensaje y una sola salida: la pantalla de origen (?volver=, solo pantallas de
       /prototipo/raices-b/) o, si no hay, la portada. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{prototipo/raices-b/layout-publico :: pagina(~{::title}, 'publico-paginas', ~{::contenido})}">
<head>
  <title>Mensaje recibido - Contacto - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido"
    th:with="volver=${param.volver != null and #strings.startsWith(param.volver[0], '/prototipo/raices-b/') and !#strings.contains(param.volver[0], '//') and !#strings.contains(param.volver[0], '..') ? param.volver[0] : null},
             nombres=${ {'/prototipo/raices-b/entidad-necesidades': 'Necesidades',
                         '/prototipo/raices-b/entidad-seguimiento-confirmar': 'la entrega',
                         '/prototipo/raices-b/donante-seguimiento': 'Seguimiento',
                         '/prototipo/raices-b/donante-perfil': 'Mi perfil'} }">
  <div class="contacto lectura">
    <p class="rotulo">Contacto</p>
    <h1>Recibimos tu mensaje</h1>
    <div class="recibido" role="status">
      <svg viewBox="-30 -30 64 64" aria-hidden="true" focusable="false">
        <circle class="sello-tinta" cx="4" cy="4" r="26"/><circle class="sello-disco" r="26"/>
        <path class="sello-calado sello-calado--fino" d="M-10 1L-3 8L11 -7"/>
      </svg>
      <p>Su número es <b>4821</b>. Te respondemos por correo.</p>
    </div>
    <a th:if="${volver}" class="boton boton--principal" href="/prototipo/raices-b/entidad-necesidades"
       th:href="${volver}"
       th:text="|Volver a ${nombres.get(#strings.substringBefore(volver + '?', '?')) ?: 'donde estabas'}|">Volver
      a Necesidades</a>
    <a th:unless="${volver}" class="boton boton--principal" href="/prototipo/raices-b/publico-portada"
       th:href="@{/prototipo/raices-b/publico-portada}">Ir a la portada</a>
  </div>
</th:block>
</body>
</html>
