<!DOCTYPE html>
<!--/* Raíces B: la vía (la línea), la navegación del sitio (sistema de B, corrida A/B, 2026-11-02). Una línea
       de subte con una estación por destino: la del rol en las privadas y la pública en las
       públicas, las dos desde ${navegacion} (PrototipoController). La actual va impresa y con
       aria-current. En el celular dice el nombre corto; con lugar, el entero. No es una pantalla: su
       nombre no empieza con un rol, así que PrototipoController no la muestra.
       Uso: <nav th:replace="~{prototipo/raices-b/via :: via(${navegacion}, 'Secciones')}"></nav> */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="via(opciones, nombre)" class="via franja" th:aria-label="${nombre}">
  <ol role="list">
    <li th:each="opcion : ${opciones}">
      <a href="#" th:href="${opcion.ruta}" th:aria-current="${opcion.actual} ? 'page' : null">
        <span class="via-sello" aria-hidden="true"></span>
        <span class="via-nombre" th:text="${opcion.texto}">Sección</span>
        <span class="via-corto" th:text="${opcion.textoCorto}">Sección</span>
      </a>
    </li>
  </ol>
</nav>
</body>
</html>
