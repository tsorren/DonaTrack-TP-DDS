<head>
  <title>Revisá tu correo - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <h1 class="rotulo-menu pub-pestana">Recuperar contraseña</h1>
  <link rel="stylesheet" href="/css/alternativas/encastre/prototipo/publico.css"
        th:href="@{/css/alternativas/encastre/prototipo/publico.css}">
  <div th:replace="~{prototipo/encastre/publico-recuperar :: recuperar(true)}"></div>
</th:block>
</body>
</html>
