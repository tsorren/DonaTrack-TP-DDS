<!DOCTYPE html>
<!--/* El menú de la cuenta, como en K (usuario, 2026-11-08): se despliega al tocar la foto de perfil,
       con el nombre y el rol, Mi perfil, Cambiar contraseña y Cerrar sesión. La foto por defecto es
       una planta. Es un <details>: anda sin JavaScript. Lo usan la cabecera del área privada
       (layout-privado.html) y, con la sesión iniciada, la de lo público (la portada y
       layout-publico.html; docs/interfaz/flujos/r11-p1-portada.md). Toma del modelo cuenta
       (CuentaVista), perfil (la dirección de Mi perfil, o nula) y seccion (marca Mi perfil).
       No es una pantalla: su nombre no empieza con un rol.
       Fragmentos:
       - menu: la foto y su menú. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<details th:fragment="menu" class="navegacion-cuenta">
  <summary class="navegacion-cuenta-foto" th:aria-label="|Cuenta de ${cuenta.nombre}|"
           aria-label="Cuenta de Nombre">
    <img src="/img/ilustraciones/planta-orejas.svg" th:src="@{/img/ilustraciones/planta-orejas.svg}"
         alt="" width="48" height="48">
  </summary>
  <div class="navegacion-cuenta-menu">
    <p><b th:text="${cuenta.nombre}">Nombre</b><small th:text="${cuenta.rol}">Rol</small></p>
    <a th:if="${perfil}" href="/donante-perfil" th:href="${perfil}"
       th:aria-current="${seccion == 'Mi perfil'} ? 'page' : null">Mi perfil</a>
    <!--/* Las cuentas de administración (R11-10, ficha r11-p1-admins.md §2): solo en el área admin. */-->
    <a th:if="${perfil != null and #strings.endsWith(perfil, '/admin-perfil')}" href="/admin-administradores"
       th:href="@{/admin-administradores}"
       th:aria-current="${seccion == 'Administradores'} ? 'page' : null">Administradores</a>
    <!--/* El cambio de contraseña (la consola de cuenta del IdP, solo con ingreso real) y Cerrar
           sesión (POST con CSRF), de #955. */-->
    <a th:if="${cuenta.cambiarClave}" href="#" th:href="${cuenta.cambiarClave}">Cambiar contraseña</a>
    <form th:replace="~{cerrar-sesion :: boton}"></form>
  </div>
</details>
</body>
</html>
