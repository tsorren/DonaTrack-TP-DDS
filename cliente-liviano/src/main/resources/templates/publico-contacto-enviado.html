<!DOCTYPE html>
<!--/* Contacto después de enviar, solo en la maqueta (DA-06, DA-24: sin página de respuesta propia).
       Es el envoltorio que delega en publico-contacto :: hoja(false, true): el mismo Contacto con el
       aviso breve que lleva el número del mensaje (numeroDelMensaje, del controller) y, con ?volver=,
       la salida "Volver a …". Fuera de la maqueta, el envío vuelve a publico-contacto con el aviso
       del servidor (PublicoContactoEnvioController). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{${marco ?: 'layout-publico'} :: pagina(~{::title}, 'publico-paginas', ~{::contenido})}">
<head>
  <title>Mensaje recibido - Contacto - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{publico-contacto :: hoja(false, true)}"></th:block>
</th:block>
</body>
</html>
