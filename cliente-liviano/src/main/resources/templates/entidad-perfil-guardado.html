<!DOCTYPE html>
<!--/* Mi perfil de la organización después de guardar, solo en la maqueta (DA-06: sin página de
       respuesta propia). Es el envoltorio que delega en entidad-perfil :: hoja(true): el mismo
       perfil con el aviso breve de lo que se guardó (?seccion=datos o avisos; la pestaña, #datos o
       #como-te-avisamos, la conserva el navegador). Fuera de la maqueta, el envío vuelve a
       entidad-perfil con el aviso del servidor (EntidadEnviosController). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'entidad-perfil', ~{::contenido})}">
<head>
  <title>Guardado - Mi perfil - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{entidad-perfil :: hoja(true)}"></th:block>
</th:block>
</body>
</html>
