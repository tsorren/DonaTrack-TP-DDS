<!DOCTYPE html>
<!--/* La donación quedó registrada, solo en la maqueta (DA-06, ADM1-11: sin página de respuesta
       propia). Es Donaciones (admin-donaciones :: hoja('')) con el aviso breve del registro; los datos
       de la lista los arma AdminDonacionesController como en /admin-donaciones. Fuera de la maqueta,
       el envío vuelve a /admin-donaciones con el aviso del servidor (AdminDonacionesEnvios), con el
       mismo texto. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'admin-secciones', ~{::contenido})}">
<head>
  <title>Donación registrada - Donaciones - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <!--/* El aviso breve: en el flujo de la página y, con HTMX, en la región de avisos. Fuera de la
         maqueta lo trae el layout (envio :: aviso). hx-swap-oob="beforeend" suma a la región los
         hijos del elemento que lo lleva: por eso va en una caja sin clase, y a la región llega el
         aviso entero, con su papel. */-->
  <div class="pila" data-espacio="4">
    <div hx-swap-oob="beforeend:#avisos"><div
        class="aviso-breve" data-estado="hecho" role="status" tabindex="-1" autofocus><svg
        th:replace="~{componentes/sello :: signo('confirmada')}"></svg><p>Registraste la donación: Caja de alimentos, 3 bienes. Quedó en el Depósito Central.</p><button
        type="button" class="aviso-cerrar" data-cerrar aria-label="Cerrar el aviso">×</button></div></div>
    <th:block th:replace="~{admin-donaciones :: hoja('')}"></th:block>
  </div>
</th:block>
</body>
</html>
