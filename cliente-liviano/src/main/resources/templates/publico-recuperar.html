<!DOCTYPE html>
<!--/* Recuperar la contraseña (PUB2-01): deriva de A12 de la guía «Huerta y galpón» (Confirmar
       recepción, docs/interfaz/guia/partes/50-pantallas.html#confirmar), con la columna del
       formulario de Ingresar (la hoja publico-ingresar la dispone: main > .pila): el título y la
       bajada, el campo del catálogo y una sola acción llena; la salida a Ingresar es un enlace. Sale
       de Ingresar ("¿Olvidaste tu contraseña?" y "Pedir una contraseña nueva"). Es un formulario
       real (POST) que va a publico-recuperar-enviado.
       La respuesta (DA-32, DA-06): la misma pantalla con el aviso en la página (.aviso con
       data-tipo="exito") en el lugar del formulario; no dice si el correo tiene cuenta
       (RNF-AUTH-10).
       Fragmentos:
       - hoja(enviado): la pantalla entera; con enviado, el aviso en lugar del formulario. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-publico :: pagina(~{::title}, 'publico-ingresar', ~{::contenido})}">
<head>
  <title>Recuperar la contraseña - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{publico-recuperar :: hoja(false)}"></th:block>
</th:block>

<th:block th:fragment="hoja(enviado)">
  <div class="pila" data-espacio="4">
    <div class="pila" data-espacio="1">
      <h1>Pedí una contraseña nueva</h1>
      <p th:unless="${enviado}">Escribí el correo de tu cuenta y te mandamos un enlace para crear una contraseña nueva.</p>
    </div>

    <div th:if="${enviado}" class="aviso" data-tipo="exito" role="status" tabindex="-1" autofocus>
      <svg th:replace="~{componentes/sello :: signo('confirmada')}"></svg>
      <p class="aviso-titulo">Si hay una cuenta con ese correo, te mandamos un enlace.</p>
      <p>Revisá tu bandeja de entrada: el enlace sirve una sola vez y por tiempo limitado.</p>
    </div>

    <form th:unless="${enviado}" class="pila" data-espacio="4" action="/publico-recuperar-enviado"
          th:action="@{/publico-recuperar-enviado}" method="post" data-enviando="Enviando…">
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" required autocomplete="email"
               placeholder="nombre@ejemplo.com">
      </div>
      <div class="racimo">
        <button class="boton" data-tono="principal" type="submit">Mandame el enlace</button>
      </div>
    </form>

    <p><th:block th:unless="${enviado}">¿Te acordaste? </th:block><a href="/publico-ingresar"
       th:href="@{/publico-ingresar}">Volver a Ingresar</a></p>
  </div>
</th:block>
</body>
</html>
