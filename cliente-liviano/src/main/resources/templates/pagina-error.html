<!DOCTYPE html>
<!--/* Raíces, las páginas de error propias (RF-CL-08), según su ficha de flujo
       (docs/interfaz/flujos/raices-paginas-de-error.md). Pieza compartida: no se sirve como pantalla.
       La usan error/404, error/403 y error/5xx, que Spring Boot elige por el código de estado; las
       tres van con el marco de las públicas (usuario, 2026-11-07). Spring pone en el modelo status
       (el código) y path (la dirección pedida).
       El código para soporte es el traceId del request; su propagación se decide al integrar el
       gateway. En la maqueta, uno de ejemplo; con ?escenario=sin-codigo, ninguno.
       Fragmento pagina(tituloAntes, tituloResaltado, texto, accion, accionHref, conInicio, contacto,
       contactoSin): el título con su parte en cursiva, la frase, la acción principal, si suma "Ir al
       inicio" y el texto del enlace a Contacto con código y sin él. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="pagina(tituloAntes, tituloResaltado, texto, accion, accionHref, conInicio, contacto, contactoSin)"
    th:with="codigo=${param.escenario != null and param.escenario[0] == 'sin-codigo' ? null : 'a1b2c3d4e5f6'}">
  <div class="grilla" data-espacio="5">
    <div class="lectura">
      <p class="rotulo" th:text="|Error ${status}|">Error 404</p>
      <h1><th:block th:text="${tituloAntes}">No encontramos esta</th:block>
        <em th:text="${tituloResaltado}">página</em></h1>
      <p class="lectura-bajada" th:text="${texto}">Puede que la dirección esté mal escrita o que la
        página ya no exista.</p>
      <div class="racimo">
        <a class="boton" data-tono="principal" href="/" th:href="${accionHref}"
           th:text="${accion}">Ir al inicio</a>
        <a th:if="${conInicio}" class="boton" data-tono="secundario" href="/" th:href="@{/}">Ir al
          inicio</a>
      </div>
      <p th:if="${codigo}" class="aviso-codigo">Código para soporte: <code th:text="${codigo}">a1b2c3d4e5f6</code></p>
      <p th:if="${codigo}"><a href="/publico-contacto?codigo=a1b2c3d4e5f6"
         th:href="@{/publico-contacto(codigo=${codigo})}" th:text="${contacto}">Si sigue, escribinos
        con este código.</a></p>
      <p th:unless="${codigo}"><a href="/publico-contacto" th:href="@{/publico-contacto}"
         th:text="${contactoSin}">Si sigue, escribinos y contanos qué estabas haciendo.</a></p>
    </div>
    <!--/* La maceta de reintentar (ilustración de diseño, 2026-11-08; antes, el corte de suelo con la
           raíz cortada). Decorativa: el texto dice todo. */-->
    <div data-dibujo="error">
      <img src="/img/ilustraciones/reintentar.svg" th:src="@{/img/ilustraciones/reintentar.svg}" alt=""
           width="117" height="121">
    </div>
  </div>
</th:block>
</body>
</html>
