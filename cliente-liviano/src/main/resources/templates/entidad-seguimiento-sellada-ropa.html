       una vez. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'entidad-seguimiento-confirmar', ~{::contenido})}">
<head>
  <title>Recepción confirmada - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{entidad-seguimiento-confirmar :: entrega('ropa',
            ~{entidad-seguimiento-sellada :: sellada(true)})}"></th:block>
</th:block>
</body>
</html>
