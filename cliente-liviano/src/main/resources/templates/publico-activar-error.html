<!DOCTYPE html>
<!--/* Raíces, Activar cuenta con el error de datos (la contraseña es corta), como lo devolvería el
       servidor: el resumen arriba recibe el foco y enlaza al campo, que lleva aria-invalid. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-publico :: pagina(~{::title}, 'publico-ingresar', ~{::contenido})}">
<head>
  <title>Revisá la contraseña - Activar cuenta - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{publico-activar :: hoja(true)}"></th:block>
</th:block>
</body>
</html>
