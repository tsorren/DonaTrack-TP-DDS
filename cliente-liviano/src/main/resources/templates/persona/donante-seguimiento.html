<!DOCTYPE html>
<!--/* Seguimiento de una donación de la persona que dona (Martina Ruiz, RF-09): la misma pantalla que
       la de la empresa (donante-seguimiento :: seguimiento, el arquetipo A07; DA-13 y DA-03a), con
       sus datos (persona/datos-persona) y la posición aproximada de la que está en camino (puntos,
       por clave de donación, sintéticos): ropa de abrigo. Leche en polvo, asignada, no viaja. Sin
       ?donacion=, la ropa de abrigo, la primera en camino. ?escenario=vacio, error y lento. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'donante-donaciones-detalle', ~{::contenido})}">
<head>
  <title>Seguimiento de la donación - Donaciones - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{persona/datos-persona :: persona(~{::pantalla})}"></th:block>
</th:block>

<th:block th:fragment="pantalla">
  <th:block th:replace="~{donante-seguimiento :: seguimiento(${donaciones}, ${ {
      ropa: {lat: -34.6556, lng: -58.4044, destinoLat: -34.6683, destinoLng: -58.4067} } },
      'hoy, 15 de octubre, a las 16:25', ${escenario})}"></th:block>
</th:block>
</body>
</html>
