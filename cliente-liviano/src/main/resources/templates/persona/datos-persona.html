<!DOCTYPE html>
<!--/* Los datos de ejemplo de la persona que dona, Martina Ruiz (ficha raices-misiones.md, "Datos de
       maqueta"), escritos una sola vez para sus pantallas de templates/persona/. No es una pantalla:
       su nombre no empieza con un rol. Sintéticos y coherentes con Misiones e insignias y con la
       ficha de la entidad: donaciones chicas de alimentos, ropa y útiles, una por mes desde junio
       (Racha Inicial, completa el 3 de agosto), la tercera categoría el 2 de septiembre (Explorador y
       el ascenso a Sostenedor), los 5 kg de arroz que recibió el Comedor Barrio Ejemplo el 9 de
       octubre y las 12 prendas de ropa de abrigo, su donación más grande desde el 2 de septiembre
       (Gran Aporte, 12 de 50 bienes). "Hoy" es el jueves 15 de octubre de 2026, 16:25.
       Fragmentos:
       - persona(vista): las donaciones (con la misma forma que las de viaje-datos, para usar las
         piezas del donante: huerta :: planta, recorrido, el detalle), las misiones, los avisos y
         escenario (?escenario=); adentro, la vista de la pantalla.
       - aviso(a, sinLeer): una noticia; de una donación (a.d y su carta a.i) o de una misión (a.m). */-->

                {nombre: 'En camino', detalle: '10 de julio', avance: hecho},

<!--/* Los avisos de la persona, del más nuevo al más viejo: los de sus donaciones (d, con la carta i)
       y los de sus misiones (m), que la bandeja de la empresa no tiene (RF-08; ficha de misiones,
       preguntas abiertas). Los 3 primeros, sin leer. Las misiones, una lista por categoría con su
       estado, para el inicio; la pantalla de Misiones escribe las suyas. */-->
<th:block th:fragment="conAvisos(vista)"
    th:with="avisos=${ {
        {d: donaciones.^[clave == 'ropa'], i: 0},
        {d: donaciones.^[clave == 'fideos'], i: 0},
        {d: donaciones.^[clave == 'ropa'], i: 1},
        {d: donaciones.^[clave == 'leche'], i: 0},
        {d: donaciones.^[clave == 'leche'], i: 1},
        {d: donaciones.^[clave == 'arroz'], i: 0},
        {d: donaciones.^[clave == 'ropa'], i: 2},
        {d: donaciones.^[clave == 'arroz'], i: 1},
        {m: 'Gran Aporte', texto: 'Tu ropa de abrigo sumó 12 bienes a Gran Aporte: 12 de 50.', cuando: '7 de octubre, 17:35', fecha: '2026-10-07T17:35'},
        {d: donaciones.^[clave == 'ropa'], i: 3},
        {d: donaciones.^[clave == 'arroz'], i: 2},
        {d: donaciones.^[clave == 'utiles'], i: 0},
        {m: 'Explorador', texto: 'Completaste Explorador y pasaste a donante Sostenedor. Tu insignia ya está en Misiones.', cuando: '2 de septiembre, 18:00', fecha: '2026-09-02T18:00'},
        {m: 'Racha Inicial', texto: 'Completaste Racha Inicial: 3 meses seguidos donando. Tu insignia ya está en Misiones.', cuando: '3 de agosto, 18:00', fecha: '2026-08-03T18:00'} } },
             sinLeer=3,
             proxima=${ {nombre: 'Gran Aporte', categoria: 'Sostenedor', pide: 'Una donación con al menos 50 bienes',
                         progreso: 12, objetivo: 50, cuenta: '12 de 50 bienes',
                         nota: 'Tu ropa de abrigo, la donación más grande desde el 2 de septiembre.'} }">
  <th:block th:replace="${vista}"></th:block>
</th:block>

<!--/* Una noticia, con su marca de leída, el sello y el enlace: el de su donación o, si es de una
       misión, el sello de hecho y el enlace a Misiones. Hoy es el 15 de octubre. */-->
<li th:fragment="aviso(a, sinLeer)" class="noticia" th:classappend="${sinLeer} ? 'noticia--sin-leer'"
    th:with="esMision=${a['m'] != null},
             c=${esMision ? a : a.d.cartas[a.i]}, dia=${#strings.substring(c.fecha, 0, 10)},
             hora=${#strings.substringAfter(c.cuando, ', ')}">
  <span class="noticia-marca" th:text="${sinLeer} ? 'Sin leer' : 'Leída'">Sin leer</span>
  <span th:if="${esMision}" class="estado noticia-estado" data-estado="entregada">
    <th:block th:replace="~{componentes/sello :: sello('hecho')}"></th:block>
    <span>Misiones</span>
  </span>
  <span th:unless="${esMision}" class="estado noticia-estado" th:data-estado="${a.d.estado.tono}">
    <th:block th:replace="~{componentes/sello :: sello(${a.d.estado.tono})}"></th:block>
    <span th:text="${a.d.estado.texto}">En camino</span>
  </span>
  <a class="noticia-texto" href="/donante-donaciones-detalle"
     th:href="${esMision} ? @{/donante-misiones} : @{/donante-donaciones-detalle(donacion=${a.d.clave})}"
     th:text="${c.texto}">El camión salió a entregar tu ropa de abrigo a Merendero Ejemplo Sur.</a>
  <time class="noticia-cuando" th:datetime="${c.fecha}"
        th:text="${dia == '2026-10-15' ? 'Hoy, ' + hora : (dia == '2026-10-14' ? 'Ayer, ' + hora : c.cuando)}">Hoy,
    11:10</time>
  <span class="noticia-donacion" th:text="${esMision} ? |Misión ${a.m}| : |${a.d.titulo}, ${a.d.cantidad}|">Ropa
    de abrigo, 12 prendas</span>
</li>
</body>
</html>
