<!DOCTYPE html>
<!--/* Mi perfil de la persona que dona después de guardar, solo en la maqueta (DA-06), como el de la
       empresa: el envoltorio que delega en persona/donante-perfil :: hoja(true), el mismo perfil con
       el aviso breve de lo que se guardó (sin parámetro, "No mostrarlo"; ?mostrar=si, "Mostrar mi
       nombre"; ?seccion=datos o avisos, la sección). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'donante-perfil', ~{::contenido})}">
<head>
  <title>Guardado - Mi perfil - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{persona/donante-perfil :: hoja(true)}"></th:block>
</th:block>
</body>
</html>
