<!DOCTYPE html>
<!--/* El detalle de una donación de la persona que dona (Martina Ruiz): la misma pantalla que la de
       la empresa (donante-donaciones-detalle :: cuerpo, DA-13), con sus tres variantes de la guía
       según el estado (A06 asignada, A07 en camino con el enlace a su seguimiento y A08 con
       problema), dentro de los datos de la persona (persona/datos-persona). El detalle viene del
       controller, con ?donacion=<clave>; sin parámetro, el de la maqueta (las lentejas, en
       camino). ?escenario=error y lento, como la de la empresa. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'donante-donaciones-detalle', ~{::contenido})}">
<head>
  <title>Detalle de la donación - Donaciones - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{persona/datos-persona :: persona(~{::cuerpo})}"></th:block>
</th:block>

<th:block th:fragment="cuerpo">
  <th:block th:replace="~{donante-donaciones-detalle :: cuerpo}"></th:block>
</th:block>
</body>
</html>
