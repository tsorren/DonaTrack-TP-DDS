<!DOCTYPE html>
<!--/* Organizaciones de la persona que dona (Martina Ruiz, RF-06; ola DON, DON-06): la misma pantalla
       que la de la empresa (DA-13), con su composición y sus piezas del catálogo:
       donante-entidades :: hoja, con el aviso «Cómo llega tu donación», la barra (componentes/listado,
       R11-B04: nombre, Categoría y «Ya doné»; la arma DonanteEntidadesController), una tarjeta por
       organización y el paginador. Cambian solo los datos de ejemplo, escritos acá: los filtros se
       resuelven sobre la primera página (no llama a ningún servicio); ?pagina=2 trae los nombres
       largos y una organización sin necesidades (R11-18); ?escenario=vacio, error y lento. Sin
       búsqueda ni filtros, la cuenta es la de la maqueta: 46 organizaciones en 8 páginas; con ellos,
       las que coinciden, en una página. Solo para la maqueta (?cuenta=persona): con login real la
       persona ve la versión común (ficha r11-p0-persona.md). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'donante-entidades', ~{::contenido})}">
<head>
  <title>Organizaciones - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{persona/datos-persona :: persona(~{::cuerpo})}"></th:block>
</th:block>

<th:block th:fragment="cuerpo"
    th:with="entidades=${ {
      {nombre: 'Comedor Barrio Ejemplo', ya: true,
       pide: { {que: 'Lentejas secas', categoria: 'alimentos', cat: 'cat-alimentos', falta: 'Faltan 30 de 40 kg este mes', cuando: 'Se repite cada mes', recibido: 10, total: 40},
               {que: 'Arroz', categoria: 'alimentos', cat: 'cat-alimentos', falta: 'Faltan 25 de 40 kg este mes', cuando: 'Se repite cada mes', recibido: 15, total: 40},
               {que: 'Aceite de girasol', categoria: 'alimentos', cat: 'cat-alimentos', falta: 'Faltan los 20 litros', cuando: 'Hasta el 20 de octubre', recibido: 0, total: 20},
               {que: 'Leche en polvo', categoria: 'alimentos', cat: 'cat-alimentos', falta: 'Faltan 12 de 24 unidades', cuando: 'Hasta el 25 de octubre', recibido: 12, total: 24},
               {que: 'Ropa de abrigo', categoria: 'ropa', cat: 'cat-ropa', falta: 'Faltan 25 de 30 unidades', cuando: 'Hasta el 15 de noviembre', recibido: 5, total: 30} } },
      {nombre: 'Escuela Ejemplo N.º 12', ya: true,
       pide: { {que: 'Sillas', categoria: 'muebles', cat: 'cat-muebles', falta: 'Faltan 14 de 20 unidades', cuando: 'Hasta el 30 de noviembre', recibido: 6, total: 20},
               {que: 'Útiles escolares', categoria: 'escolares', cat: 'cat-escolares', falta: 'Faltan las 4 cajas', cuando: 'Hasta el 30 de noviembre', recibido: 0, total: 4} } },
      {nombre: 'Merendero Ejemplo Sur', ya: true,
       pide: { {que: 'Galletitas', categoria: 'alimentos', cat: 'cat-alimentos', falta: 'Faltan 10 de 20 kg este mes', cuando: 'Se repite cada mes', recibido: 10, total: 20},
               {que: 'Leche en polvo', categoria: 'alimentos', cat: 'cat-alimentos', falta: 'Faltan las 20 unidades', cuando: 'Hasta el 31 de octubre', recibido: 0, total: 20} } },
      {nombre: 'Hogar Casa Ejemplo', ya: true,
       pide: { {que: 'Frazadas', categoria: 'ropa', cat: 'cat-ropa', falta: 'Faltan 10 de 20 unidades', cuando: 'Hasta el 15 de noviembre', recibido: 10, total: 20} } },
      {nombre: 'Club Ejemplo Norte', ya: false,
       pide: { {que: 'Camisetas deportivas', categoria: 'ropa', cat: 'cat-ropa', falta: 'Faltan las 15 unidades', cuando: 'Hasta el 30 de noviembre', recibido: 0, total: 15} } },
      {nombre: 'Biblioteca Popular Ejemplo', ya: false,
       pide: { {que: 'Sillas', categoria: 'muebles', cat: 'cat-muebles', falta: 'Faltan 4 de 8 unidades', cuando: 'Hasta el 31 de diciembre', recibido: 4, total: 8} } }
    } },
             segunda=${ {
      {nombre: 'CooperativaDeTrabajoYAyudaMutuaDelBarrioEjemploNorteYAledaño', ya: false,
       pide: { {que: 'Frazadas', categoria: 'ropa', cat: 'cat-ropa', falta: 'Faltan 8 de 12 unidades', cuando: 'Hasta el 15 de noviembre', recibido: 4, total: 12} } },
      {nombre: 'Asociación Civil de Vecinos y Amigos del Barrio Ejemplo para la Ayuda Comunitaria, la Educación Popular y el Deporte Sur', ya: false,
       pide: { {que: 'Arroz', categoria: 'alimentos', cat: 'cat-alimentos', falta: 'Faltan 18 de 30 kg este mes', cuando: 'Se repite cada mes', recibido: 12, total: 30} } },
      {nombre: 'Comedor Ejemplo Este', ya: false, pide: {} }
    } },
             busca=${listado.buscar.valor},
             categoria=${listado.categoria.elegido},
             pagina=${misEntidades.pagina},
             soloYa=${listado.casillas[0].prendida},
             filtrado=${categoria != '' or soloYa},
             deLaPagina=${pagina == 2 and busca == '' and !filtrado ? segunda : entidades},
             porNombre=${busca == '' ? deLaPagina : entidades.?[#strings.containsIgnoreCase(nombre, #root.busca)]},
             porCategoria=${categoria == '' ? porNombre : porNombre.?[!pide.?[categoria == #root.categoria].isEmpty()]},
             lista=${soloYa ? porCategoria.?[ya] : porCategoria},
             todas=${busca == '' and !filtrado}">
  <div th:replace="~{donante-entidades :: hoja(${lista}, ${misEntidades.categorias},
       ${todas ? 46 : #lists.size(lista)}, ${todas ? pagina : 1}, ${todas ? 8 : 1},
       ${pagina <= 2}, 'hoy, 15 de octubre, 16:25', true,
       ~{componentes/listado :: listado(${listado})})}"></div>
</th:block>
</body>
</html>
