<!DOCTYPE html>
<!--/* Contacto con el error de datos (falta el mensaje y el correo no tiene @), como lo devolvería el
       servidor: es el estado de error del formulario, publico-contacto :: hoja(true, false), con el
       resumen arriba, que recibe el foco y enlaza a cada campo. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{${marco ?: 'layout-publico'} :: pagina(~{::title}, 'publico-paginas', ~{::contenido})}">
<head>
  <title>Revisá tu mensaje - Contacto - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{publico-contacto :: hoja(true, false)}"></th:block>
</th:block>
</body>
</html>
