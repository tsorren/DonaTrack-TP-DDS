<!DOCTYPE html>
<!--/* Raíces, piezas de las pantallas de la entidad que dibuja la corrida A/B (Inicio, Donaciones
       recibidas y Notificaciones), según su ficha (docs/interfaz/flujos/raices-entidad-navegable.md).
       No es una pantalla: su nombre no empieza con un rol, así que SitioController no la muestra.
       Fragmentos:
       - datos(cuerpo): las 11 donaciones asignadas al Comedor Barrio Ejemplo (una sola fuente para
         Inicio y Donaciones recibidas, sección 6 de la ficha) y sus grupos por estado; inserta cuerpo
         con esas variables. ?escenario=vacio las vacía; sin-puerta saca las que esperan en la puerta y
         sin-resultados, la del aceite (para el filtro sin resultados).
       - novedades(cuantas): el acceso a Notificaciones, con cuántas urgentes hay sin leer.
       - error(titulo, texto, recargar): el aviso de error del servidor, con el código para escribir. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* grupo: puerta (espera tu confirmación), problema, camino, salir (por salir) o recibida. Quien
       ocultó su nombre figura con su categoría del ranking (Donante Sostenedor). */-->
<th:block th:fragment="datos(cuerpo)"
    th:with="escenario=${param.escenario != null ? param.escenario[0] : ''},
             todas=${ {
      {clave: 'lentejas', nombre: 'Lentejas secas', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '15 kg', dono: 'Distribuidora Ejemplo SA', pedido: 'lentejas', pedidoNombre: 'lentejas secas',
       grupo: 'puerta', paso: 'Llegó a tu puerta hoy a las 18:20. Espera tu confirmación.',
       llego: 'Llegó hoy, 18:20, desde el Depósito Central.'},
      {clave: 'ropa', nombre: 'Ropa de abrigo', categoria: 'cat-ropa', categoriaNombre: 'Ropa',
       cuanto: '10 unidades', dono: 'Donante Sostenedor', pedido: 'ropa', pedidoNombre: 'ropa de abrigo',
       grupo: 'puerta', paso: 'Llegó a tu puerta ayer a las 17:10. Espera tu confirmación.',
       llego: 'Llegó ayer, 17:10, desde el Depósito Central.'},
      {clave: 'aceite', nombre: 'Aceite de girasol', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '10 litros', dono: 'Almacén Ejemplo SRL', pedido: 'aceite', pedidoNombre: 'aceite de girasol',
       grupo: 'problema', paso: 'El camión no pudo llegar el 14 de octubre. Te avisamos la nueva fecha.',
       breve: 'te avisamos la nueva fecha'},
      {clave: 'arroz', nombre: 'Arroz', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '20 kg', dono: 'Almacén Ejemplo SRL', pedido: 'arroz', pedidoNombre: 'arroz',
       grupo: 'camino', paso: 'Salió del depósito hoy a las 9:15. Llega mañana.', breve: 'llega mañana'},
      {clave: 'leche', nombre: 'Leche en polvo', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '12 unidades', dono: 'Lácteos Ejemplo SA', pedido: 'leche', pedidoNombre: 'leche en polvo',
       grupo: 'salir', paso: 'Asignada el 13 de octubre. Sale del depósito el 17 de octubre.',
       breve: 'sale el 17 de octubre'},
      {clave: 'r10', nombre: 'Lentejas secas', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '10 kg', dono: 'Almacén Ejemplo SRL', pedido: 'lentejas', pedidoNombre: 'lentejas secas',
       grupo: 'recibida', dia: '10', fecha: '2026-10-10', paso: 'Confirmaste la recepción el 10 de octubre.'},
      {clave: 'r9', nombre: 'Arroz', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '5 kg', dono: 'Martina Ruiz', pedido: 'arroz', pedidoNombre: 'arroz',
       grupo: 'recibida', dia: '9', fecha: '2026-10-09', paso: 'Confirmaste la recepción el 9 de octubre.'},
      {clave: 'r8', nombre: 'Ropa de abrigo', categoria: 'cat-ropa', categoriaNombre: 'Ropa',
       cuanto: '5 unidades', dono: 'Donante Sostenedor', pedido: 'ropa', pedidoNombre: 'ropa de abrigo',
       grupo: 'recibida', dia: '8', fecha: '2026-10-08', paso: 'Confirmaste la recepción el 8 de octubre.'},
      {clave: 'r6', nombre: 'Leche en polvo', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '12 unidades', dono: 'Lácteos Ejemplo SA', pedido: 'leche', pedidoNombre: 'leche en polvo',
       grupo: 'recibida', dia: '6', fecha: '2026-10-06', paso: 'Confirmaste la recepción el 6 de octubre.'},
      {clave: 'r5', nombre: 'Fideos secos', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '8 kg', dono: 'Distribuidora Ejemplo SA', pedido: null, pedidoNombre: null,
       grupo: 'recibida', dia: '5', fecha: '2026-10-05', paso: 'Confirmaste la recepción el 5 de octubre.'},
      {clave: 'r2', nombre: 'Arroz', categoria: 'cat-alimentos', categoriaNombre: 'Alimentos',
       cuanto: '10 kg', dono: 'Almacén Ejemplo SRL', pedido: 'arroz', pedidoNombre: 'arroz',
       grupo: 'recibida', dia: '2', fecha: '2026-10-02', paso: 'Confirmaste la recepción el 2 de octubre.'} } },
             asignadas=${escenario == 'vacio' ? {} : todas.?[(grupo != 'puerta' or #root.escenario != 'sin-puerta') and (clave != 'aceite' or #root.escenario != 'sin-resultados')]},
             grupos=${ {
      {clave: 'puerta', valor: 'en-tu-puerta', nombre: 'Esperan tu confirmación', estado: 'Espera tu confirmación'},
      {clave: 'problema', valor: 'con-problema', nombre: 'Con problema', estado: 'Con problema'},
      {clave: 'camino', valor: 'en-camino', nombre: 'En camino', estado: 'En camino'},
      {clave: 'salir', valor: 'por-salir', nombre: 'Pendientes', estado: 'Pendiente'},
      {clave: 'recibida', valor: 'recibidas', nombre: 'Recibidas en octubre', estado: 'Recepción confirmada'} } }">
  <svg th:replace="~{iconos :: categorias}"></svg>
  <th:block th:replace="${cuerpo}"></th:block>
</th:block>

<!--/* El acceso a Notificaciones: no es una sección del menú (ficha, sección 2); va en la cabecera de
       cada pantalla de la entidad que dibuja este grupo. Sin rojo ni signo de exclamación: es un dato. */-->
<a th:fragment="novedades(cuantas)" class="novedades" href="/entidad-notificaciones"
   th:href="@{/entidad-notificaciones}">
  <span class="novedades-cuenta" th:text="${cuantas}">3</span>
  <span th:text="${cuantas == 1} ? 'novedad urgente sin leer' : 'novedades urgentes sin leer'">novedades urgentes sin leer</span>
</a>

<!--/* El error del servidor al cargar: qué pasó, que no cambió nada, volver a cargar y el código. */-->
<section th:fragment="error(titulo, texto, recargar)" class="banner" data-estado="error" role="alert"
         aria-labelledby="error-titulo">
  <h2 id="error-titulo" th:text="${titulo}">No pudimos cargar tu inicio.</h2>
  <p><th:block th:text="${texto}">Es un problema nuestro: no cambió nada en tus entregas ni en tus
    pedidos. Probá de nuevo en unos minutos; si sigue,</th:block> <a href="/publico-contacto?codigo=a1b2c3d4e5f6"
       th:href="@{/publico-contacto(codigo='a1b2c3d4e5f6',volver=${recargar})}">escribinos
      con este código</a>.</p>
  <p class="aviso-codigo">Código: <code>a1b2c3d4e5f6</code></p>
  <a class="boton" data-tono="secundario" href="/entidad-inicio" th:href="${recargar}">Volver
    a cargar</a>
</section>

</body>
</html>
