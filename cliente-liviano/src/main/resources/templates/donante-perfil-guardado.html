<!DOCTYPE html>
<!--/* Mi perfil de quien dona después de guardar, solo en la maqueta (DA-06: sin página de respuesta
       propia). Es el envoltorio que delega en donante-perfil :: hoja(true): el mismo perfil con el
       aviso breve de lo que se guardó (sin parámetro, "No mostrarlo"; ?mostrar=si, "Mostrar mi
       nombre"; ?seccion=datos o avisos, la sección; la pestaña la conserva el navegador). Fuera de
       la maqueta, el envío vuelve a donante-perfil con el aviso del servidor
       (DonantePerfilEnvioController). */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'donante-perfil', ~{::contenido})}">
<head>
  <title>Guardado - Mi perfil - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{donante-perfil :: hoja(true)}"></th:block>
</th:block>
</body>
</html>
