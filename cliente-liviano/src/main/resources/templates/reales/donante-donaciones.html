<!DOCTYPE html>
<!--/* Mis donaciones con los datos de Donaciones (la maqueta sigue en donante-donaciones.html).
       Usa la hoja y las clases de esa pantalla. Lo que Donaciones todavía no informa (destino y
       categoría) no se muestra. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'donante-donaciones', ~{::contenido})}">
<head>
  <title>Mis donaciones - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <div class="donaciones">
    <header>
      <p class="rotulo" th:text="${seccion}">Mis donaciones</p>
      <h1>Lo que donaste</h1>
    </header>

    <section th:if="${#lists.isEmpty(donaciones)}" class="vacio" aria-labelledby="vacio-titulo">
      <h2 id="vacio-titulo">Todavía no registraste donaciones.</h2>
      <a class="boton" data-tono="secundario" href="/donante-entidades"
         th:href="@{/donante-entidades}">Ver entidades</a>
    </section>

    <th:block th:unless="${#lists.isEmpty(donaciones)}">
      <div class="libro-columnas" aria-hidden="true">
        <span>N.º</span><span>Donación</span><span>Cuánto</span><span>Donada</span><span>Estado</span>
      </div>
      <ol class="libro" role="list">
        <li th:each="d, vuelta : ${donaciones}" class="asiento"
            th:classappend="|asiento--${d.estado.tono}|">
          <p class="asiento-numero">
            <span aria-hidden="true"><small>N.º</small> <b th:text="${vuelta.count}">1</b></span>
            <span class="solo-lectores" th:text="|Donación número ${vuelta.count}|">Donación número 1</span>
          </p>
          <div class="asiento-que"><h2 th:text="${d.descripcion}">Arroz largo fino</h2></div>
          <p class="asiento-para"><b th:text="${d.cantidad}">10</b><span>unidades</span></p>
          <p class="asiento-donada"
             th:text="|Donada el ${#temporals.format(d.fechaRegistro, 'dd/MM/yyyy')}|">Donada el 14/10/2026</p>
          <p class="asiento-estado">
            <span class="estado" th:data-estado="${d.estado.tono}">
              <th:block th:replace="~{componentes/sello :: sello(${d.estado.tono})}"></th:block>
              <span th:text="${d.estado.texto}">Pendiente</span>
            </span>
          </p>
        </li>
      </ol>
    </th:block>
  </div>
</th:block>
</body>
</html>
