<!DOCTYPE html>
<!--/* Raíces, la página 429 (docs/interfaz/flujos/raices-paginas-de-error.md): el api-gateway cortó el
       pedido porque la cuenta, o la conexión sin cuenta, superó su límite de solicitudes por minuto
       (rate limiting, E7, ADR 20261115). No es una falla nuestra ni de quien llegó: alcanza con
       esperar. "Volver a intentar" pide la misma dirección con GET, sin reenviar un formulario. En la
       maqueta, ?respuesta=429 en cualquier pantalla. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{${marco ?: 'layout-publico'} :: pagina(~{::title}, 'publico-error', ~{::contenido})}">
<head>
  <title>Demasiados pedidos seguidos - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{pagina-error :: pagina('Hubo demasiados pedidos', 'seguidos',
            'Para que DonaTrack ande bien para todos, cada cuenta puede hacer una cantidad de operaciones por minuto. Esperá un minuto y probá de nuevo. Si estabas enviando algo, fijate si quedó guardado antes de repetirlo.',
            'Volver a intentar',
            ${path != null and #strings.startsWith(path, '/') and !#strings.startsWith(path, '//') ? path : '/'},
            true,
            'Si te pasa seguido, escribinos con este código.',
            'Si te pasa seguido, escribinos y contanos qué estabas haciendo.')}"></th:block>
</th:block>
</body>
</html>
