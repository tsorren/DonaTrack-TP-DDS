<!DOCTYPE html>
<!--/* Raíces, sitio A: la navegación pública (ficha docs/interfaz/flujos/raices-publico-navegable.md,
       sección 2), la misma en todas las públicas, también en la portada. En el celular, las secciones
       van en una barra inferior oscura con un ícono cada una (Inicio, Entregas, Mapa y Organizaciones)
       e Ingresar y Crear cuenta quedan arriba, en la cabecera (usuario, 2026-11-12); desde la tableta,
       todo en la cabecera, junto a la marca, sin íconos ni Inicio (publico-navegacion.css). En la
       barra, "Entregas" y "Crear cuenta": lo demás del nombre se oculta a la vista y lo leen los
       lectores. actual: la pantalla de la sección actual (las de registro marcan "Crear una
       cuenta"; la portada, "publico-portada"); '' en Contacto y Términos. No es una pantalla: su
       nombre no empieza con un rol.
       Con la sesión iniciada (salidaDeLaCuenta en el modelo, de Pantallas): "Ir a mi inicio" en
       lugar de Ingresar y Crear una cuenta, y el fragmento cuenta, la foto con el menú de la cuenta,
       después de la navegación (docs/interfaz/flujos/r11-p1-portada.md).
       Fragmentos:
       - navegacion(actual): la barra de secciones y el acceso.
       - cuenta: la foto con el menú de la cuenta; nada sin sesión. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navegacion(actual)" class="navegacion" data-zona="publica" aria-label="Secciones">
  <svg th:replace="~{iconos :: navegacion}"></svg>
  <ul class="navegacion-barra" role="list">
    <li class="navegacion-inicio"><a href="/publico-portada" th:href="@{/publico-portada}"
           th:aria-current="${actual == 'publico-portada'} ? 'page' : null"><svg class="navegacion-icono"
          aria-hidden="true" focusable="false"><use href="#nav-inicio"></use></svg>Inicio</a></li>
    <li><a href="/publico-donaciones" th:href="@{/publico-donaciones}"
           th:aria-current="${actual == 'publico-donaciones'} ? 'page' : null"><svg class="navegacion-icono"
          aria-hidden="true" focusable="false"><use href="#nav-entregas"></use></svg><span>Entregas<span
          class="navegacion-largo"> confirmadas</span></span></a></li>
    <li><a href="/publico-mapa" th:href="@{/publico-mapa}"
           th:aria-current="${actual == 'publico-mapa'} ? 'page' : null"><svg class="navegacion-icono"
          aria-hidden="true" focusable="false"><use href="#nav-mapa"></use></svg>Mapa</a></li>
    <li><a href="/publico-entidades" th:href="@{/publico-entidades}"
           th:aria-current="${actual == 'publico-entidades'} ? 'page' : null"><svg class="navegacion-icono"
          aria-hidden="true" focusable="false"><use href="#nav-entidades"></use></svg>Organizaciones</a></li>
  </ul>
  <ul class="navegacion-acceso" role="list">
    <th:block th:if="${salidaDeLaCuenta == null}">
    <li><a href="/publico-ingresar"
           th:href="@{/publico-ingresar}"
           th:aria-current="${actual == 'publico-ingresar'} ? 'page' : null">Ingresar</a></li>
    <li class="navegacion-destacado"><a href="/publico-registro"
           th:href="@{/publico-registro}"
           th:aria-current="${actual == 'publico-registro'} ? 'page' : null"><span>Crear<span
          class="navegacion-largo"> una</span> cuenta</span></a></li>
    </th:block>
    <!--/* Con la sesión iniciada (ficha r11-p1-portada.md): en lugar de Ingresar y Crear una cuenta, la
           salida a lo propio, destacada y sin sección marcada. En la barra del celular, el nombre
           corto ("Mi inicio"); el largo ("Ir a mi inicio") es el que leen los lectores y el que se ve
           desde la tableta (publico-navegacion.css). Con la solicitud pendiente, "Ver mi solicitud",
           marcado como la página actual en "Recibimos la solicitud" (enLaSolicitud, R11-41). */-->
    <li th:if="${salidaDeLaCuenta != null}" class="navegacion-destacado"
        th:with="pendiente=${salidaDeLaCuenta.pendiente}"><a href="/donante-inicio"
           th:href="${salidaDeLaCuenta.ruta}"
           th:aria-current="(${pendiente} and ${enLaSolicitud}) ? 'page' : null"><span class="navegacion-largo"
          th:text="${pendiente} ? 'Ver mi solicitud' : 'Ir a mi inicio'">Ir a mi inicio</span><span
          aria-hidden="true" th:text="${pendiente} ? 'Mi solicitud' : 'Mi inicio'">Mi inicio</span></a></li>
  </ul>
</nav>
<!--/* La cuenta en la cabecera de lo público, solo con la sesión iniciada: el mismo menú del área
       privada (cuenta-menu.html), sin campanita. */-->
<th:block th:fragment="cuenta"><th:block th:if="${salidaDeLaCuenta != null}"><details
    th:replace="~{cuenta-menu :: menu}"></details></th:block></th:block>
</body>
</html>
