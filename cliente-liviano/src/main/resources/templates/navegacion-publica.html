<!DOCTYPE html>
<!--/* Raíces, sitio A: la navegación pública (ficha docs/interfaz/flujos/raices-publico-navegable.md,
       sección 2), la misma en todas las públicas, también en la portada. Como el menú privado: en el
       celular, una barra inferior en la tierra con la sección actual en paja; desde la tableta, en
       la cabecera verde oscuro, junto a la marca (publico-navegacion.css; usuario, 2026-11-03). En la barra,
       "Entregas" y "Crear cuenta": lo demás del nombre se oculta a la vista y lo leen los lectores.
       actual: la pantalla de la sección actual (las de registro marcan "Crear una cuenta"); '' en
       la portada, Contacto y Términos. No es una pantalla: su nombre no empieza con un rol. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navegacion(actual)" class="navegacion" data-zona="publica" aria-label="Secciones">
  <ul role="list">
    <li><a href="/publico-donaciones" th:href="@{/publico-donaciones}"
           th:aria-current="${actual == 'publico-donaciones'} ? 'page' : null"><span>Entregas<span
          class="navegacion-largo"> confirmadas</span></span></a></li>
    <li><a href="/publico-mapa" th:href="@{/publico-mapa}"
           th:aria-current="${actual == 'publico-mapa'} ? 'page' : null">Mapa</a></li>
    <li><a href="/publico-entidades" th:href="@{/publico-entidades}"
           th:aria-current="${actual == 'publico-entidades'} ? 'page' : null">Entidades</a></li>
    <li class="navegacion-aparte"><a href="/publico-ingresar"
           th:href="@{/publico-ingresar}"
           th:aria-current="${actual == 'publico-ingresar'} ? 'page' : null">Ingresar</a></li>
    <li class="navegacion-destacado"><a href="/publico-registro"
           th:href="@{/publico-registro}"
           th:aria-current="${actual == 'publico-registro'} ? 'page' : null"><span>Crear<span
          class="navegacion-largo"> una</span> cuenta</span></a></li>
  </ul>
</nav>
</body>
</html>
