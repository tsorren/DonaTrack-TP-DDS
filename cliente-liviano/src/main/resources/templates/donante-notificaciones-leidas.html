<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'donante-notificaciones', ~{::contenido})}">
<head>
  <title>Listo - Notificaciones - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <th:block th:replace="~{donante-notificaciones :: hoja(true)}"></th:block>
</th:block>
</body>
</html>
