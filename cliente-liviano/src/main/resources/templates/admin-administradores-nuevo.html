<!DOCTYPE html>
<!--/* Dar de alta un administrador como página aparte (R11-10, ficha docs/interfaz/flujos/
       r11-p1-admins.md §4.3; DA-35): el mismo formulario de la ventana de Administradores
       (admin-administradores :: formulario). Llega acá sin JavaScript: al abrirla de forma directa o
       cuando el alta vuelve con un error de datos o del servicio (con HTMX, en cambio, el error vuelve
       a la ventana abierta), con lo escrito conservado. Desde la guía al código (ADM2-07), deriva del
       arquetipo A12 (docs/interfaz/guia/partes/50-pantallas.html, #confirmar) como Registrar
       donación: las migas a Administradores, la columna del formulario, el resumen del error arriba
       con un enlace a cada campo, los campos del catálogo, una sola acción llena y la salida sin dar
       de alta como enlace. El modelo (web.AdminAdministradoresController): errores (por campo),
       nombre, apellido y correo (lo escrito), errorAlta y codigo. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'admin-secciones', ~{::contenido})}">
<head>
  <title>Dar de alta un administrador - Administradores - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <div class="pila" data-espacio="4" data-pantalla="alta-administrador">
    <div class="pila" data-espacio="1">
      <nav th:replace="~{componentes/migas :: migas(pasos=${ { {texto: 'Administradores', ruta: '/admin-administradores'} } }, actual='Dar de alta un administrador')}"></nav>
      <h1>Dar de alta un administrador</h1>
    </div>
    <th:block th:replace="~{admin-administradores :: formulario(false)}"></th:block>
    <!--/* La salida: un enlace, no otro botón. */-->
    <p><a href="/admin-administradores" th:href="@{/admin-administradores}">Volver sin dar de alta</a></p>
  </div>
</th:block>
</body>
</html>
