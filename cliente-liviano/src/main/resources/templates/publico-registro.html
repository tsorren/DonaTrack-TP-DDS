<!DOCTYPE html>
<!--/* Crear una cuenta (ficha docs/interfaz/flujos/raices-publico-navegable.md, 4.5), como el registro
       de frontend-donatrack (usuario, 2026-11-08): la cabeza centrada y las tres tarjetas del tipo de
       cuenta (persona, empresa, entidad); cada una lleva a su formulario. No carga datos: no tiene
       estados. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-publico :: pagina(~{::title}, 'publico-registro', ~{::contenido})}">
<head>
  <title>Crear una cuenta - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <div class="registro">
    <header th:replace="~{componentes/registro :: cabeza}"></header>
    <nav th:replace="~{componentes/registro :: tipos('')}"></nav>
    <p class="registro-salida">¿Ya tenés cuenta? <a href="/publico-ingresar"
       th:href="@{/publico-ingresar}">Ingresar</a></p>
  </div>
</th:block>
</body>
</html>
