<!DOCTYPE html>
<!--/* El donante quedó registrado, solo en la maqueta (DA-06 y DA-33, ADM2-11: sin página de respuesta
       propia). Es Donantes (admin-donantes :: hoja('')) con el aviso breve del registro; los datos de
       la lista los arma AdminDonantesController como en /admin-donantes. ?escenario=ya-era: el
       documento ya era de un donante y no se duplica. La donación se registra desde la ficha del
       donante («Registrar una donación»). Fuera de la maqueta, el envío vuelve a /admin-donantes con
       el aviso del servidor (AdminDonantesEnvioController), con el mismo texto. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-privado :: pagina(~{::title}, 'admin-secciones', ~{::contenido})}">
<head>
  <title>Donante registrado - Donantes - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido">
  <!--/* El aviso breve, debajo de la cabecera de Donantes como en las otras respuestas de la ola
         (admin-donaciones :: hecho, que lee avisoHecho). */-->
  <th:block th:with="avisoHecho=${param.escenario != null and param.escenario[0] == 'ya-era'} ? 'Ana Ejemplo ya era donante. No cambiamos nada.' : 'Registraste a Ana Ejemplo como donante.'">
    <th:block th:replace="~{admin-donantes :: hoja('')}"></th:block>
  </th:block>
</th:block>
</body>
</html>
