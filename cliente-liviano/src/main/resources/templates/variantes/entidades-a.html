<!DOCTYPE html>
<!--/* Prueba A/B de Entidades (ronda del 2026-11-09, tarde; docs/interfaz/plan-ronda-2026-11-09-tarde.md),
       opción A, la recomendada. Eje: cómo entra la barra de progreso en el renglón plegado y cómo se ve
       desplegado. A: plegado, una barra fina debajo del nombre con un pedido en palabras (el de
       emergencia, si hay; si no, el primero con cantidad); desplegado, cada pedido con su barra entera
       y las cifras, como la pantalla base. El resto de la pantalla (cabeza, filtros, estados y salidas)
       es el de publico-entidades.html. Se borra al decidir. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-publico :: pagina(~{::title}, 'publico-entidades', ~{::contenido})}">
<head>
  <title>Entidades - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido" th:with="vistaEntidades=~{variantes/entidades-a :: vista}">
  <th:block th:replace="~{datos-publicos :: datos(~{publico-entidades :: pantalla})}"></th:block>
</th:block>

<div th:fragment="vista" class="pila" data-espacio="5" data-v="entidades-a"
     th:with="grupos=${ {
       {titulo: 'Comedores y merenderos', tipos: {'Comedor', 'Merendero'}},
       {titulo: 'Escuelas y bibliotecas', tipos: {'Escuela', 'Biblioteca'}},
       {titulo: 'Hogares', tipos: {'Hogar'}},
       {titulo: 'Clubes', tipos: {'Club'}} } }">
  <th:block th:each="g, vuelta : ${grupos}" th:with="suyas=${visibles.?[#lists.contains(#root.g.tipos, tipo)]}">
  <section th:unless="${suyas.isEmpty()}" class="pila" data-espacio="2" th:attr="aria-labelledby=${'grupo-' + vuelta.count}">
    <h2 th:id="${'grupo-' + vuelta.count}" class="racimo">
      <th:block th:text="${g.titulo}">Comedores y merenderos</th:block>
      <span class="texto-chico" data-tono="suave"
            th:text="${#lists.size(suyas) == 1 ? '1 entidad' : #lists.size(suyas) + ' entidades'}">2 entidades</span></h2>
    <ul class="pila" data-espacio="1" role="list">
      <li th:each="e : ${suyas}"
          th:with="pedidos=${e.pedidos.?[('__${categoria}__' == '' or cat == '__${categoria}__') and ('__${tipoPedido}__' == '' or tipo == '__${tipoPedido}__') and (!__${soloEmergencia}__ or emergencia)]},
                   conTotal=${pedidos.?[total != null]},
                   urgentes=${conTotal.?[emergencia]},
                   principal=${!urgentes.isEmpty() ? urgentes[0] : (conTotal.isEmpty() ? pedidos[0] : conTotal[0])},
                   total=${#lists.size(pedidos)}">
        <details class="plegable">
          <summary>
            <span data-v="entidades-a-cabeza">
              <span class="plegable-titulo">
                <b th:id="${'entidad-' + e.clave}" th:text="${e.nombre}">Comedor Barrio Ejemplo</b>
                <span th:text="|${e.tipo} · ${e.barrio}|">Comedor · Barrio Ejemplo</span>
              </span>
              <!--/* La barra fina: un pedido, con su cifra en palabras (la barra no se lee sola). */-->
              <span data-v="entidades-a-avance">
                <progress th:if="${principal.total != null}" class="progreso" data-v="fina" max="40" value="10"
                          th:max="${principal.total}" th:value="${principal.total - principal.faltan}"
                          aria-hidden="true"></progress>
                <span th:text="|${principal.que}: ${#strings.toLowerCase(principal.falta)}|">Lentejas secas: faltan
                  30 de 40 kg este mes</span>
              </span>
            </span>
            <span th:replace="~{publico-entidades :: chips(${pedidos})}"></span>
            <span class="plegable-ver"
                  th:text="${total == 1 ? 'Ver el pedido' : 'Ver los ' + total + ' pedidos'}">Ver los 5 pedidos</span>
          </summary>
          <div class="plegable-cuerpo">
            <ul class="pedidos" role="list">
              <li th:each="p : ${pedidos}"><th:block th:replace="~{publico-entidades :: pedido(${p})}"></th:block></li>
            </ul>
            <a th:if="${e.numero != null}" class="boton" data-tamano="chico" href="/publico-mapa#entidad-comedor"
               th:href="@{/publico-mapa} + '#entidad-' + ${e.clave}"
               th:attr="aria-describedby=${'entidad-' + e.clave}">Ver sus entregas en el mapa</a>
          </div>
        </details>
      </li>
    </ul>
  </section>
  </th:block>
</div>
</body>
</html>
