<!DOCTYPE html>
<!--/* Lo que comparten las tres variantes de Entidades del admin (ronda 2026-11-09: "Es horrible la
       sección de Entidades. Repensar y presentar pruebas abc"): los datos de ejemplo, los filtros de las
       activas y las acciones de una solicitud. Se borra con las variantes al decidir. No es una variante
       (VariantesInterceptor solo mira templates/variantes/*.html, sin subcarpetas).
       Datos coherentes con la ficha (docs/interfaz/flujos/raices-admin-navegable.md, 4.3) y con las
       páginas públicas: 3 piden sumarse, 46 activas, 6 con pedidos vigentes (11 pedidos).
       Fragmentos:
       - datos(pantalla): define solicitudes, activas (filtradas por ?buscar=, ?pedidos=con|sin y
         ?tipo=), conPedidos, sinPedidos y escenario (?escenario=vacio: nadie pide sumarse), y dibuja
         la pantalla.
       - acciones(e): Aprobar (POST), Pedir corrección y Rechazar (diálogos del navegador, popover, con
         su campo obligatorio). Funcionan sin JavaScript.
       - documentos(e): lo que mandó la entidad, con un tilde o una cruz y la palabra. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="datos(pantalla)"
    th:with="fPedidos=${param.pedidos != null and #lists.contains({'con', 'sin'}, param.pedidos[0]) ? param.pedidos[0] : ''},
             fTipo=${param.tipo != null and #lists.contains({'Comedor', 'Merendero', 'Escuela', 'Hogar', 'Club', 'Biblioteca', 'Centro comunitario'}, param.tipo[0]) ? param.tipo[0] : ''}">
<th:block
    th:with="escenario=${param.escenario != null ? param.escenario[0] : ''},
             q=${param.buscar != null ? #strings.trim(param.buscar[0]) : ''},
             todas=${ {
      {clave: 'hogar', nombre: 'Hogar Ejemplo Norte', tipo: 'Hogar', cat: 'ropa', localidad: 'Localidad Ejemplo', cuando: '9 de octubre',
       espera: 'Hace 6 días', falta: null, razon: 'Asociación Civil Hogar Ejemplo Norte', cuit: '30-00000011-0',
       direccion: 'Calle Ejemplo 1234, Localidad Ejemplo, Buenos Aires', responsable: 'Rosa Ejemplo',
       correo: 'hogar@ejemplo.org', constancia: 'constancia-domicilio.pdf'},
      {clave: 'merendero-este', nombre: 'Merendero Ejemplo Este', tipo: 'Merendero', cat: 'alimentos', localidad: 'Localidad Ejemplo',
       cuando: '12 de octubre', espera: 'Hace 3 días', falta: 'Le falta la constancia de domicilio',
       razon: 'Merendero Ejemplo Este Asociación Civil', cuit: '30-00000012-0',
       direccion: 'Pasaje Ejemplo 56, Localidad Ejemplo, Buenos Aires', responsable: 'Luis Ejemplo',
       correo: 'merendero@ejemplo.org', constancia: null},
      {clave: 'comedor-oeste', nombre: 'Comedor Ejemplo Oeste', tipo: 'Comedor', cat: 'alimentos', localidad: 'Localidad Ejemplo',
       cuando: '14 de octubre', espera: 'Ayer', falta: null, razon: 'Comedor Comunitario Ejemplo Oeste',
       cuit: '30-00000013-0', direccion: 'Avenida Ejemplo 789, Localidad Ejemplo, Buenos Aires',
       responsable: 'Marta Ejemplo', correo: 'comedor@ejemplo.org', constancia: 'constancia.pdf'} } },
             solicitudes=${escenario == 'vacio' ? {} : todas},
             todasActivas=${ {
      {clave: 'comedor', nombre: 'Comedor Barrio Ejemplo', tipo: 'Comedor', cat: 'alimentos', localidad: 'Barrio Ejemplo',
       alta: '4 de febrero', entregas: 5, responsable: 'Carmen Ejemplo', correo: 'comedor.barrio@ejemplo.org', pedidos: {
         {que: 'Lentejas secas', cat: 'alimentos', falta: 'Faltan 30 de 40 kg este mes'},
         {que: 'Arroz', cat: 'alimentos', falta: 'Faltan 25 de 40 kg este mes'},
         {que: 'Aceite de girasol', cat: 'alimentos', falta: 'Faltan 20 litros, hasta el 20 de octubre'},
         {que: 'Leche en polvo', cat: 'alimentos', falta: 'Faltan 12 de 24 unidades, hasta el 25 de octubre'} } },
      {clave: 'escuela', nombre: 'Escuela Ejemplo N.º 12', tipo: 'Escuela', cat: 'escolares', localidad: 'Centro Ejemplo',
       alta: '30 de junio', entregas: 1, responsable: 'Inés Ejemplo', correo: 'escuela12@ejemplo.org', pedidos: {
         {que: 'Sillas', cat: 'muebles', falta: 'Faltan 14 de 20 unidades, hasta el 30 de noviembre'},
         {que: 'Útiles escolares', cat: 'escolares', falta: 'Faltan 4 cajas, hasta el 30 de noviembre'} } },
      {clave: 'merendero', nombre: 'Merendero Ejemplo Sur', tipo: 'Merendero', cat: 'alimentos', localidad: 'Ejemplo Sur',
       alta: '18 de marzo', entregas: 3, responsable: 'Raúl Ejemplo', correo: 'merendero.sur@ejemplo.org', pedidos: {
         {que: 'Galletitas', cat: 'alimentos', falta: 'Faltan 10 de 20 kg este mes'},
         {que: 'Leche en polvo', cat: 'alimentos', falta: 'Faltan 20 unidades, hasta el 31 de octubre'} } },
      {clave: 'hogar-casa', nombre: 'Hogar Casa Ejemplo', tipo: 'Hogar', cat: 'ropa', localidad: 'Parque Ejemplo',
       alta: '2 de mayo', entregas: 0, responsable: 'Elena Ejemplo', correo: 'hogar.casa@ejemplo.org', pedidos: {
         {que: 'Frazadas', cat: 'ropa', falta: 'Faltan 10 de 20 unidades, hasta el 15 de noviembre'} } },
      {clave: 'club', nombre: 'Club Ejemplo Norte', tipo: 'Club', cat: 'ropa', localidad: 'Ejemplo Norte',
       alta: '9 de agosto', entregas: 0, responsable: 'Diego Ejemplo', correo: 'club.norte@ejemplo.org', pedidos: {
         {que: 'Camisetas deportivas', cat: 'ropa', falta: 'Faltan 15 unidades, hasta el 30 de noviembre'} } },
      {clave: 'biblioteca', nombre: 'Biblioteca Popular Ejemplo', tipo: 'Biblioteca', cat: 'muebles', localidad: 'Villa Ejemplo',
       alta: '12 de septiembre', entregas: 0, responsable: 'Pablo Ejemplo', correo: 'biblioteca@ejemplo.org', pedidos: {
         {que: 'Sillas', cat: 'muebles', falta: 'Faltan 4 de 8 unidades, hasta el 31 de diciembre'} } },
      {clave: 'centro', nombre: 'Centro Vecinal Ejemplo', tipo: 'Centro comunitario', cat: 'alimentos', localidad: 'Localidad Ejemplo',
       alta: '21 de abril', entregas: 2, responsable: 'Sara Ejemplo', correo: 'centro@ejemplo.org', pedidos: {} },
      {clave: 'escuela3', nombre: 'Escuela Ejemplo N.º 3', tipo: 'Escuela', cat: 'escolares', localidad: 'Localidad Ejemplo',
       alta: '30 de junio', entregas: 1, responsable: 'Tomás Ejemplo', correo: 'escuela3@ejemplo.org', pedidos: {} } } },
             porFiltros=${todasActivas.?[('__${fPedidos}__' == '' or ('__${fPedidos}__' == 'con') == !pedidos.isEmpty()) and ('__${fTipo}__' == '' or tipo == '__${fTipo}__')]},
             activas=${q == '' ? porFiltros : porFiltros.?[#strings.containsIgnoreCase(nombre, #root.q) or #strings.containsIgnoreCase(localidad, #root.q)]},
             conPedidos=${activas.?[!pedidos.isEmpty()]},
             sinPedidos=${activas.?[pedidos.isEmpty()]},
             filtrado=${fPedidos != '' or fTipo != '' or q != ''},
             tipos=${ {
               {valor: '', texto: 'Todos los tipos'}, {valor: 'Comedor', texto: 'Comedores'},
               {valor: 'Merendero', texto: 'Merenderos'}, {valor: 'Escuela', texto: 'Escuelas'},
               {valor: 'Hogar', texto: 'Hogares'}, {valor: 'Club', texto: 'Clubes'},
               {valor: 'Biblioteca', texto: 'Bibliotecas'}, {valor: 'Centro comunitario', texto: 'Centros comunitarios'} } },
             conPedidosOpciones=${ {
               {valor: '', texto: 'Con y sin pedidos'}, {valor: 'con', texto: 'Con pedidos vigentes'},
               {valor: 'sin', texto: 'Sin pedidos vigentes'} } }">
  <svg th:replace="~{iconos :: categorias}"></svg>
  <th:block th:insert="${pantalla}"></th:block>
</th:block>
</th:block>

<!--/* Las tres acciones de una solicitud. Aprobar no pregunta (ficha, 4.3); Pedir corrección y Rechazar
       abren un diálogo con su campo obligatorio. */-->
<th:block th:fragment="acciones(e)">
  <div class="racimo">
    <form action="/admin-entidades-aprobada" th:action="@{/admin-entidades-aprobada}" method="post">
      <input type="hidden" name="entidad" th:value="${e.clave}" value="hogar">
      <button class="boton" data-tono="principal" type="submit" th:aria-label="|Aprobar: ${e.nombre}|">Aprobar</button>
    </form>
    <button type="button" class="boton" data-tono="secundario" th:popovertarget="|corregir-${e.clave}|"
            popovertarget="corregir-hogar" th:aria-label="|Pedir corrección: ${e.nombre}|">Pedir corrección</button>
    <button type="button" class="boton" data-tono="quitar" th:popovertarget="|rechazar-${e.clave}|"
            popovertarget="rechazar-hogar" th:aria-label="|Rechazar: ${e.nombre}|">Rechazar</button>
  </div>
  <dialog class="dialogo" th:id="|corregir-${e.clave}|" id="corregir-hogar" popover
          th:aria-labelledby="|corregir-${e.clave}-titulo|">
    <h3 class="dialogo-titulo" th:id="|corregir-${e.clave}-titulo|"
        th:text="|¿Qué tiene que corregir ${e.nombre}?|">¿Qué tiene que corregir Hogar Ejemplo Norte?</h3>
    <form class="pila" data-espacio="3" action="/admin-entidades-correccion"
          th:action="@{/admin-entidades-correccion}" method="post">
      <input type="hidden" name="entidad" th:value="${e.clave}" value="hogar">
      <div class="campo">
        <label th:for="|correccion-${e.clave}|" for="correccion-hogar">Qué tiene que corregir *</label>
        <small th:id="|correccion-${e.clave}-ayuda|" id="correccion-hogar-ayuda">Le llega a la entidad. Por
          ejemplo: "Falta la constancia de domicilio".</small>
        <textarea th:id="|correccion-${e.clave}|" id="correccion-hogar" name="correccion" rows="3" required autofocus
                  th:aria-describedby="|correccion-${e.clave}-ayuda|"
                  th:text="${e.falta != null} ? 'Falta la constancia de domicilio.' : ''"></textarea>
      </div>
      <div class="racimo">
        <button class="boton" data-tono="principal" type="submit">Pedir corrección</button>
        <button type="button" class="boton" data-tono="secundario" th:popovertarget="|corregir-${e.clave}|"
                popovertarget="corregir-hogar" popovertargetaction="hide">Cancelar</button>
      </div>
    </form>
  </dialog>
  <dialog class="dialogo" data-tono="quitar" th:id="|rechazar-${e.clave}|" id="rechazar-hogar" popover
          th:aria-labelledby="|rechazar-${e.clave}-titulo|">
    <h3 class="dialogo-titulo" th:id="|rechazar-${e.clave}-titulo|"
        th:text="|¿Rechazar la solicitud de ${e.nombre}?|">¿Rechazar la solicitud de Hogar Ejemplo Norte?</h3>
    <form class="pila" data-espacio="3" action="/admin-entidades-rechazada"
          th:action="@{/admin-entidades-rechazada}" method="post">
      <input type="hidden" name="entidad" th:value="${e.clave}" value="hogar">
      <div class="campo">
        <label th:for="|motivo-${e.clave}|" for="motivo-hogar">Motivo, que le llega a la entidad *</label>
        <textarea th:id="|motivo-${e.clave}|" id="motivo-hogar" name="motivo" rows="3" required
                  placeholder="Contanos el motivo"></textarea>
      </div>
      <div class="racimo">
        <button class="boton" data-tono="quitar" type="submit">Rechazar solicitud</button>
        <button type="button" class="boton" data-tono="secundario" th:popovertarget="|rechazar-${e.clave}|"
                popovertarget="rechazar-hogar" popovertargetaction="hide" autofocus>Cancelar</button>
      </div>
    </form>
  </dialog>
</th:block>

<!--/* Lo que mandó la entidad: cada dato con su tilde o su cruz, y la palabra. */-->
<ul th:fragment="documentos(e)" class="pila" data-espacio="1" data-lista="documentos" role="list">
  <li data-ok="si"><span aria-hidden="true">✓</span> CUIT <th:block th:text="${e.cuit}">30-00000011-0</th:block></li>
  <li data-ok="si"><span aria-hidden="true">✓</span> Dirección</li>
  <li data-ok="si"><span aria-hidden="true">✓</span> Responsable y correo</li>
  <li th:attr="data-ok=${e.constancia != null} ? 'si' : 'no'"><span aria-hidden="true"
      th:text="${e.constancia != null} ? '✓' : '✗'">✓</span> <th:block
      th:text="${e.constancia != null} ? 'Constancia de domicilio' : 'Falta la constancia de domicilio'">Constancia de
    domicilio</th:block></li>
</ul>
</body>
</html>
