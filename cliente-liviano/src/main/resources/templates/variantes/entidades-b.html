<!DOCTYPE html>
<!--/* Prueba A/B/C de Entidades (ronda del 2026-11-09), opción B. Eje: recorrer rápido. Las entidades
       en una lista compacta, agrupadas por tipo (comedores y merenderos, escuelas y bibliotecas,
       hogares, clubes), un renglón por entidad: el nombre y el barrio, las categorías que pide como
       chips con su ícono (y "Emergencia", si tiene una) y cuántos pedidos tiene; los pedidos se
       despliegan en el mismo renglón (details, sin JavaScript). El resto de la pantalla es el de
       publico-entidades.html. Se borra al decidir. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-publico :: pagina(~{::title}, 'publico-entidades', ~{::contenido})}">
<head>
  <title>Entidades - DonaTrack</title>
</head>
<body>
<th:block th:fragment="contenido" th:with="vistaEntidades=~{variantes/entidades-b :: vista}">
  <th:block th:replace="~{datos-publicos :: datos(~{publico-entidades :: pantalla})}"></th:block>
</th:block>

<div th:fragment="vista" data-v="entidades-grupos"
     th:with="grupos=${ {
       {titulo: 'Comedores y merenderos', tipos: {'Comedor', 'Merendero'}},
       {titulo: 'Escuelas y bibliotecas', tipos: {'Escuela', 'Biblioteca'}},
       {titulo: 'Hogares', tipos: {'Hogar'}},
       {titulo: 'Clubes', tipos: {'Club'}} } }">
  <th:block th:each="g, vuelta : ${grupos}" th:with="suyas=${visibles.?[#lists.contains(#root.g.tipos, tipo)]}">
  <section th:unless="${suyas.isEmpty()}" data-v="entidades-grupo" th:attr="aria-labelledby=${'grupo-' + vuelta.count}">
    <h2 th:id="${'grupo-' + vuelta.count}" data-v="entidades-grupo-titulo">
      <th:block th:text="${g.titulo}">Comedores y merenderos</th:block>
      <span th:text="${#lists.size(suyas) == 1 ? '1 entidad' : #lists.size(suyas) + ' entidades'}">2 entidades</span></h2>
    <ul data-v="entidades-renglones" role="list">
      <li th:each="e : ${suyas}" data-v="entidades-renglon"
          th:with="pedidos=${e.pedidos.?[('__${categoria}__' == '' or cat == '__${categoria}__') and ('__${tipoPedido}__' == '' or tipo == '__${tipoPedido}__') and (!__${soloEmergencia}__ or emergencia)]},
                   cats=${#lists.toList(#sets.toSet(pedidos.![cat]))},
                   total=${#lists.size(pedidos)}">
        <details data-v="entidades-renglon-pliegue">
          <summary>
            <span data-v="entidades-renglon-nombre">
              <b th:id="${'entidad-' + e.clave}" th:text="${e.nombre}">Comedor Barrio Ejemplo</b>
              <span th:text="|${e.tipo} · ${e.barrio}|">Comedor · Barrio Ejemplo</span>
            </span>
            <span data-v="entidades-chips">
              <span th:each="c : ${categorias}" th:if="${#lists.contains(cats, c.clave)}" data-v="entidades-chip">
                <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#cat-alimentos"
                     th:href="${'#cat-' + c.clave}"/></svg><th:block th:text="${c.texto}">Alimentos</th:block></span>
              <span th:unless="${pedidos.?[emergencia].isEmpty()}" data-v="entidades-chip" data-tono="emergencia">Emergencia</span>
            </span>
            <span data-v="entidades-renglon-cuenta"
                  th:text="${total == 1 ? 'Ver el pedido' : 'Ver los ' + total + ' pedidos'}">Ver los 5 pedidos</span>
          </summary>
          <ul data-v="entidades-renglon-pedidos" role="list">
            <li th:each="p : ${pedidos}">
              <svg class="categoria-icono" viewBox="-14 -14 128 128" aria-hidden="true" focusable="false"><use
                  href="#cat-alimentos" th:href="${'#cat-' + p.cat}"/></svg>
              <p><b th:text="${p.que}">Lentejas secas</b> · <th:block th:text="${p.falta}">Faltan 30 de 40 kg este
                mes</th:block> · <th:block th:text="${p.cuando}">Se repite cada mes</th:block><th:block
                th:if="${p.emergencia}"> · <span class="estado" data-estado="con-problema"><th:block
                th:replace="~{componentes/sello :: sello('con-problema')}"></th:block><span>Emergencia</span></span></th:block></p>
              <p data-v="entidades-renglon-porque" th:text="|Por qué: ${p.porque}|">Por qué: para el almuerzo.</p>
            </li>
          </ul>
          <a th:if="${e.numero != null}" class="boton" data-tamano="chico" href="/publico-mapa#entidad-comedor"
             th:href="@{/publico-mapa} + '#entidad-' + ${e.clave}"
             th:attr="aria-describedby=${'entidad-' + e.clave}">Ver sus entregas en el mapa</a>
        </details>
      </li>
    </ul>
  </section>
  </th:block>
</div>
</body>
</html>
