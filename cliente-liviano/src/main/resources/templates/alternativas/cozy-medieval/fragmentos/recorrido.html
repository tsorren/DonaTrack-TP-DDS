<!--/* Recorrido de una donación: el camino de tinta entre sus paradas. Patrón: Material Steppers.
       Cada parada lleva su signo (● cumplida, ◆ el alfiler en la actual, ○ lo que falta y ◉ el
       pueblo sellado si la última ya se cumplió), dibujado por app.css. El tramo recorrido va
       entintado; el que falta, punteado. Cada paso dice su estado en texto; el actual lleva
       aria-current="step". El número de la parada queda en el marcado y no se ve. Vertical si el
       lugar es angosto, horizontal si alcanza. titulo: nombre accesible de la lista. pasos:
       List<PasoRecorrido>. */-->
<ol th:fragment="recorrido(titulo, pasos)" class="recorrido" th:aria-label="${titulo}">
  <li th:each="paso, vuelta : ${pasos}" class="recorrido-paso"
      th:classappend="|recorrido-paso--${paso.avance.tono}|"
      th:aria-current="${paso.avance.name() == 'ACTUAL'} ? 'step' : null">
    <span class="recorrido-nodo" aria-hidden="true" th:text="${vuelta.count}">1</span>
    <span class="recorrido-texto"><span th:text="${paso.nombre}">Paso</span><small
          th:text="${paso.detalle}">Detalle</small></span>
  </li>
</ol>
