<!DOCTYPE html>
<!--/* Estructura de las pantallas privadas: la mesa del cartógrafo (bitácora, iteración 2). Toda la
       pantalla es la mesa de nogal vista desde arriba y el contenido son los objetos apoyados en
       ella. La cabecera es el borde de arriba de la mesa: la placa del fabricante (la marca), la
       cajonera con un cajón por sección y, en la otra punta, la carta de la posta y la cuenta, sin
       buscador. En el celular, los cajones bajan al borde de abajo, el más cercano a la mano.
       Uso: <html th:replace="~{alternativas/cozy-medieval/layout-privado :: pagina(~{::title}, ~{::contenido})}">. El modelo
       trae navegacion (List<OpcionNavegacion>) y cuenta (CuentaVista). Las pantallas de
       notificaciones y perfil, y la salida, llegan con sus flujos y con el IdP. Estilos: mesa.css. */-->
<html lang="es-AR" data-theme="light" xmlns:th="http://www.thymeleaf.org"
      th:fragment="pagina(titulo, contenido)">
<head th:replace="~{alternativas/cozy-medieval/layout :: cabeza(${titulo})}">
  <title>DonaTrack</title>
</head>
<body class="mesa armazon">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="encabezado">
    <a th:replace="~{alternativas/cozy-medieval/layout :: marca}">DonaTrack</a>
    <nav th:replace="~{alternativas/cozy-medieval/fragmentos/navegacion :: navegacion(${navegacion})}"></nav>
    <div class="encabezado-fin">
      <a class="boton-icono" href="/notificaciones" th:href="@{/notificaciones}"
         aria-label="Notificaciones"><svg
         th:replace="~{alternativas/cozy-medieval/fragmentos/icono :: icono('notificaciones', 22)}"></svg></a>
      <details class="cuenta">
        <summary th:aria-label="|Cuenta de ${cuenta.nombre}|" th:text="${cuenta.inicial}">A</summary>
        <div class="cuenta-menu">
          <p><b th:text="${cuenta.nombre}">Nombre</b><small th:text="${cuenta.rol}">Rol</small></p>
          <a href="/perfil" th:href="@{/perfil}">Mi perfil</a>
          <a href="/salir" th:href="@{/salir}">Salir</a>
        </div>
      </details>
    </div>
  </header>
  <main id="contenido" tabindex="-1" th:insert="${contenido}"></main>
  <!--/* Los avisos breves (toasts) se agregan acá: los lectores de pantalla los anuncian. */-->
  <div id="avisos" class="avisos" aria-live="polite"></div>
</body>
</html>
