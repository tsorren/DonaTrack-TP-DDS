<!--/* Estado de una entrega: una pieza chica del color de su estado, con el signo en un círculo de
       tinta y el texto en tinta. Color, signo y texto juntos: el color nunca va solo.
       estado: EstadoEntrega. */-->
<span th:fragment="insignia(estado)" class="insignia" th:classappend="|insignia--${estado.tono}|"><span
      class="insignia-signo" aria-hidden="true"><svg
      th:replace="~{alternativas/encastre/fragmentos/icono :: icono(${estado.icono}, 14)}"></svg></span><span
      th:text="${estado.texto}">Estado</span></span>
