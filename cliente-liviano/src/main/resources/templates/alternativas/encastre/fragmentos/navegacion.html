<!--/* Navegación por rol: el riel de piezas de Encastre. Cada sección es una pieza gris cálida, con
       su ícono en un círculo de crema, que encastra con la de al lado; la de la sección actual es
       la pieza de sol, y su lengüeta entra en el tablero. En la computadora, una columna con los
       nombres enteros; en layout-privado, en el celular, una tira fija abajo con el nombre corto
       bajo el ícono. Con más de cinco secciones (el admin tiene siete), js/encastre.js deja en la
       tira del celular cuatro piezas y una pieza "Más" que despliega el resto; sin JavaScript, la
       tira muestra todas. Patrón: Material Navigation rail y Navigation bar.
       opciones: List<OpcionNavegacion>. */-->
<nav th:fragment="navegacion(opciones)" class="navegacion" aria-label="Secciones">
  <ul>
    <li th:each="opcion : ${opciones}">
      <a href="#" th:href="@{${opcion.ruta}}"
         th:aria-current="${opcion.actual} ? 'page' : null"><span class="navegacion-signo"
            aria-hidden="true"><svg
            th:replace="~{alternativas/encastre/fragmentos/icono :: icono(${opcion.icono}, 20)}"></svg></span><span
            class="navegacion-texto" th:text="${opcion.texto}">Sección</span><span
            class="navegacion-corto" aria-hidden="true" th:text="${opcion.textoCorto}">Sección</span></a>
    </li>
  </ul>
</nav>
