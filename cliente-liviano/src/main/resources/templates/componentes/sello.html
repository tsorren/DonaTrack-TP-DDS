<!DOCTYPE html>
<!--/* El sello de un estado (D33, B2-03): el dibujo, uno por estado, para poner al lado de su palabra
       (el estado va siempre en texto: el sello es decorativo). Una sola pieza para el donante y la
       entidad; antes, cuatro copias con vocabularios distintos. Su hoja es
       static/css/componentes/sello.css.
       Uso: <th:block th:replace="~{componentes/sello :: sello('en-camino')}"></th:block>
       estado (la palabra y el dibujo):
       - pendiente (o salir): círculo punteado, todavía sin salir.
       - en-camino (o camino): círculo con la mitad ámbar.
       - entregada: el disco paja con su sombra y el tilde calado.
       - hecho (o recibida): el disco paja con el tilde calado, una etapa cumplida.
       - puerta: el disco paja liso, lo que llegó a la puerta.
       - falta: círculo hueco, una etapa que no se imprimió todavía.
       - cualquier otro (con-problema, problema): el disco rojo vivo con "!".
       El renglón con el color va aparte: <span class="estado" data-estado="en-camino">sello +
       palabra</span> (la clase .estado de sello.css). No es una pantalla: SitioController solo sirve
       nombres con rol. */-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="sello(estado)"
          th:with="forma=${estado == 'salir' ? 'pendiente' : (estado == 'camino' ? 'en-camino' : (estado == 'recibida' ? 'hecho' : estado))}">
<svg th:switch="${forma}" class="estado-sello" viewBox="0 0 22 22" aria-hidden="true" focusable="false">
  <circle th:case="'pendiente'" class="sello-contorno sello-contorno--punteado" cx="11" cy="11" r="8.5"/>
  <g th:case="'en-camino'"><circle class="sello-contorno" cx="11" cy="11" r="8.5"/><path class="sello-medio" d="M11 2.5A8.5 8.5 0 0 0 11 19.5Z"/></g>
  <g th:case="'entregada'"><circle class="sello-tinta" cx="12.5" cy="12.5" r="8.5"/><circle class="sello-hecho" cx="10.5" cy="10.5" r="8.5"/><path class="sello-calado sello-calado--fino" d="M6.5 10.5L9.5 13.5L14.5 8"/></g>
  <g th:case="'hecho'"><circle class="sello-hecho" cx="11" cy="11" r="9"/><path class="sello-calado sello-calado--fino" d="M7 11.5L10 14.5L15.5 8"/></g>
  <g th:case="'puerta'"><circle class="sello-hecho" cx="11" cy="11" r="9"/></g>
  <circle th:case="'falta'" class="sello-falta" cx="11" cy="11" r="8"/>
  <g th:case="*"><circle class="sello-problema" cx="11" cy="11" r="9"/><path class="sello-calado" d="M11 6V12.5M11 15.5V16"/></g>
</svg>
</th:block>
</body>
</html>
