# Perfil para diseñar: datos de ejemplo, ?escenario= y ?variante=
# (cliente-liviano/AGENTS.md).
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
# El acta (/entidad-seguimiento-confirmar) acepta fotos de hasta 5 MB, como
# dice su ayuda; el resto del pedido, hasta cinco fotos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
# Los puertos con datos de ejemplo; uno solo se pasa a la API con --cliente.datos.<puerto>=rest.
cliente.datos.ranking=maqueta
cliente.datos.donaciones=maqueta
cliente.datos.cuenta=maqueta
