# Perfil para diseñar: datos de ejemplo, ?escenario=, ?variante= y ?alternativa=
# (cliente-liviano/AGENTS.md).
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
# El acta del prototipo (/prototipo/entidad-seguimiento-confirmar) acepta fotos de hasta 5 MB, como
# dice su ayuda; el resto del pedido, hasta cinco fotos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
