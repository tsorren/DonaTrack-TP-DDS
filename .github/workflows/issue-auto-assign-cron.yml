name: Daily Issue Auto Assignment Cron

on:
  schedule:
    # 12:00 UTC = 9:00 AM Argentina (UTC-3)
    # Executed daily (including weekends)
    - cron: '0 12 * * *'
  workflow_dispatch: {} # Supports manual testing/triggering

jobs:
  auto-assign-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar Autoasignación de Issues
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        with:
          script: |
            const script = require('./.github/scripts/auto_assign_issues.js');
            await script({github, context});
