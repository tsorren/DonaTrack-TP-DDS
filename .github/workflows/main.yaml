# ============================================================================
# DonaTrack — Pipeline de Integración Continua
# ============================================================================
# Principios aplicados:
#   • Fail-Fast: validaciones rápidas primero, en paralelo
#   • Build Independiente: cada microservicio se compila aisladamente
#   • Detección de Cambios: solo se construyen los módulos modificados
#   • Escalabilidad: agregar un servicio no requiere editar este archivo
# ============================================================================

name: DonaTrack CI Pipeline

on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── Concurrencia ─────────────────────────────────────────────────────────────
# Cancela ejecuciones previas del mismo PR para ahorrar minutos de CI
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ============================================================================
# JOBS
# ============================================================================
jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Validación de Git Flow
  # ──────────────────────────────────────────────────────────────────────────
  # Verifica que los Pull Requests respeten la jerarquía de ramas definida
  # por la cátedra de Diseño de Sistemas de Información (UTN).
  # ──────────────────────────────────────────────────────────────────────────
  validate-git-flow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validar nomenclatura de ramas
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SRC_BRANCH: ${{ github.head_ref }}
        run: |
          echo "📌 PR: $SRC_BRANCH → $BASE_BRANCH"

          # Caso 1: Merge a main — solo desde ramas ENTREGA_*
          if [[ "$BASE_BRANCH" == "main" ]]; then
            if [[ ! "$SRC_BRANCH" =~ ^ENTREGA_[0-9]+$ ]]; then
              echo "::error::Pull Requests a 'main' solo se permiten desde ramas 'ENTREGA_N'."
              exit 1
            fi
          fi

          # Caso 2: Merge a ENTREGA_N — solo desde ramas EN_*
          if [[ "$BASE_BRANCH" =~ ^ENTREGA_([0-9]+)$ ]]; then
            DELIVERY_NUM="${BASH_REMATCH[1]}"
            REQUIRED_PREFIX="E${DELIVERY_NUM}_"

            # Excepción: Permitir la integración de correcciones/ramas de entregas anteriores
            if [[ "$SRC_BRANCH" == "E1_CORREGIDA" || "$SRC_BRANCH" == "ENTREGA_1_CORREGIDA" || "$SRC_BRANCH" =~ ^E1_ || "$SRC_BRANCH" =~ ^ENTREGA_1 ]]; then
              echo "⚠️ Excepción: Permitido integrar rama de entrega/corrección anterior ($SRC_BRANCH) a $BASE_BRANCH."
            elif [[ ! "$SRC_BRANCH" =~ ^${REQUIRED_PREFIX}.* ]]; then
              echo "::error::Pull Requests hacia '$BASE_BRANCH' deben iniciar con '$REQUIRED_PREFIX'."
              echo "  Ejemplo: ${REQUIRED_PREFIX}nombre-del-requerimiento"
              exit 1
            fi
          fi

          echo "✅ Nomenclatura de ramas válida."

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Detección de Cambios por Módulo
  # ──────────────────────────────────────────────────────────────────────────
  # Pieza clave para microservicios: determina QUÉ módulos fueron
  # modificados para evitar compilar/testear todo el reactor.
  # Si common-lib cambia, se reconstruyen todos los servicios dependientes.
  # ──────────────────────────────────────────────────────────────────────────
  detect-changes:
    needs: validate-git-flow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      common-lib: ${{ steps.filter.outputs.common-lib }}
      donaciones-service: ${{ steps.filter.outputs.donaciones-service }}
      notificaciones-service: ${{ steps.filter.outputs.notificaciones-service }}
      incentivos-service: ${{ steps.filter.outputs.incentivos-service }}
      logistica-service: ${{ steps.filter.outputs.logistica-service }}
      docker-files: ${{ steps.filter.outputs.docker-files }}
      any-service: ${{ steps.check.outputs.any-service }}
      services-matrix: ${{ steps.matrix.outputs.matrix }}
      docker-matrix: ${{ steps.docker-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar módulos modificados
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common-lib:
              - 'common-lib/**'
              - 'pom.xml'
            donaciones-service:
              - 'donaciones-service/**'
            notificaciones-service:
              - 'notificaciones-service/**'
            incentivos-service:
              - 'incentivos-service/**'
            logistica-service:
              - 'logistica-service/**'
            docker-files:
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - '**/Dockerfile*'
              - '.dockerignore'
              - '**/docker/**'
              - 'n8n/**'
              - 'integration-tests/**'

      - name: Verificar si algún servicio cambió
        id: check
        run: |
          if [[ "${{ steps.filter.outputs.common-lib }}" == "true" || \
                "${{ steps.filter.outputs.donaciones-service }}" == "true" || \
                "${{ steps.filter.outputs.notificaciones-service }}" == "true" || \
                "${{ steps.filter.outputs.incentivos-service }}" == "true" || \
                "${{ steps.filter.outputs.logistica-service }}" == "true" || \
                "${{ steps.filter.outputs.docker-files }}" == "true" ]]; then
            echo "any-service=true" >> "$GITHUB_OUTPUT"
          else
            echo "any-service=false" >> "$GITHUB_OUTPUT"
          fi

      # Genera la matrix dinámica de servicios a construir.
      # Si common-lib o docker-files cambió, se construyen todos (dependencia transversal).
      - name: Generar matrix de servicios
        id: matrix
        run: |
          SERVICES=()
          COMMON="${{ steps.filter.outputs.common-lib }}"
          DOCKER="${{ steps.filter.outputs.docker-files }}"

          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.donaciones-service }}" == "true" ]]; then
            SERVICES+=('{"service":"donaciones-service"}')
          fi
          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.notificaciones-service }}" == "true" ]]; then
            SERVICES+=('{"service":"notificaciones-service"}')
          fi
          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.incentivos-service }}" == "true" ]]; then
            SERVICES+=('{"service":"incentivos-service"}')
          fi
          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.logistica-service }}" == "true" ]]; then
            SERVICES+=('{"service":"logistica-service"}')
          fi

          if [[ ${#SERVICES[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JOINED=$(IFS=,; echo "${SERVICES[*]}")
            echo "matrix={\"include\":[${JOINED}]}" >> "$GITHUB_OUTPUT"
          fi

          echo "📦 Servicios a construir: ${SERVICES[*]:-ninguno}"

      # Genera matrix de servicios que tienen Dockerfile
      - name: Generar matrix de Docker builds
        id: docker-matrix
        run: |
          DOCKER_SERVICES=()
          COMMON="${{ steps.filter.outputs.common-lib }}"
          DOCKER="${{ steps.filter.outputs.docker-files }}"

          # Fallback corregido y unificado directamente de manera segura
          DOCKER_FINAL=()
          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.donaciones-service }}" == "true" ]]; then
            if [[ -f "donaciones-service/Dockerfile" ]]; then
              DOCKER_FINAL+=('{"service":"donaciones-service"}')
            fi
          fi
          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.notificaciones-service }}" == "true" ]]; then
            if [[ -f "notificaciones-service/Dockerfile" ]]; then
              DOCKER_FINAL+=('{"service":"notificaciones-service"}')
            fi
          fi
          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.incentivos-service }}" == "true" ]]; then
            if [[ -f "incentivos-service/Dockerfile" ]]; then
              DOCKER_FINAL+=('{"service":"incentivos-service"}')
            fi
          fi
          if [[ "$COMMON" == "true" || "$DOCKER" == "true" || "${{ steps.filter.outputs.logistica-service }}" == "true" ]]; then
            if [[ -f "logistica-service/Dockerfile" ]]; then
              DOCKER_FINAL+=('{"service":"logistica-service"}')
            fi
          fi

          if [[ ${#DOCKER_FINAL[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JOINED=$(IFS=,; echo "${DOCKER_FINAL[*]}")
            echo "matrix={\"include\":[${JOINED}]}" >> "$GITHUB_OUTPUT"
          fi

          echo "🐳 Docker builds: ${DOCKER_FINAL[*]:-ninguno}"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Lint y Formato (Spotless)
  # ──────────────────────────────────────────────────────────────────────────
  # Se ejecuta en PARALELO con build-and-test para feedback rápido.
  # Solo verifica formato — no compila ni testea.
  # ──────────────────────────────────────────────────────────────────────────
  lint-and-format:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any-service == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verificar formato (Spotless)
        run: |
          echo "🔍 Verificando estilo de código..."
          mvn -B spotless:check --fail-at-end
          echo "✅ Formato verificado correctamente."

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Build y Tests (Matrix por Servicio)
  # ──────────────────────────────────────────────────────────────────────────
  # Cada microservicio se compila y testea de forma AISLADA.
  # Usa -pl para seleccionar el módulo y -am para resolver dependencias
  # (common-lib). Esto refleja el principio de despliegue independiente.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any-service == 'true' && toJSON(fromJSON(needs.detect-changes.outputs.services-matrix).include) != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.services-matrix) }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: "Compilar y testear: ${{ matrix.service }}"
        run: |
          echo "🔨 Construyendo ${{ matrix.service }}..."
          mvn -B clean verify \
            -pl ${{ matrix.service }} -am \
            -Dspotless.check.skip=true
          echo "✅ ${{ matrix.service }} construido y testeado."

      - name: Subir reportes de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 14

      - name: Subir reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 14

      - name: Subir JAR de ${{ matrix.service }}
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 1

      - name: Subir PUML de ${{ matrix.service }}
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: puml-pr-${{ matrix.service }}
          path: ${{ matrix.service }}/target/modelo_tecnico.puml
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Análisis SonarCloud
  # ──────────────────────────────────────────────────────────────────────────
  # Se ejecuta DESPUÉS del build para reutilizar los reportes de JaCoCo.
  # SonarCloud gestiona el Quality Gate (umbral de cobertura configurado
  # desde la plataforma, no desde el pipeline).
  # ──────────────────────────────────────────────────────────────────────────
  sonar-analysis:
    needs: [lint-and-format, build-and-test]
    if: ${{ always() && needs.build-and-test.result == 'success' && needs.lint-and-format.result == 'success' && (github.base_ref == 'main' || startsWith(github.base_ref, 'ENTREGA_')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Descargar reportes de JaCoCo
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: jacoco-reports

      - name: Descargar reportes de Surefire
        uses: actions/download-artifact@v4
        with:
          pattern: surefire-*
          path: surefire-reports

      - name: Reubicar reportes de test y cobertura
        run: |
          # Reubicar JaCoCo
          if [ -d "jacoco-reports" ]; then
            for dir in jacoco-reports/jacoco-*; do
              if [ -d "$dir" ]; then
                svc="${dir#jacoco-reports/jacoco-}"
                echo "📋 Reubicando reporte de cobertura para $svc..."
                mkdir -p "${svc}/target/site/jacoco"
                cp -r "$dir"/* "${svc}/target/site/jacoco/"
              fi
            done
          fi

          # Reubicar Surefire
          if [ -d "surefire-reports" ]; then
            for dir in surefire-reports/surefire-*; do
              if [ -d "$dir" ]; then
                svc="${dir#surefire-reports/surefire-}"
                echo "📋 Reubicando reporte de tests para $svc..."
                mkdir -p "${svc}/target/surefire-reports"
                cp -r "$dir"/* "${svc}/target/surefire-reports/"
              fi
            done
          fi

      - name: Compilar clases y análisis Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_URL: ${{ secrets.SONAR_URL }}
        run: |
          echo "📊 Compilando y ejecutando análisis SonarCloud..."
          mvn -B test-compile sonar:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.host.url="$SONAR_URL" \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=**/target/surefire-reports \
            -Dspotless.check.skip=true
          echo "✅ Análisis SonarCloud completado."

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: Verificación de Imágenes Docker (Matrix)
  # ──────────────────────────────────────────────────────────────────────────
  # Construye las imágenes Docker SOLO de los servicios modificados.
  # No hace push (es CI, no CD). Usa cache de layers para acelerar builds.
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    needs: [detect-changes, build-and-test]
    if: ${{ needs.build-and-test.result == 'success' && toJSON(fromJSON(needs.detect-changes.outputs.docker-matrix).include) != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar JAR compilado
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Construir imagen: ${{ matrix.service }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          target: ci
          build-args: |
            JAR_FILE=${{ matrix.service }}/target/${{ matrix.service }}-1.0.jar
          push: false
          tags: donatrack/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: Generar Diagramas (Siempre)
  # ──────────────────────────────────────────────────────────────────────────
  # Genera diagramas PlantUML desde el código y los renderiza a SVG.
  # Se ejecuta siempre que hay cambios en los servicios.
  # ──────────────────────────────────────────────────────────────────────────
  generate-diagrams:
    needs: [detect-changes, build-and-test]
    if: ${{ needs.build-and-test.result == 'success' && toJSON(fromJSON(needs.detect-changes.outputs.services-matrix).include) != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.services-matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout de la rama Base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Descargar PUML de PR
        uses: actions/download-artifact@v4
        with:
          name: puml-pr-${{ matrix.service }}
          path: pr_uml/

      - name: Instalar Graphviz y descargar PlantUML
        run: |
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" -o DPkg::Lock::Timeout=30 graphviz || (sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" && sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout="10" -o Acquire::https::Timeout="10" -o DPkg::Lock::Timeout=30 graphviz)
          curl --proto '=https' --proto-redir =https -L -s -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Generar PUML de Base
        run: |
          echo "📐 Generando diagrama de clase para ${{ matrix.service }} en rama Base..."
          if [ -d "${{ matrix.service }}" ]; then
            mvn -B clean test \
              -pl ${{ matrix.service }} -am \
              -DskipTests=true \
              -Dspotless.check.skip=true \
              -Dplantuml-generator.skip=false || true
          fi
          
          if [ ! -f "${{ matrix.service }}/target/modelo_tecnico.puml" ]; then
            echo "⚠️ El archivo PlantUML no existe o no pudo generarse. Creando uno vacío..."
            mkdir -p "${{ matrix.service }}/target"
            echo "@startuml" > "${{ matrix.service }}/target/modelo_tecnico.puml"
            echo "@endum" >> "${{ matrix.service }}/target/modelo_tecnico.puml"
          fi
          echo "✅ Diagrama de Base listo."

      - name: Renderizar diagramas a SVG
        run: |
          mkdir -p diagrams-output
          
          # Renderizar y renombrar PR
          if [[ -f "pr_uml/modelo_tecnico.puml" ]]; then
            echo "🎨 Renderizando PR para ${{ matrix.service }}..."
            java -jar plantuml.jar -tsvg -o "$(pwd)/diagrams-output" pr_uml/modelo_tecnico.puml
            if [[ -f "diagrams-output/modelo_tecnico.svg" ]]; then
              mv diagrams-output/modelo_tecnico.svg diagrams-output/${{ matrix.service }}_modelo_tecnico_pr.svg
            fi
            # Guardar puml renombrado para el diff
            cp pr_uml/modelo_tecnico.puml diagrams-output/${{ matrix.service }}_pr.puml
          fi

          # Renderizar y renombrar Base
          if [[ -f "${{ matrix.service }}/target/modelo_tecnico.puml" ]]; then
            echo "🎨 Renderizando Base para ${{ matrix.service }}..."
            java -jar plantuml.jar -tsvg -o "$(pwd)/diagrams-output" ${{ matrix.service }}/target/modelo_tecnico.puml
            if [[ -f "diagrams-output/modelo_tecnico.svg" ]]; then
              mv diagrams-output/modelo_tecnico.svg diagrams-output/${{ matrix.service }}_modelo_tecnico_base.svg
            fi
            # Guardar puml renombrado para el diff
            cp ${{ matrix.service }}/target/modelo_tecnico.puml diagrams-output/${{ matrix.service }}_base.puml
          fi

      - name: Subir artefactos de la matriz
        uses: actions/upload-artifact@v4
        with:
          name: diagramas-servicio-${{ matrix.service }}
          path: diagrams-output/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Job 8: Semantic UML Diff (Architectural Review)
  # ──────────────────────────────────────────────────────────────────────────
  # Compara los diagramas de arquitectura de la rama base contra la rama PR.
  # Publica un diff visual en GitHub y Discord.
  # ──────────────────────────────────────────────────────────────────────────
  semantic-uml-diff:
    needs: [detect-changes, generate-diagrams]
    if: ${{ needs.detect-changes.outputs.any-service == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Descargar diagramas de la matriz
        uses: actions/download-artifact@v4
        with:
          pattern: diagramas-servicio-*
          path: diagramas-temp

      - name: Reubicar archivos PUML
        run: |
          mkdir -p base_uml_dir
          mkdir -p pr_uml_dir
          
          # Buscar archivos PUML y copiarlos a sus respectivas carpetas
          find diagramas-temp -name "*_base.puml" -exec cp {} base_uml_dir/ \;
          find diagramas-temp -name "*_pr.puml" -exec cp {} pr_uml_dir/ \;
          
          # Renombrar para que los archivos a comparar tengan exactamente el mismo nombre (ej: donaciones-service.puml)
          cd base_uml_dir
          for f in *_base.puml; do
            if [[ -f "$f" ]]; then
              mv "$f" "${f%_base.puml}.puml"
            fi
          done
          
          cd ../pr_uml_dir
          for f in *_pr.puml; do
            if [[ -f "$f" ]]; then
              mv "$f" "${f%_pr.puml}.puml"
            fi
          done
          
          echo "📂 Diagramas listos para el diff:"
          echo "  Base:"
          ls -la ../base_uml_dir
          echo "  PR:"
          ls -la .

      - name: Semantic UML Diff
        uses: tsorren/SemanticUMLDiff@main
        with:
          base_uml_dir: ./base_uml_dir
          pr_uml_dir: ./pr_uml_dir
          github_token: ${{ secrets.GITHUB_TOKEN }}
          diagram_spacing: 20
          context_depth: 0
        env:
          PUBLISH_GITHUB: 'true'
          PUBLISH_DISCORD: 'true'
          IMAGE_HOSTING_PROVIDER: 'discord'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SEMANTIC_DIFF_WEBHOOK_URL }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 10: CD - Validación en Pre-Producción (preprod-validation)
  # ──────────────────────────────────────────────────────────────────────────
  # Levanta los tres microservicios con Docker Compose, espera sus healthchecks
  # y ejecuta la suite JUnit + RestAssured del módulo integration-tests.
  # Si un servicio no fue construido en este PR (no hubo cambios), su JAR se
  # compila desde fuentes para garantizar el stack completo.
  # ──────────────────────────────────────────────────────────────────────────
  preprod-validation:
    needs: build-and-test
    if: ${{ needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      EXECUTION_ID: "run_${{ github.run_id }}_${{ github.run_attempt }}"
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Descargar JARs disponibles como artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: temp-jars/
          merge-multiple: false

      - name: Reubicar JARs — compilar desde fuentes si alguno no existe
        run: |
          for svc in donaciones-service notificaciones-service incentivos-service logistica-service; do
            mkdir -p "${svc}/target"
            if [ -d "temp-jars/jar-${svc}" ]; then
              cp "temp-jars/jar-${svc}"/*.jar "${svc}/target/"
              echo "✅ JAR de ${svc} copiado desde artefactos."
            else
              echo "⚠️ JAR de ${svc} no disponible — compilando desde fuentes..."
              mvn clean package -pl "${svc}" -am -DskipTests -Dspotless.check.skip=true -q
            fi
          done

      - name: Provisionar Entorno de Pre-Producción (Docker Compose)
        run: |
          docker compose -f docker-compose.preprod.yml up --build --wait -d
          echo "✅ Contenedores base levantados y healthy."

      - name: Importar y Activar Workflows en n8n
        run: |
          echo "📥 Importando workflows en n8n..."
          docker compose -f docker-compose.preprod.yml exec -T n8n n8n import:workflow --input=/etc/n8n/workflows/WorkFlow-Insignias.JSON || true
          docker compose -f docker-compose.preprod.yml exec -T n8n n8n import:workflow --input=/etc/n8n/workflows/WorkFlow-Ranking-Mensual.JSON || true
          
          echo "🚀 Activando workflows en n8n..."
          docker compose -f docker-compose.preprod.yml exec -T n8n n8n publish:workflow --id=1 || true
          docker compose -f docker-compose.preprod.yml exec -T n8n n8n publish:workflow --id=2 || true
          
          echo "🔄 Reiniciando n8n para registrar webhooks..."
          docker compose -f docker-compose.preprod.yml restart n8n
          
          echo "⏳ Esperando disponibilidad de n8n tras reinicio..."
          attempts=0
          until curl -s -f http://localhost:5678/healthz >/dev/null; do
            attempts=$((attempts+1))
            if [ $attempts -ge 30 ]; then
              echo "❌ Error: n8n no se recuperó tras reinicio."
              exit 1
            fi
            sleep 1
          done
          echo "✅ n8n listo y con workflows activos."

      - name: Esperar endpoints /v3/api-docs disponibles
        run: |
          set -e
          URLs=("http://localhost:8080/v3/api-docs" "http://localhost:8081/v3/api-docs" "http://localhost:8082/v3/api-docs" "http://localhost:8083/v3/api-docs")
          for url in "${URLs[@]}"; do
            echo "Esperando $url..."
            attempt=0
            until curl -s -f "$url" >/dev/null; do
              attempt=$((attempt+1))
              if [ $attempt -ge 60 ]; then
                echo "ERROR: $url no respondió con 200 después de 60 intentos."
                docker compose -f docker-compose.preprod.yml logs --no-color || true
                exit 1
              fi
              sleep 2
            done
            echo "$url disponible"
          done

      - name: 1. Ejecutar Smoke Tests (Fail-Fast)
        run: |
          mvn test -pl integration-tests -DskipTests=false -Dgroups=smoke \
            -Ddonaciones.url=http://localhost:8080 \
            -Dnotificaciones.url=http://localhost:8081 \
            -Dincentivos.url=http://localhost:8082 \
            -Dlogistica.url=http://localhost:8083

      - name: 2. Ejecutar Pruebas de Contrato, Integración y E2E
        run: |
          mvn test -pl integration-tests -DskipTests=false -Dgroups="contract,integration,e2e" \
            -Ddonaciones.url=http://localhost:8080 \
            -Dnotificaciones.url=http://localhost:8081 \
            -Dincentivos.url=http://localhost:8082 \
            -Dlogistica.url=http://localhost:8083

      - name: 3. Ejecutar Pruebas de Rendimiento
        run: |
          mvn test -pl integration-tests -DskipTests=false -Dgroups=performance \
            -Ddonaciones.url=http://localhost:8080 \
            -Dnotificaciones.url=http://localhost:8081 \
            -Dincentivos.url=http://localhost:8082 \
            -Dlogistica.url=http://localhost:8083

      - name: Generar Reporte Detallado de Fallos y Diagnóstico
        if: always()
        run: |
          echo "🔍 Analizando logs de microservicios..."
          python scripts/analyze_preprod_logs.py --run "$EXECUTION_ID" --export-report || true
          echo "📊 Generando reporte detallado de tests..."
          python scripts/report_test_failures.py || true

      - name: Subir Reportes de Surefire (Integration Tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-integration-tests
          path: integration-tests/target/surefire-reports/
          retention-days: 14

      - name: Recolectar Logs de Contenedores y Archivos de Logs
        if: always()
        run: |
          mkdir -p docker-logs
          docker compose -f docker-compose.preprod.yml logs --no-color > docker-logs/preprod-services.log || true
          if [ -d "logs" ]; then
            cp -r logs docker-logs/files || true
          fi

      - name: Archivar Logs de Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-preprod-logs
          path: docker-logs/
          retention-days: 7

      - name: Desmantelar Entorno
        if: always()
        run: |
          docker compose -f docker-compose.preprod.yml down -v

  # ──────────────────────────────────────────────────────────────────────────
  # Job 9: Quality Gate (Consolidador Final)
  # ──────────────────────────────────────────────────────────────────────────
  # Job centinela que depende de todos los demás. Usar como "Required
  # Status Check" en las Branch Protection Rules de GitHub para tener
  # un único check verde/rojo que represente todo el pipeline.
  # ──────────────────────────────────────────────────────────────────────────
  quality-gate:
    needs: [validate-git-flow, detect-changes, lint-and-format, build-and-test, sonar-analysis, docker-build, generate-diagrams, semantic-uml-diff, preprod-validation]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Evaluar resultado del pipeline
        run: |
          echo "══════════════════════════════════════════"
          echo "       QUALITY GATE — RESULTADOS"
          echo "══════════════════════════════════════════"

          FAILED=false

          # ── Evaluar cada job ──
          check_job() {
            local name="$1"
            local result="$2"
            local required="$3"

            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "  ✅ ${name}: ${result}"
            elif [[ "$result" == "skipped" && "$required" == "false" ]]; then
              echo "  ⏭️  ${name}: skipped (opcional)"
            else
              echo "  ❌ ${name}: ${result}"
              if [[ "$required" == "true" ]]; then
                FAILED=true
              fi
            fi
          }

          check_job "validate-git-flow"   "${{ needs.validate-git-flow.result }}"   "true"
          check_job "detect-changes"      "${{ needs.detect-changes.result }}"       "true"
          check_job "lint-and-format"     "${{ needs.lint-and-format.result }}"      "true"
          check_job "build-and-test"      "${{ needs.build-and-test.result }}"       "true"
          check_job "sonar-analysis"      "${{ needs.sonar-analysis.result }}"       "true"
          check_job "docker-build"        "${{ needs.docker-build.result }}"         "true"
          check_job "generate-diagrams"   "${{ needs.generate-diagrams.result }}"    "true"
          check_job "semantic-uml-diff"   "${{ needs.semantic-uml-diff.result }}"    "false"
          check_job "preprod-validation"  "${{ needs.preprod-validation.result }}"  "true"

          echo "══════════════════════════════════════════"

          if [[ "$FAILED" == "true" ]]; then
            echo "::error::❌ Quality Gate FALLIDO — revisar los jobs anteriores."
            exit 1
          else
            echo "✅ Quality Gate APROBADO — todos los checks pasaron."
          fi