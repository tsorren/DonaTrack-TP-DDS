name: Agent Governance Check

# Verifica propiedades mecánicas del harness de agentes (Wave 7A).
# Checks: AGENTS canonicity, evaluator policy presence, stale term detection.
# Sin Docker, sin Maven, sin dependencias externas.
# Ejecución local equivalente: node scripts/agent-check.js

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - 'ENTREGA_*'

# Permite cancelar runs redundantes del mismo ref.
concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-governance:
    name: Governance Checks (Wave 7A)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar tests del tooling
        run: node scripts/tests/run-tests.js

      - name: Ejecutar governance checks
        run: node scripts/agent-check.js

      - name: Validar contratos y schemas OpenAPI
        run: node scripts/validate-contracts.js

  # Tests estáticos de seguridad, realm, compose y CI (SPEC-06). Sin Docker, sin Maven y sin
  # dependencias externas: solo Python (ya instalado en ubuntu-latest) y Node. Antes de esto no
  # corrían en ningún workflow: un PR podía romperlos sin que nada lo avisara.
  tests-estaticos:
    name: Tests estáticos de seguridad (Python y Node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests de scripts, realm, compose, CI y seguridad por servicio (Python)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Tests del token de Postman y k6 (Node)
        run: node scripts/tests/postman-k6-token.test.js
