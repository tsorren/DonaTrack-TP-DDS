# ============================================================================
# DonaTrack — Pipeline de Merge (Publicación de Imágenes Estables)
# ============================================================================
# Disparador: push a main o ENTREGA_* (resultado de un PR mergeado)
#
# Responsabilidad única: compilar TODOS los servicios del monorepo, validar el
# estado integrado en preprod y promover a los tags estables solo lo validado
# (RM-06, ADR 20261020 promoción por digest).
#
# Flujo: docker-publish publica el candidato :sha-<7> → preprod-post-merge corre el
# preprod con esos digests (estricto, también los chequeos de contrato de RM-08) →
# promote re-etiqueta el MISMO digest a :<branch> (y :latest en main) y publica el
# manifiesto de versión (commit → digest por servicio), que consume main.yml.
#
# Corte de entrega (D5 de SPEC-05): workflow_dispatch sobre ENTREGA_x, 24 h antes del
# vencimiento, a cargo del responsable de integración:
#   gh workflow run merge.yml --ref ENTREGA_5
#
# Estrategia de tags publicados por cada servicio:
#   :sha-<7 chars>  → Candidato inmutable, para rollback/trazabilidad (ej: sha-a1b2c3d)
#   :<branch>       → Tag de rama normalizado (ej: entrega_2, main); solo tras el post-merge
#   :latest         → Solo si el push es a 'main' (representa producción); idem
#
# Principios:
#   • Build Once: cada servicio se compila y empaqueta una sola vez en la matriz;
#     la promoción re-etiqueta el digest validado sin reconstruir.
#   • Determinismo: todos los servicios del stack se publican en la misma corrida,
#     garantizando cohesión de contratos entre imágenes de la misma entrega.
#   • Cleanup: los tags efímeros de PR (pr-N) se eliminan de GHCR al finalizar,
#     evitando acumulación de imágenes obsoletas.
#   • No cancelable: un merge build nunca se cancela a mitad; si dos merges
#     ocurren seguidos, el segundo espera al primero (cancel-in-progress: false).
# ============================================================================

name: DonaTrack Merge Pipeline

on:
  push:
    branches:
      - main
      - 'ENTREGA_*'
    # Solo se dispara cuando hay cambios en código fuente, build files o Dockerfiles.
    # Commits de solo documentación (docs/, ADRs, README) no consumen runner ni GHCR.
    # IMPORTANTE: si se agrega un servicio nuevo sin cambiar código fuente, hacer
    # un push vacío (git commit --allow-empty) para forzar la publicación inicial.
    paths:
      - '*/src/**'
      - '*/pom.xml'
      - 'pom.xml'
      - '*/Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
  # Corte de entrega (D5): corrida manual del post-merge sobre la cabeza de ENTREGA_x.
  workflow_dispatch:

# ── Concurrencia ──────────────────────────────────────────────────────────────
# A diferencia del pipeline de PR (cancel-in-progress: true), aquí NO se cancela
# una publicación en curso. Dos merges rápidos se serializan: el segundo espera.
# Esto evita publicar un estado intermedio o dejar imágenes sin el tag estable.
concurrency:
  group: merge-${{ github.ref_name }}
  cancel-in-progress: false

# ============================================================================
# JOBS
# ============================================================================
jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Descubrimiento Dinámico de Servicios
  # ──────────────────────────────────────────────────────────────────────────
  # Mismo patrón de descubrimiento que main.yml: escanea carpetas con pom.xml,
  # excluye módulos no-servicio, y distingue los que tienen Dockerfile.
  # Genera dos matrices: una para build (todos los servicios) y otra para
  # Docker (solo los que tienen Dockerfile).
  # ──────────────────────────────────────────────────────────────────────────
  detect-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      any-service: ${{ steps.discover.outputs.any-service }}
      any-docker-service: ${{ steps.discover.outputs.any-docker-service }}
      services-matrix: ${{ steps.discover.outputs.services-matrix }}
      docker-matrix: ${{ steps.discover.outputs.docker-matrix }}
      # Tag normalizado de la rama para usar como tag Docker estable
      branch-tag: ${{ steps.discover.outputs.branch-tag }}
      # SHA corto para tag inmutable de trazabilidad
      sha-short: ${{ steps.discover.outputs.sha-short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Descubrir servicios y calcular tags
        id: discover
        # S7630: github.ref_name es controlable por el usuario (nombre de rama).
        # Se asigna a variable de entorno para que el shell lo trate como literal.
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          ALL_SERVICES=()
          DOCKER_SERVICES=()

          for pom in */pom.xml; do
            [ -f "$pom" ] || continue
            dir=$(dirname "$pom")
            if [[ "$dir" != "common-lib" && "$dir" != "integration-tests" && "$dir" != "adr-generator" ]]; then
              ALL_SERVICES+=("$dir")
              if [ -f "$dir/Dockerfile" ]; then
                DOCKER_SERVICES+=("$dir")
              fi
            fi
          done

          echo "🔍 Servicios detectados: ${ALL_SERVICES[*]}"
          echo "🐳 Servicios con Dockerfile: ${DOCKER_SERVICES[*]}"

          if [ ${#ALL_SERVICES[@]} -gt 0 ]; then
            echo "any-service=true" >> "$GITHUB_OUTPUT"
            MATRIX_JSON=$(jq -nc --args '$ARGS.positional | map({service: .})' "${ALL_SERVICES[@]}")
            echo "services-matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          else
            echo "any-service=false" >> "$GITHUB_OUTPUT"
            echo 'services-matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          fi

          if [ ${#DOCKER_SERVICES[@]} -gt 0 ]; then
            echo "any-docker-service=true" >> "$GITHUB_OUTPUT"
            DOCKER_JSON=$(jq -nc --args '$ARGS.positional | map({service: .})' "${DOCKER_SERVICES[@]}")
            echo "docker-matrix={\"include\":$DOCKER_JSON}" >> "$GITHUB_OUTPUT"
          else
            echo "any-docker-service=false" >> "$GITHUB_OUTPUT"
            echo 'docker-matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          fi

          # ── Calcular tags Docker ────────────────────────────────────────
          # Tag de rama: normalizar a minúsculas y reemplazar '/' por '-'
          # para cumplir con especificación OCI de nombres de imagen.
          # Ejemplos: ENTREGA_2 → entrega_2 | feature/x → feature-x
          BRANCH_TAG=$(echo "$GH_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          echo "branch-tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

          # SHA corto (7 chars): inmutable, ideal para rollback y trazabilidad
          SHA_SHORT="$GH_SHA"
          echo "sha-short=${SHA_SHORT:0:7}" >> "$GITHUB_OUTPUT"

          echo "🏷️  Branch tag: ${BRANCH_TAG}"
          echo "🔑 SHA short: ${SHA_SHORT:0:7}"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Compilación y Verificación (Matriz por Servicio)
  # ──────────────────────────────────────────────────────────────────────────
  # Compila TODOS los servicios desde el estado mergeado, no desde artefactos
  # del PR (que ya expiraron o pueden ser de otra corrida). Esto garantiza que
  # las imágenes publicadas corresponden exactamente al estado integrado en la rama.
  #
  # Se ejecuta mvn verify (incluye tests unitarios) para detectar regresiones
  # introducidas por el merge. Si un merge rompe tests, las imágenes no se publican.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-verify:
    needs: detect-services
    if: ${{ needs.detect-services.outputs.any-service == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-services.outputs.services-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: "Compilar, testear y empaquetar: ${{ matrix.service }}"
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          echo "🔨 Compilando $SERVICE desde estado mergeado..."
          mvn -B clean verify \
            -pl "$SERVICE" -am \
            -Dspotless.check.skip=true

      - name: Subir JAR compilado
        # Solo sube si la compilación fue exitosa; error si no hay JAR (aborta docker-publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-jar-${{ matrix.service }}
          # Sube todos los JARs; docker-publish seleccionará el ejecutable con find
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 1
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Construcción y Publicación de Imágenes Estables (Matriz Docker)
  # ──────────────────────────────────────────────────────────────────────────
  # "Build Once, Tag Many": construye la imagen UNA vez y la publica con
  # múltiples tags en un solo push usando docker/build-push-action con
  # la opción `tags` multilínea.
  #
  # Tag publicado: solo :sha-<7>, el candidato inmutable. :<branch> y :latest los
  # asigna promote después del preprod post-merge (RM-06). El digest de cada
  # servicio se guarda como artefacto para armar el manifiesto candidato.
  # ──────────────────────────────────────────────────────────────────────────
  docker-publish:
    needs: [detect-services, build-and-verify]
    if: ${{ needs.build-and-verify.result == 'success' && needs.detect-services.outputs.any-docker-service == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      # fail-fast: false permite que los servicios restantes se publiquen aunque
      # uno falle, maximizando la disponibilidad de imágenes estables.
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-services.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Descargar JAR compilado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Calcular tags y seleccionar JAR ejecutable
        id: meta
        env:
          SERVICE: ${{ matrix.service }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          BRANCH_TAG: ${{ needs.detect-services.outputs.branch-tag }}
          SHA_SHORT: ${{ needs.detect-services.outputs.sha-short }}
        run: |
          # Selección determinista del fat JAR (mismo criterio que main.yml FIX-4)
          JAR_PATH=$(find "$SERVICE/target" \
            -maxdepth 1 \
            -name "*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "*.original" \
            ! -name "*plain.jar" \
            | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "::error::No se encontró JAR ejecutable en $SERVICE/target/"
            exit 1
          fi
          echo "📦 JAR seleccionado: $JAR_PATH"
          echo "jar_file=$JAR_PATH" >> "$GITHUB_OUTPUT"

          # Base de la imagen en minúsculas (requisito OCI)
          REPO_LOWER=$(echo "$GH_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_LOWER}/${SERVICE}"

          # RM-06: solo el candidato inmutable; promote asigna :<branch> y :latest.
          TAGS="${IMAGE_BASE}:sha-${SHA_SHORT}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "🏷️  Candidato a publicar: ${TAGS}"

      - name: "Construir y publicar candidato: ${{ matrix.service }}"
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          target: ci
          build-args: |
            JAR_FILE=${{ steps.meta.outputs.jar_file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Caché GHA con scope por servicio (compartido con el pipeline de PR
          # para acelerar builds posteriores)
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true

      - name: Guardar el digest del candidato
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${SERVICE}.digest"
          echo "🔑 ${SERVICE}: ${DIGEST}"

      - name: Subir el digest del candidato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/
          retention-days: 1
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Preprod post-merge sobre los digests candidatos (RM-06)
  # ──────────────────────────────────────────────────────────────────────────
  # Mismo punto de entrada que el PR (run-preprod-tests.sh --images ghcr), con
  # todas las imágenes fijadas por digest desde el manifiesto candidato. Es
  # estricto: los chequeos nuevos de contratos (RM-08) fallan acá (D5).
  # ──────────────────────────────────────────────────────────────────────────
  preprod-post-merge:
    needs: [detect-services, docker-publish]
    if: ${{ needs.docker-publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXECUTION_ID: "postmerge_${{ github.run_id }}_${{ github.run_attempt }}"
      PREPROD_STRICT: "true"
      CONTRATOS_ESTRICTO: "true"
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historia completa: el diff de contratos compara con el commit anterior o con main
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar los digests candidatos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Armar el manifiesto candidato
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPO_LOWER=$(echo "$GH_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          python scripts/manifiesto_version.py generar --rama "$GH_REF_NAME" --commit "$GH_SHA" \
            --corrida "$RUN_ID" --registro "ghcr.io/${REPO_LOWER}" --digests digests -o manifiesto-version.json
          cat manifiesto-version.json

      - name: Validación pre-producción post-merge (estricta)
        run: MANIFIESTO=manifiesto-version.json ./run-preprod-tests.sh --images ghcr

      # D5: un cambio incompatible de OpenAPI falla acá. En un push se compara con la cabeza
      # anterior de la rama (lo que integró este merge); en el corte (workflow_dispatch),
      # con main, la última entrega presentada.
      - name: Cambios incompatibles en las specs OpenAPI (D5, error)
        if: ${{ success() || failure() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then BASE=origin/main; else BASE="$BEFORE"; fi
          scripts/diff-contratos.sh "$BASE" error

      - name: Subir el manifiesto candidato validado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifiesto-candidato
          path: manifiesto-version.json
          retention-days: 1

      - name: Subir reportes y logs del post-merge
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preprod-post-merge
          path: |
            integration-tests/target/failsafe-reports/
            logs/registro/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Promoción por digest (RM-06)
  # ──────────────────────────────────────────────────────────────────────────
  # Re-etiqueta el digest validado a :<branch> (y :latest en main) sin
  # reconstruir, verifica que el tag apunte a ese digest y publica el
  # manifiesto de versión. Si el post-merge falló, no corre: :<branch> sigue
  # apuntando a la última versión validada.
  # ──────────────────────────────────────────────────────────────────────────
  promote:
    needs: [detect-services, preprod-post-merge]
    if: ${{ needs.preprod-post-merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Descargar el manifiesto candidato validado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manifiesto-candidato

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Re-etiquetar el digest validado
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          BRANCH_TAG: ${{ needs.detect-services.outputs.branch-tag }}
        run: |
          python scripts/manifiesto_version.py leer manifiesto-version.json | while read -r svc ref; do
            image="${ref%@*}"
            digest="${ref#*@}"
            tags=(-t "${image}:${BRANCH_TAG}")
            [[ "$GH_REF_NAME" == "main" ]] && tags+=(-t "${image}:latest")
            docker buildx imagetools create "${tags[@]}" "$ref"
            # Criterio 1 de RM-06: el tag promovido apunta al digest validado.
            promoted=$(docker buildx imagetools inspect "${image}:${BRANCH_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')
            if [[ "$promoted" != "$digest" ]]; then
              echo "::error::${svc}: ${image}:${BRANCH_TAG} apunta a ${promoted}, se esperaba ${digest}."
              exit 1
            fi
            echo "✅ ${svc}: :${BRANCH_TAG} → ${digest}"
          done

      - name: Publicar el manifiesto de versión
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifiesto-version
          path: manifiesto-version.json
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: Limpieza de Tags Efímeros de PR
  # ──────────────────────────────────────────────────────────────────────────
  # Los tags pr-N publicados por docker-build en el pipeline de PR son
  # temporales. Una vez mergeado el PR, su imagen ya no es necesaria y ocupa
  # cuota de almacenamiento en GHCR (límite: cuota compartida en repos privados).
  #
  # PREREQUISITOS Y LIMITACIONES DE PERMISOS:
  #   - secrets.GITHUB_TOKEN NO puede borrar versiones de paquetes GHCR.
  #     La API de GitHub exige un token con scope 'delete:packages':
  #       · PAT Classic con delete:packages, ó
  #       · GitHub App con permiso de administración de paquetes.
  #     Configurar el secreto 'PACKAGES_CLEANUP_PAT' en el repositorio.
  #     Si no existe, el job continúa con GITHUB_TOKEN pero las llamadas
  #     DELETE devolverán 403 y el log registrará el aviso sin fallar el pipeline.
  #
  # RUTAS DE API GHCR:
  #   - Cuenta personal (este repo): /users/{owner}/packages/container/{pkg}/versions
  #   El nombre del paquete contiene '/' (repo/servicio) → se codifica como '%2F'
  #   en la URL para no partir el path REST.
  #
  # TIPOS DE MERGE SOPORTADOS:
  #   - Merge commit estándar: "Merge pull request #N from ..."  ← detectado
  #   - Squash merge / Rebase merge: sin número de PR en el mensaje
  #     → el job omite la limpieza sin error (has-pr=false)
  # ──────────────────────────────────────────────────────────────────────────
  cleanup-pr-tags:
    needs: [ detect-services, docker-publish ]
    if: ${{ always() && needs.detect-services.outputs.any-docker-service == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extraer número de PR del mensaje de commit de merge
        id: extract-pr
        # FIX S7630: Se asigna a env para evitar script injection
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          COMMIT_MSG="$RAW_COMMIT_MSG"
          echo "📝 Commit message: ${COMMIT_MSG%%$'\n'*}"
          
          if [[ "$COMMIT_MSG" =~ Merge\ pull\ request\ \#([0-9]+) ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
            echo "🔍 PR detectado: #${PR_NUMBER}"
            echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "has-pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  No se detectó número de PR (squash/rebase merge o push directo). Omitiendo limpieza."
            echo "has-pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Eliminar tags pr-N de GHCR
        if: ${{ steps.extract-pr.outputs.has-pr == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_CLEANUP_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.extract-pr.outputs.pr-number }}
          RAW_OWNER: ${{ github.repository_owner }}
          RAW_REPO: ${{ github.event.repository.name }}
        run: |
          REPO_OWNER=$(echo "$RAW_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]')
          PR_TAG="pr-${PR_NUMBER}"
          
          OWNER_TYPE=$(gh api "users/${REPO_OWNER}" --jq '.type' 2>/dev/null || echo "User")
          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_BASE="orgs/${REPO_OWNER}"
          else
            API_BASE="users/${REPO_OWNER}"
          fi
          echo "🧹 Eliminando tags '${PR_TAG}' de GHCR [${API_BASE}] (${OWNER_TYPE})..."
          
          for pom in */pom.xml; do
            [ -f "$pom" ] || continue
            dir=$(dirname "$pom")
            [[ "$dir" == "common-lib" || "$dir" == "integration-tests" || "$dir" == "adr-generator" ]] && continue
            [ -f "$dir/Dockerfile" ] || continue
          
            PACKAGE_SLUG="${REPO_NAME}%2F${dir}"
            API_PATH="${API_BASE}/packages/container/${PACKAGE_SLUG}/versions"
          
            echo "  🗑️  Buscando tag '${PR_TAG}' en ${REPO_OWNER}/${REPO_NAME}/${dir}..."
          
            VERSION_ID=$(gh api "${API_PATH}" \
              --jq ".[] | select(.metadata.container.tags[] == \"${PR_TAG}\") | .id" \
              2>/dev/null || echo "")
          
            if [ -n "$VERSION_ID" ]; then
              if gh api --method DELETE "${API_PATH%/versions}/${VERSION_ID}" 2>/dev/null; then
                echo "  ✅ Tag '${PR_TAG}' eliminado de ${dir} (version_id=${VERSION_ID})"
              else
                echo "  ⚠️  No se pudo eliminar '${PR_TAG}' de ${dir}."
                echo "     Verificar que PACKAGES_CLEANUP_PAT tiene scope 'delete:packages'."
              fi
            else
              echo "  ℹ️  Tag '${PR_TAG}' no encontrado en ${dir} (ya eliminado o no existía)"
            fi
          done
          
          echo "✅ Limpieza de tags efímeros completada."

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: Resumen del Pipeline de Merge
  # ──────────────────────────────────────────────────────────────────────────
  # Produce un resumen legible del estado de publicación para el historial
  # de GitHub Actions. Útil para auditoría y diagnóstico rápido.
  # ──────────────────────────────────────────────────────────────────────────
  merge-summary:
    needs: [ detect-services, build-and-verify, docker-publish, preprod-post-merge, promote, cleanup-pr-tags ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generar resumen del pipeline de merge
        env:
          REF_NAME: ${{ github.ref_name }}
          BRANCH_TAG: ${{ needs.detect-services.outputs.branch-tag }}
          SHA_SHORT: ${{ needs.detect-services.outputs.sha-short }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RES_DETECT: ${{ needs.detect-services.result }}
          RES_BUILD: ${{ needs.build-and-verify.result }}
          RES_DOCKER: ${{ needs.docker-publish.result }}
          RES_POSTMERGE: ${{ needs.preprod-post-merge.result }}
          RES_PROMOTE: ${{ needs.promote.result }}
          RES_CLEANUP: ${{ needs.cleanup-pr-tags.result }}
        run: |
          {
            echo "## 🚀 Merge Pipeline — Resumen"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| **Rama** | \`$REF_NAME\` |"
            echo "| **Branch tag** | \`$BRANCH_TAG\` |"
            echo "| **SHA tag** | \`sha-$SHA_SHORT\` |"
            echo "| **Commit** | \`$COMMIT_SHA\` |"
            echo "| **Actor** | @$ACTOR |"
            echo ""
            echo "### Estado de Jobs"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| detect-services | $RES_DETECT |"
            echo "| build-and-verify | $RES_BUILD |"
            echo "| docker-publish | $RES_DOCKER |"
            echo "| preprod-post-merge | $RES_POSTMERGE |"
            echo "| promote | $RES_PROMOTE |"
            echo "| cleanup-pr-tags | $RES_CLEANUP |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          
          if [[ "$RES_PROMOTE" == "success" ]]; then
            echo "✅ **Candidato validado y promovido.** \`:$BRANCH_TAG\` apunta a los digests de \`sha-$SHA_SHORT\`; el manifiesto de versión quedó como artefacto." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RES_POSTMERGE" == "failure" ]]; then
            echo "❌ **El preprod post-merge falló: no se promovió.** \`:$BRANCH_TAG\` sigue en la última versión validada; hay que arreglar la rama hacia adelante." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RES_DOCKER" == "failure" ]]; then
            echo "❌ **Fallo en la publicación del candidato.** No hubo post-merge ni promoción." >> "$GITHUB_STEP_SUMMARY"
          fi
          # La corrida falla si el candidato no llegó a promoverse.
          [[ "$RES_DOCKER" != "failure" && "$RES_POSTMERGE" != "failure" && "$RES_PROMOTE" != "failure" ]]