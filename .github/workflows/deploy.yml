# ============================================================================
# DonaTrack — Despliegue reproducible del manifiesto de versión (RM-07)
# ============================================================================
# D3 de SPEC-05: el despliegue no depende de Render. El ensayo levanta, en el
# runner, el stack de preprod con los digests del manifiesto M (el que publicó
# promote en merge.yml), corre el smoke, despliega M-1 encima y repite el smoke:
# el rollback queda ensayado en cada corrida.
#
# Disparadores:
#   • Después de cada corrida exitosa de merge.yml (manifiesto recién promovido).
#   • A mano, con la corrida de merge.yml cuyo manifiesto se quiere desplegar:
#       gh workflow run deploy.yml --ref ENTREGA_5 -f corrida=<run-id>
#
# Render es un adaptador opcional: solo en la corrida manual, y solo si existe el
# secreto RENDER_DEPLOY_HOOK_LOGISTICA; si no existe, avisa y no falla. El
# despliegue automático a Render se descartó (ADR 20261020, 2B: pausa entre
# defensas y horas del plan gratuito).
# ============================================================================

name: DonaTrack Deploy

on:
  workflow_run:
    workflows: ["DonaTrack Merge Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      corrida:
        description: "Run id de merge.yml con el manifiesto M (vacío: el último promovido de la rama)"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Ensayo del despliegue de M y del rollback a M-1
  # ──────────────────────────────────────────────────────────────────────────
  ensayo:
    # workflow_run: solo una corrida exitosa de merge.yml por push en este mismo repo (nunca un fork)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      logistica-ref: ${{ steps.manifiestos.outputs.logistica-ref }}
    steps:
      # Sin ref: se usa el código del ref del workflow (main en la corrida automática, el ref
      # elegido en la manual), nunca el del evento que lo disparó (githubactions:S7631).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener los manifiestos M y M-1
        id: manifiestos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAMA: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CORRIDA: ${{ inputs.corrida }}
        run: |
          # Corridas de merge.yml de la rama con manifiesto vigente, de la más nueva a la más vieja;
          # solo del propio repo (un PR desde un fork no puede inyectar un manifiesto)
          mapfile -t RUNS < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=manifiesto-version&per_page=100" \
            --jq ".artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"${RAMA}\") | select(.workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id")
          if [[ ${#RUNS[@]} -eq 0 ]]; then
            echo "::error::La rama ${RAMA} no tiene manifiestos promovidos (merge.yml, job promote)."
            exit 1
          fi
          i=0
          if [[ -n "$CORRIDA" ]]; then
            while [[ $i -lt ${#RUNS[@]} && "${RUNS[$i]}" != "$CORRIDA" ]]; do i=$((i + 1)); done
            if [[ $i -ge ${#RUNS[@]} ]]; then
              echo "::error::La corrida ${CORRIDA} no tiene un manifiesto vigente en ${RAMA}."
              exit 1
            fi
          fi
          gh run download "${RUNS[$i]}" -n manifiesto-version -D m
          echo "M = corrida ${RUNS[$i]}"
          if [[ $((i + 1)) -lt ${#RUNS[@]} ]]; then
            gh run download "${RUNS[$((i + 1))]}" -n manifiesto-version -D m-1
            echo "M-1 = corrida ${RUNS[$((i + 1))]}"
          fi
          echo "logistica-ref=$(python scripts/manifiesto_version.py leer m/manifiesto-version.json --servicio logistica-service)" >> "$GITHUB_OUTPUT"

      - name: Desplegar M, smoke, rollback a M-1 y smoke
        run: |
          ANTERIOR=""
          [[ -f m-1/manifiesto-version.json ]] && ANTERIOR=m-1/manifiesto-version.json
          scripts/ensayo-despliegue.sh m/manifiesto-version.json $ANTERIOR

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Despliegue reproducible (RM-07)"
            echo ""
            echo '```json'
            cat m/manifiesto-version.json 2>/dev/null || echo "(sin manifiesto M)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Render (opcional, solo a mano)
  # ──────────────────────────────────────────────────────────────────────────
  # Lee RENDER_DEPLOY_HOOK_LOGISTICA como secreto del repositorio. Si se guarda en
  # un Environment (p. ej. "produccion" con revisores), sumar environment: a este job.
  render:
    needs: ensayo
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Deploy hook de Render con el digest de Logística
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_LOGISTICA }}
          LOGISTICA_REF: ${{ needs.ensayo.outputs.logistica-ref }}
        run: |
          if [[ -z "$RENDER_HOOK" ]]; then
            echo "::warning::No existe el secreto RENDER_DEPLOY_HOOK_LOGISTICA: se omite el despliegue en Render (D3, opcional)."
            exit 0
          fi
          # El deploy hook acepta imgURL con digest (Render: deploying an image).
          curl --proto '=https' --proto-redir =https -fsS -G --data-urlencode "imgURL=${LOGISTICA_REF}" "$RENDER_HOOK" -o /dev/null
          echo "✅ Render recibió ${LOGISTICA_REF}"
