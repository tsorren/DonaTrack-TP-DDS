# PERFIL MONGODB (Producción / Preprod / Docker)
# Desactivar autoconfiguración de base de datos relacional (JPA/JDBC/Flyway)
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# Conexión MongoDB (Spring Boot 4: prefijo spring.mongodb)
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/logistica}
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=true
