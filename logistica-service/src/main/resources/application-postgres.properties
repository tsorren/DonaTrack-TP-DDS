# PERFIL POSTGRESQL (Producción / Preprod / Docker)
# Reactivar autoconfiguración de base de datos relacional
spring.autoconfigure.exclude=

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donatrack?currentSchema=logistica}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:logistica_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:logi_pass_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimizado para instancias con recursos limitados)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=logistica
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.schemas=logistica
spring.flyway.default-schema=logistica
spring.flyway.locations=classpath:db/migration