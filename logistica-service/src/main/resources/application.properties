server.port=${PORT:8083}
spring.application.name=logistica-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI
donatrack.openapi.title=DonaTrack - Servicio de Logistica
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar camiones, rutas, entregas y callback del planificador externo.
donatrack.openapi.server-url=${DONATRACK_OPENAPI_SERVER_URL:http://localhost:8083}
donatrack.openapi.server-description=Servicio de Logistica local

# Proveedor externo de planificacion de rutas
logistica.tracking.base-url=${LOGISTICA_TRACKING_BASE_URL:http://localhost:3000/seguimiento}
logistica.planificacion.max-donaciones-por-lote=${LOGISTICA_MAX_DONACIONES_POR_LOTE:100}
logistica.planificacion.cron.expression=${LOGISTICA_PLANIFICACION_CRON:0 0 2 * * ?}
# Disparador auxiliar para pruebas/demos; deshabilitado por defecto.
logistica.planificacion.manual-enabled=${LOGISTICA_PLANIFICACION_MANUAL_ENABLED:false}
logistica.self.base-url=${LOGISTICA_SELF_BASE_URL:http://localhost:8083}

# Selector de motor de persistencia: "postgres" | "mongo" | vacio (en memoria)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:${LOGISTICA_PERSISTENCIA_MOTOR:}}

# Desactivar autoconfiguración de BD relacional y MongoDB en perfil default (en memoria)
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration

# Identidad de esta instancia ante el broker de donaciones: define su cola y la routing key de los
# pedidos que recibe (entrega.solicitada.<instancia-id>.v1)
logistica.instancia-id=${LOGISTICA_INSTANCIA_ID:donatrack}
# Token con el que esta instancia se identifica ante Donaciones al publicar eventos de vuelta
# (header X-Proveedor-Token). Obligatorio: vacío, la aplicación no arranca (Donaciones descartaría
# sus eventos)
logistica.token-vuelta=${LOGISTICA_TOKEN_VUELTA:}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASS}

# Fotos de recepción (ADR-E6-08, HB-10): multipart a Logística, que valida, quita el EXIF y guarda en
# MinIO. 5 MB por foto; el pedido admite varias.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
# Base de la URL estable de cada foto (GET /api/entregas/{id}/fotos/{fotoId}): el origen público
# del gateway, que es por donde la pide el navegador
logistica.fotos.url-publica-base=${LOGISTICA_FOTOS_URL_PUBLICA_BASE:http://localhost:8086}
# MinIO apagado por defecto: en memoria y en los tests las fotos quedan en un almacén en memoria
logistica.minio.enabled=${LOGISTICA_MINIO_ENABLED:false}
logistica.minio.endpoint=${LOGISTICA_MINIO_ENDPOINT:http://localhost:9000}
# Host con el que se firman las URLs: el que ve el navegador (la firma incluye el host)
logistica.minio.public-endpoint=${LOGISTICA_MINIO_PUBLIC_ENDPOINT:${logistica.minio.endpoint}}
logistica.minio.access-key=${LOGISTICA_MINIO_ACCESS_KEY:}
logistica.minio.secret-key=${LOGISTICA_MINIO_SECRET_KEY:}

# Resource server (SPEC-06 E2-01): apagado por defecto. El issuer y las claves de Keycloak llegan por
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI y _JWK_SET_URI: no definirlas acá, con valor vacío
# Spring igual intenta armar el decoder y falla
donatrack.seguridad.habilitada=${LOGISTICA_SEGURIDAD_HABILITADA:false}
spring.security.oauth2.resourceserver.jwt.audiences=${LOGISTICA_JWT_AUDIENCIA:donatrack-api}
