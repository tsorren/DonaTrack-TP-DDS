server.port=${PORT:8083}
spring.application.name=logistica-service
spring.threads.virtual.enabled=true

# Management endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI
# TODO: ajustar server-url cuando se despliegue en Docker/preprod.
donatrack.openapi.title=DonaTrack - Servicio de Logistica
donatrack.openapi.version=v1
donatrack.openapi.description=API REST para gestionar camiones, rutas, entregas y callback del planificador externo.
donatrack.openapi.server-url=http://localhost:8083
donatrack.openapi.server-description=Servicio de Logistica local

# Proveedor externo de planificacion de rutas
logistica.ruteador.url=${RUTEADOR_EXTERNO_URL:http://localhost:8090}
logistica.tracking.base-url=${LOGISTICA_TRACKING_BASE_URL:http://localhost:3000/seguimiento}
logistica.planificacion.max-donaciones-por-lote=${LOGISTICA_MAX_DONACIONES_POR_LOTE:100}
logistica.planificacion.cron.expression=${LOGISTICA_PLANIFICACION_CRON:0 0 2 * * ?}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASS:donatrack}
