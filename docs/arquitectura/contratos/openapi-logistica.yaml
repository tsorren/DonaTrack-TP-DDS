openapi: 3.0.3
info:
  title: DonaTrack - Logística Service API
  version: 1.10.0
  description: API REST para planificación de rutas de transporte, seguimiento por paradas planificadas, asignación de choferes, mapa público de donaciones entregadas y trazabilidad de entregas.
servers:
  - url: http://localhost:8083
    description: Servidor local de desarrollo
paths:
  /api/entregas:
    post:
      summary: Crear y registrar entrega para planificación
      operationId: crearEntrega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearEntregaRequestDTO'
      responses:
        '201':
          description: Entrega creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaResponseDTO'
        '400':
          description: Datos inválidos
        '409':
          description: Ya existe una entrega registrada para la donación indicada
    get:
      summary: Listar entregas registradas
      operationId: listarEntregas
      responses:
        '200':
          description: Listado de entregas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntregaResponseDTO'
  /api/entregas/mapa:
    get:
      summary: Listar donaciones entregadas con coordenadas válidas para el mapa público (RF-02)
      description: >-
        Retorna únicamente entregas en estado ENTREGADA cuyo destino posee coordenadas geográficas
        válidas, mediante una proyección sanitizada sin datos personales, sin
        calle/altura/piso/departamento/código postal y sin fotos de recepción. Desde 1.10.0
        (R11-19) devuelve solo las de un período (por la hora de arribo, en hora de Argentina), de
        la más reciente a la más vieja (a igual hora, por `idEntrega`) y con tope; el total del
        período, sin el tope, va en `X-Total-Count`. Sin parámetros, los últimos 30 días y hasta
        200 (antes, toda la historia). El período, el orden y el tope se resuelven en la base.
      operationId: listarMapaPublico
      parameters:
        - name: desde
          in: query
          required: false
          description: Primer día del período, inclusive. Si falta, `hasta` menos 30 días.
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          description: Último día del período, inclusive. Si falta, hoy (en hora de Argentina).
          schema:
            type: string
            format: date
        - name: limite
          in: query
          required: false
          description: Cuántas entregas como máximo. Si falta, 200.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Listado sanitizado de entregas completadas geolocalizadas del período, con el tope
          headers:
            X-Total-Count:
              description: Cantidad de entregas del período con coordenadas, sin contar el tope.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntregaMapaPublicoResponseDTO'
        '400':
          description: '`hasta` anterior a `desde`, una fecha que no se entiende o `limite` fuera de 1..500 (ERR-CSR-003)'
  /api/entregas/seguimiento/donaciones/{idDonacion}:
    get:
      summary: Consultar seguimiento de traslado por ID de donación para el donante (RF-09)
      description: Retorna el estado actual de la entrega y el progreso de su ruta planificada sin requerir GPS en tiempo real ni exponer datos privados de otras entregas.
      operationId: obtenerSeguimientoPorDonacion
      parameters:
        - name: idDonacion
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado y progreso de seguimiento de la entrega asociada a la donación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeguimientoEntregaResponseDTO'
        '404':
          description: >-
            La donación no tiene una entrega activa: nunca tuvo entrega o solo tiene entregas
            CANCELADA (HB-19)
  /api/entregas/seguimiento/beneficiarios/{idBeneficiaria}:
    get:
      summary: Listar seguimiento de entregas por ID de beneficiario (RF-14)
      description: Retorna las entregas asociadas al beneficiario con el estado y progreso de sus rutas planificadas sin requerir GPS en tiempo real ni exponer datos privados de terceros.
      operationId: listarSeguimientoPorBeneficiaria
      parameters:
        - name: idBeneficiaria
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listado de seguimientos de entregas del beneficiario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeguimientoEntregaResponseDTO'
  /api/entregas/seguimiento/donantes/{donanteId}:
    get:
      summary: Listar seguimiento de las entregas activas de un donante (RF-09, HB-16)
      description: Retorna las entregas pendientes o en traslado del donante, con el mismo DTO que el seguimiento por beneficiario. Las entregas creadas sin donanteId no aparecen. Sin autenticación el donante llega por parámetro; con HB-13 se filtrará por la persona del token.
      operationId: listarSeguimientoPorDonante
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listado de seguimientos de las entregas activas del donante (vacío si no tiene)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeguimientoEntregaResponseDTO'
  /api/entregas/{id}:
    get:
      summary: Consultar entrega por ID
      operationId: obtenerEntregaPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la entrega
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaResponseDTO'
        '404':
          description: Entrega no encontrada
  /api/entregas/{id}/estado:
    patch:
      summary: Cambiar estado de una entrega
      description: >-
        Transiciona el estado de la entrega. Para pasar a ENTREGADA (RF-12) es obligatorio enviar al
        menos una referencia fotográfica válida en fotosRecepcion (o fotoRecepcionUrl por
        compatibilidad). EN_PUERTA (HB-22, desde 1.9.0) la informa quien mueve el camión al llegar
        al destino: solo desde EN_TRASLADO, idempotente si ya está en la puerta, y publica
        entrega.en-puerta. ENTREGADA y NO_RECIBIDA se aceptan desde EN_TRASLADO o EN_PUERTA.
      operationId: cambiarEstadoEntrega
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoEntregaRequestDTO'
      responses:
        '200':
          description: Estado de la entrega actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaResponseDTO'
        '400':
          description: Transición de estado inválida o evidencia fotográfica ausente
        '404':
          description: Entrega no encontrada
  /api/entregas/{id}/fotos:
    patch:
      summary: Adjuntar fotos adicionales de recepción de entrega
      operationId: adjuntarFotoRecepcion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjuntarFotoRecepcionRequestDTO'
      responses:
        '200':
          description: Fotos adjuntadas exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaResponseDTO'
        '400':
          description: Referencias inválidas o entrega fuera de estado ENTREGADA
        '404':
          description: Entrega no encontrada
    post:
      summary: Subir fotos de recepción (multipart a MinIO, sin metadatos)
      description: >-
        HB-10, ADR-E6-08. Cada parte `foto` es un JPEG o un PNG de hasta 5 MB y 24 megapíxeles; el
        tipo se valida por magic bytes, no por la extensión ni el Content-Type. Logística re-codifica
        la imagen (quita EXIF, GPS y XMP) y la guarda en un bucket privado. Valida todas las fotos
        antes de guardar la primera. No modifica la entrega: la entidad confirma después con
        `PATCH /api/entregas/{id}/estado` (`ENTREGADA`) y las URLs devueltas en `fotosRecepcion`.
      operationId: subirFotosRecepcion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - foto
              properties:
                foto:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Fotos guardadas, una entrada por foto en el orden recibido
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FotoRecepcionSubidaDTO'
        '400':
          description: Sin partes `foto`, una parte vacía o una imagen que no se puede decodificar
        '404':
          description: Entrega no encontrada
        '409':
          description: La entrega ya está ENTREGADA
        '413':
          description: Una foto supera los 5 MB (o el pedido, los 25 MB) o los 24 megapíxeles
        '415':
          description: Una foto no es JPEG ni PNG
  /api/entregas/{id}/fotos/{fotoId}:
    get:
      summary: Leer una foto de recepción (redirige a una URL firmada)
      description: >-
        URL estable de la foto (ADR-E6-08, RNF-PRIV-03). Responde 302 hacia una URL firmada de
        MinIO que vence a los 5 minutos. Es la URL que devuelve la subida y la que viaja en
        `entrega.exitosa`.
      operationId: leerFotoRecepcion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fotoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '302':
          description: Redirección a la URL firmada de la foto
          headers:
            Location:
              description: URL firmada de lectura, válida 5 minutos
              schema:
                type: string
                format: uri
        '404':
          description: No hay una foto con ese id en esa entrega
  /api/entregas/{id}/historial:
    get:
      summary: Consultar historial de cambios de estado de una entrega
      operationId: obtenerHistorialEntrega
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historial de transiciones de la entrega
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CambioEstadoEntregaResponseDTO'
        '404':
          description: Entrega no encontrada
  /api/rutas:
    get:
      summary: Listar rutas planificadas
      operationId: listarRutas
      parameters:
        - name: camionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtro opcional por ID de camión
      responses:
        '200':
          description: Listado de rutas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RutaResponseDTO'
  /api/rutas/{id}:
    get:
      summary: Consultar ruta con sus paradas y URL de seguimiento
      operationId: obtenerRutaPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la ruta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponseDTO'
        '404':
          description: Ruta no encontrada
  /api/rutas/{id}/entregas:
    get:
      summary: Consultar ruta junto con el detalle de sus entregas en orden de visita
      operationId: obtenerRutaConEntregas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ruta con entregas asociadas en orden planificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaConEntregasResponseDTO'
        '404':
          description: Ruta no encontrada
    post:
      summary: Agregar entrega a una ruta existente
      operationId: agregarEntregaRuta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarEntregaRutaRequestDTO'
      responses:
        '201':
          description: Entrega agregada a la ruta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponseDTO'
        '400':
          description: Solicitud inválida
        '404':
          description: Ruta o entrega no encontrada
  /api/rutas/{id}/estado:
    patch:
      summary: Cambiar estado de la ruta
      operationId: cambiarEstadoRuta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoRutaRequestDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponseDTO'
        '400':
          description: Transición de estado inválida
        '404':
          description: Ruta no encontrada
  /api/camiones:
    post:
      summary: Registrar nuevo camión en la flota
      operationId: registrarCamion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CamionRequestDTO'
      responses:
        '201':
          description: Camión registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamionResponseDTO'
        '400':
          description: Datos inválidos
    get:
      summary: Listar camiones
      description: >-
        Sin incluirDeshabilitados, o en false, sin los DESHABILITADO (como siempre). Con
        incluirDeshabilitados=true, todos los camiones (HB-23).
      operationId: listarCamiones
      parameters:
        - name: incluirDeshabilitados
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Listado de camiones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CamionResponseDTO'
  /api/camiones/{id}:
    get:
      summary: Consultar camión por ID
      operationId: obtenerCamionPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del camión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamionResponseDTO'
        '404':
          description: Camión no encontrado
    delete:
      summary: Dar de baja camión de la flota
      operationId: darDeBajaCamion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Camión dado de baja exitosamente
        '404':
          description: Camión no encontrado
  /api/camiones/{id}/estado:
    patch:
      summary: Cambiar estado operativo de un camión
      operationId: cambiarEstadoCamion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoCamionRequestDTO'
      responses:
        '200':
          description: Estado del camión actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CamionResponseDTO'
        '400':
          description: Transición de estado inválida
        '404':
          description: Camión no encontrado
  /api/choferes:
    post:
      summary: Registrar chofer
      operationId: registrarChofer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoferRequestDTO'
      responses:
        '201':
          description: Chofer registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoferResponseDTO'
        '400':
          description: Datos inválidos
    get:
      summary: Listar choferes
      operationId: listarChoferes
      responses:
        '200':
          description: Listado de choferes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChoferResponseDTO'
  /api/choferes/{id}:
    get:
      summary: Consultar chofer por ID
      operationId: obtenerChoferPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del chofer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoferResponseDTO'
        '404':
          description: Chofer no encontrado
    delete:
      summary: Dar de baja chofer
      operationId: darDeBajaChofer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Chofer dado de baja exitosamente
        '404':
          description: Chofer no encontrado
  /api/choferes/{id}/estado:
    patch:
      summary: Cambiar estado de un chofer
      operationId: cambiarEstadoChofer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoChoferRequestDTO'
      responses:
        '200':
          description: Estado del chofer actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoferResponseDTO'
        '400':
          description: Transición de estado inválida
        '404':
          description: Chofer no encontrado
  /api/logistica/planificaciones/ejecuciones:
    post:
      summary: Iniciar planificación de rutas de forma manual
      description: Disparador auxiliar habilitado condicionalmente mediante logistica.planificacion.manual-enabled=true.
      operationId: iniciarPlanificacionManual
      responses:
        '202':
          description: Planificación aceptada para ejecución asíncrona
  /api/logistica/planificaciones/{id}:
    get:
      summary: Consultar estado de solicitud de planificación
      operationId: obtenerSolicitudPlanificacion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la solicitud de planificación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudPlanificacionResponseDTO'
        '404':
          description: Solicitud de planificación no encontrada
  /api/logistica/resultados:
    post:
      summary: Procesar callback de resultados de optimización de rutas
      operationId: procesarCallbackPlanificacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackPlanificacionRequestDTO'
      responses:
        '200':
          description: Callback procesado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudPlanificacionResponseDTO'
  /api/logistica/callback/rutas:
    post:
      summary: Webhook alias para recepción de resultados del optimizador de rutas
      operationId: procesarCallbackRutasAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackPlanificacionRequestDTO'
      responses:
        '200':
          description: Callback procesado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudPlanificacionResponseDTO'
components:
  schemas:
    DireccionDTO:
      type: object
      required:
        - calle
        - altura
        - codigoPostal
        - localidad
        - provincia
        - pais
      properties:
        calle:
          type: string
        altura:
          type: integer
          minimum: 1
        piso:
          type: integer
          nullable: true
        departamento:
          type: string
          nullable: true
        codigoPostal:
          type: string
        localidad:
          type: string
        provincia:
          type: string
        pais:
          type: string
        latitud:
          type: number
          format: double
          minimum: -90.0
          maximum: 90.0
          nullable: true
        longitud:
          type: number
          format: double
          minimum: -180.0
          maximum: 180.0
          nullable: true
    CrearEntregaRequestDTO:
      type: object
      required:
        - idDonacion
        - idBeneficiaria
        - destino
        - pesoTotalKG
        - volumenTotalM3
      properties:
        idDonacion:
          type: string
          format: uuid
        idBeneficiaria:
          type: string
          format: uuid
        destino:
          $ref: '#/components/schemas/DireccionDTO'
        pesoTotalKG:
          type: number
          exclusiveMinimum: 0
        volumenTotalM3:
          type: number
          exclusiveMinimum: 0
        donanteId:
          type: string
          format: uuid
          description: Opcional. Donante de la donación original, para listar sus entregas activas (HB-16)
    CambioEstadoEntregaRequestDTO:
      type: object
      required:
        - estado
        - actor
      properties:
        estado:
          type: string
          description: >-
            Estado destino. CANCELADA no se acepta por esta vía (400): la cancelación entra solo por el
            comando entrega.cancelada.<instancia>.v1 del broker de Donaciones (HB-19).
            EN_PUERTA (HB-22) marca que el camión llegó al destino.
          enum:
            - PENDIENTE
            - EN_TRASLADO
            - EN_PUERTA
            - ENTREGADA
            - NO_RECIBIDA
            - REVISION
        actor:
          type: string
        justificacion:
          type: string
          nullable: true
        replanificable:
          type: boolean
          nullable: true
        fotosRecepcion:
          type: array
          nullable: true
          description: Referencias de fotos de recepción (al menos una obligatoria al pasar a ENTREGADA).
          items:
            type: string
        fotoRecepcionUrl:
          type: string
          nullable: true
          description: Campo de compatibilidad para envío de una única referencia fotográfica.
        numeroRemito:
          type: string
          nullable: true
          minLength: 1
          maxLength: 40
          pattern: '\S'
          description: Número de remito al pasar a ENTREGADA (HB-17, DTI-29). Opcional durante la migración; no se publica en el mapa ni en los eventos.
        reporte:
          type: object
          nullable: true
          description: Problema contado al pasar a ENTREGADA (HB-17). La entrega queda ENTREGADA igual; el reporte viaja en entrega.exitosa.
          required:
            - motivo
          properties:
