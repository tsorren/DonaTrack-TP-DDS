            type: string
    EntregaResponseDTO:
      type: object
      required:
        - id
        - idDonacion
        - idBeneficiaria
        - estadoActual
      properties:
        id:
          type: string
          format: uuid
        idRuta:
          type: string
          format: uuid
          nullable: true
        idDonacion:
          type: string
          format: uuid
        idBeneficiaria:
          type: string
          format: uuid
        destino:
          $ref: '#/components/schemas/DireccionDTO'
        estadoActual:
          type: string
          description: >-
            CANCELADA (HB-19) es final: la entrega no salió y su necesidad se dio de baja. Queda como
            historia; la donación puede tener después otra entrega activa.
            EN_PUERTA (HB-22, valor nuevo en 1.9.0) es activo: el camión llegó al destino y la
            entidad todavía no confirmó.
          enum:
            - PENDIENTE
            - EN_TRASLADO
            - EN_PUERTA
            - ENTREGADA
            - NO_RECIBIDA
            - REVISION
            - CANCELADA
        horaSalida:
          type: string
          format: date-time
          nullable: true
        horaArribo:
          type: string
          format: date-time
          nullable: true
        fotoRecepcionUrl:
          type: string
          nullable: true
        fotosRecepcion:
          type: array
          nullable: true
          items:
            type: string
        volumenTotalM3:
          type: number
        pesoTotalKG:
          type: number
        historialEstado:
          type: array
          items:
            $ref: '#/components/schemas/CambioEstadoEntregaResponseDTO'
        numeroRemito:
          type: string
          nullable: true
          description: Remito cargado al confirmar (HB-17); nulo si no se cargó.
        reporte:
          type: object
          nullable: true
          description: Problema contado al confirmar (HB-17); nulo si llegó bien.
          required:
            - motivo
          properties:
            motivo:
              type: string
              enum:
                - INCOMPLETA
                - DANADA
                - OTRO
            detalle:
              type: string
              nullable: true
              maxLength: 500
              description: Obligatorio con OTRO.
            cantidadRecibida:
              type: number
              nullable: true
              exclusiveMinimum: true
              minimum: 0
              description: En la unidad de la donación. Obligatoria con INCOMPLETA.
