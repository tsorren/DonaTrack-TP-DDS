openapi: 3.0.3
info:
  title: DonaTrack - Donaciones Service API
  version: 1.11.0
  description: >-
    API REST para gestión de donaciones independientes (máquina de 8 estados; EN_PUERTA desde
    1.8.0, HB-22), necesidades de entidades beneficiarias, donantes y propuestas de asignación
    algorítmica. Desde 1.9.0 (R11-01) los listados de donantes, personas, donaciones, donaciones
    independientes y entidades paginan, buscan y ordenan en la base: el cuerpo sigue siendo un
    arreglo, el total va en `X-Total-Count` y, sin `page` ni `size`, devuelven la página 0 de 20
    (ninguno devuelve la lista completa). `q` busca "contiene" sin distinguir mayúsculas ni tildes.
    Desde 1.10.0 (R11-10) cada propuesta dice quién la aprobó o descartó y cuándo
    (`decididaPor`, `fechaDecision`).
    Desde 1.10.0 (R11-24) las propuestas de asignación filtran, ordenan y paginan en la base y
    dicen qué algoritmo las sugirió y en qué puesto; se suman el resumen por situación y las
    donaciones que están en propuestas pendientes.
    Desde 1.11.0 (R11-41) la cuenta cuya solicitud de entidad espera la aprobación lee y corrige
    lo que envió (`/api/personas/{id}/solicitud-entidad`).
    Desde 1.10.0 (R11-20), `GET /api/donantes/archivos` lista las importaciones de donantes con el
    mismo patrón, y el archivo informa el nombre con que se subió y cuándo (campos opcionales).
    Desde 1.10.0 (R11-12), `GET /api/entidades/publicas` acepta `categoriaId` (opcional) y
    `GET /api/donantes/{id}/entidades` da las entidades activas vistas por un donante, con el
    filtro "solo a las que doné" y la marca `yaLeDono`.
    Desde 1.11.0 (R11-26) hay un registro de actividad de administración: `GET /api/actividad`
    lo lista de a una página y `POST /api/actividad` anota lo que pasa fuera de Donaciones;
    `POST /api/entidades` acepta `origen` (opcional).
    Desde 1.11.0 (R11-43), `GET /api/entidades` filtra por `estado`, `conNecesidades` y `rubro`;
    `GET /donaciones-independientes` acepta `orden=ATENCION`, y
    `GET /donaciones-independientes/conteos` da las cifras de una organización.
servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo
paths:
  /donaciones-independientes:
    get:
      summary: Listar donaciones independientes con filtros
      description: >
        Una página de las que cumplen los filtros (R11-01), por fecha de registro. Los filtros se
        combinan con Y; los valores repetidos de `estado`, con O.
      operationId: listarDonacionesIndependientes
      parameters:
        - name: estado
          in: query
          required: false
          description: >
            Uno o varios estados, repitiendo el parámetro (`estado=EN_DEPOSITO&estado=ENTREGADA`);
            desde 1.9.0. Un solo valor se manda igual que antes.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - EN_DEPOSITO
                - ASIGNACION_REALIZADA
                - EN_TRASLADO
                - EN_PUERTA
                - LISTA_PARA_ENTREGAR
                - ENTREGADA
                - ENTREGA_FALLIDA
                - VENCIDA
        - name: subcategoriaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: categoriaId
          in: query
          required: false
          description: Donaciones con algún ítem de una subcategoría de esta categoría (HB-03).
          schema:
            type: string
            format: uuid
        - name: donanteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: entidadId
          in: query
          required: false
          description: Entidad beneficiaria asignada (HB-04). Sin autenticación llega por parámetro; la pertenencia se controla en la etapa 2 de SPEC-06.
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          description: Fecha de registro mínima, inclusiva (HB-04).
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          description: Fecha de registro máxima, inclusiva (HB-04). Si es anterior a `desde`, responde 400.
          schema:
            type: string
            format: date
        - name: necesidadId
          in: query
          required: false
          description: Las donaciones que cubren esa necesidad, en cualquier período (HB-18). Su estado dice si están en camino o entregadas.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Q'
        - name: orden
          in: query
          required: false
          description: >-
            Por fecha de registro; RECIENTES (la más nueva primero) si se omite. Desde 1.11.0
            (R11-43), ATENCION: lo que la organización tiene que atender primero, por grupos
            (EN_PUERTA; ENTREGA_FALLIDA y VENCIDA; EN_TRASLADO; ASIGNACION_REALIZADA,
            LISTA_PARA_ENTREGAR y EN_DEPOSITO; ENTREGADA) y, dentro de cada grupo, la más reciente
            primero; desempata por id.
          schema:
            type: string
            enum: [RECIENTES, ANTIGUAS, ATENCION]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de donaciones independientes. `q` busca en la descripción de sus bienes.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonacionIndependienteResponseDTO'
        '400':
          description: >-
            Fecha mal formada, `desde` posterior a `hasta`, estado u orden desconocido, o `page`,
            `size` o `q` fuera de rango (ERR-CSR-003)
  /donaciones-independientes/conteos:
    get:
      summary: Cifras de las donaciones asignadas a una organización (R11-43)
      description: >-
        Cuántas asignadas tiene la organización en cada estado, cuántas recibió en el mes en curso
        (las que pasaron a ENTREGADA, con el reloj de Buenos Aires, como el resumen del admin) y lo
        mismo por necesidad. Con `necesidadId`, todo se cuenta sobre esa necesidad. Los mismos
        permisos que el listado: ADMIN, o la organización sobre sí misma con `VER_DONACIONES`.
      operationId: contarDonacionesDeEntidad
      parameters:
        - name: entidadId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: necesidadId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Las cifras de la organización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConteosDeEntidadDTO'
        '400':
          description: Sin `entidadId` o con un id mal formado
        '403':
          description: Otra organización, o sin `VER_DONACIONES`
  /donaciones-independientes/{id}:
    get:
      summary: Consultar donación independiente por ID
      operationId: obtenerDonacionIndependientePorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la donación independiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionIndependienteResponseDTO'
        '404':
          description: Donación independiente no encontrada
  /donaciones-independientes/{id}/estado:
    patch:
      summary: Transicionar estado de la donación independiente (State Pattern)
      operationId: cambiarEstadoDonacionIndependiente
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Actor
          in: header
          required: true
          schema: { type: string }
          description: Identificador del actor o sistema que ejecuta la transición
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoDonacionIndependienteRequestDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionIndependienteResponseDTO'
        '400':
          description: Transición inválida para el estado actual
        '409':
          description: >-
            Otra operación guardó la donación después de que se leyó
            (DONACION_INDEPENDIENTE_MODIFICADA_CONCURRENTEMENTE, bloqueo optimista; releer y
            reintentar), o la asignación (estado ASIGNACION_REALIZADA con necesidadId) apunta a una
            necesidad que ya no admite asignaciones (NECESIDAD_INACTIVA, ERR-EST-521, HB-19)
  /api/donaciones:
    post:
      summary: Registrar donación (donación general con ítems)
      operationId: registrarDonacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonacionInputDTO'
      responses:
        '201':
          description: Donación creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionOutputDTO'
        '409':
          description: El donante está dado de baja (DONANTE_INACTIVO)
        '400':
          description: Datos de donación inválidos, incluida la falta de descripción (obligatoria desde la persistencia en PostgreSQL, D-32)
    get:
      summary: Listar donaciones
      description: Una página de las donaciones que cumplen los filtros (R11-01), por fecha.
      operationId: listarDonaciones
      parameters:
        - name: donanteId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          required: false
          description: Fecha mínima, inclusiva.
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: false
          description: Fecha máxima, inclusiva. Si es anterior a `desde`, responde 400.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Q'
        - name: orden
          in: query
          required: false
          description: Por fecha; RECIENTES si se omite.
          schema:
            type: string
            enum: [RECIENTES, ANTIGUAS]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de donaciones. `q` busca en la descripción de la donación y en la de sus bienes.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonacionOutputDTO'
        '400':
          description: Fecha mal formada, `desde` posterior a `hasta`, orden desconocido o paginado fuera de rango (ERR-CSR-003)
  /api/donaciones/resumen:
    get:
      summary: Cifras del inicio del administrador
      description: >
        Solo ADMIN (R11-01). Cada cifra es un conteo en la base, sin traer listas. Sin las
        entidades pendientes de aprobación, que vienen de Auth. El mes en curso y "por vencer"
        salen del reloj del servicio (America/Argentina/Buenos_Aires).
      operationId: obtenerResumenAdmin
      responses:
        '200':
          description: Resumen calculado en el momento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenAdminDTO'
        '401':
          description: Sin token o token inválido
        '403':
          description: El token no es de un administrador
  /api/donaciones/fotos:
    post:
      summary: Pedir una URL prefirmada para subir la foto de un bien
      description: >
        El servicio no recibe los bytes de la foto: devuelve una URL temporal (15 min) para subirla
        directo al almacenamiento de objetos (MinIO) con PUT y el header Content-Type indicado,
        y una referencia para mandar en fotoUrl al cargar la donación. Tipos aceptados: JPEG, PNG
        y WebP, hasta 10 MB (se verifica al cargar la donación).
      operationId: solicitarSubidaFoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudSubidaFotoInputDTO'
      responses:
        '200':
          description: URL de subida y referencia de la foto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubidaFotoOutputDTO'
        '400':
          description: Falta el tipo de contenido (ERR-CSR-003) o no está permitido (ERR-VAL-318)
  /api/donaciones/contadores:
    get:
      summary: Contadores públicos de la landing
      description: >
        Ruta pública (RF-01, HB-02): sin token cuando el gateway aplique la allowlist (D26). Totales
        desde el inicio, sin datos personales. donantesActivos cuenta los donantes activos con al
        menos una donación; donacionesRealizadas, las donaciones independientes en ENTREGADA (la
        entidad confirmó la recepción); beneficiariosActivos, las entidades beneficiarias activas.
        Desde 1.9.0 cada cifra es un conteo en la base (R11-01).
      operationId: obtenerContadoresPublicos
      responses:
        '200':
          description: Contadores y momento del cálculo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContadoresPublicosDTO'
  /api/donaciones/destacadas:
    get:
      summary: Donaciones destacadas de la landing
      description: >
        Ruta pública (RF-01, HB-01, D28): sin token cuando el gateway aplique la allowlist (D26).
        Donaciones independientes en ENTREGADA con fotos de recepción replicadas de entrega.exitosa
        (ADR de réplicas por evento), de la más nueva a la más vieja. Una entrega con reporte no
        aporta fotos y no sale (ADR de entregas con problema, 2026-11-08). Sin el donante ni la
        descripción libre del bien. X-Total-Count da el total del período, sin el límite.
      operationId: listarDestacadas
      parameters:
        - name: periodo
          in: query
          required: false
          description: Ventana hacia atrás desde ahora; MES (30 días) si se omite.
          schema:
            type: string
            enum: [SEMANA, MES, ANIO]
        - name: limite
          in: query
          required: false
          description: Cuántas devuelve; 10 si se omite.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Destacadas del período
          headers:
            X-Total-Count:
              description: Total de destacadas del período
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonacionDestacadaDTO'
        '400':
          description: Período desconocido o límite fuera de 1..50
  /api/donaciones/{id}:
    get:
      summary: Consultar donación por ID
      operationId: obtenerDonacionPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la donación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionOutputDTO'
        '404':
          description: Donación no encontrada
  /api/necesidades:
    post:
      summary: Registrar necesidad de entidad beneficiaria
      description: >
        HB-18 (ADR 20261102 del ciclo de vida de la necesidad). Una `EXTRAORDINARIA` exige
        `fechaLimite`, posterior a hoy. Una `RECURRENTE` exige `periodicidad` (`SEMANAL`, `QUINCENAL`
        o `MENSUAL`); su primer período empieza el día de la publicación y `fechaFin` ya no se lee.
        Los dos son cambios incompatibles, registrados en `cambios-incompatibles-aceptados.txt`.
      operationId: registrarNecesidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NecesidadDTO'
      responses:
        '201':
          description: Necesidad registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NecesidadDTO'
        '400':
          description: >
            Datos inválidos. Entre otros: `FECHA_LIMITE_NULA` (ERR-VAL-524), `FECHA_LIMITE_NO_FUTURA`
            (ERR-VAL-525) y `NECESIDAD_RECURRENTE_SIN_PERIODO` (ERR-VAL-512, falta `periodicidad`).
        '409':
          description: La entidad beneficiaria está dada de baja (ENTIDAD_BENEFICIARIA_INACTIVA)
    get:
      summary: Listar necesidades
      description: >
        Sin `estado` devuelve todas, también las dadas de baja (HB-18). Cada una trae su `estado`
        calculado.
      operationId: listarNecesidades
      parameters:
        - name: entidadId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: tipo
          in: query
          required: false
          schema: { type: string }
        - name: estado
          in: query
          required: false
          description: Uno o varios estados separados por coma (`VIGENTE,CUMPLIDA`). Un valor que no existe responde 400.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EstadoNecesidad'
      responses:
        '200':
          description: Listado de necesidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NecesidadDTO'
        '400':
          description: Un `estado` que no existe
  /api/necesidades/publicas:
    get:
      summary: Listar necesidades vigentes (ruta pública)
      description: >
        Ruta pública (D26, HB-08): necesidades activas, sin vencer y no satisfechas, con un DTO
        propio, sin datos internos. Las de una entidad dada de baja no aparecen (la baja las
        desactiva) y una extraordinaria con la fecha límite pasada tampoco (HB-18).
      operationId: listarNecesidadesPublicas
      parameters:
        - name: entidadId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Necesidades vigentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NecesidadPublicaDTO'
  /api/necesidades/{id}:
    get:
      summary: Consultar necesidad por ID
      operationId: obtenerNecesidadPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la necesidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NecesidadDTO'
        '404':
          description: Necesidad no encontrada
    put:
      summary: Actualizar necesidad existente
      description: >
        Cambia `descripcion` y `cantidadNecesitada`. En una recurrente, la cantidad nueva vale
        también para el período en curso (HB-18). Si llega `version` y no coincide con la guardada,
        responde 409; sin `version` no se compara (opcional mientras dure la migración del contrato).
      operationId: actualizarNecesidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NecesidadDTO'
      responses:
        '200':
          description: Necesidad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NecesidadDTO'
        '400':
          description: Datos inválidos
        '404':
          description: Necesidad no encontrada
        '409':
          description: Otra operación guardó la necesidad después de que se leyó (NECESIDAD_MODIFICADA_CONCURRENTEMENTE, bloqueo optimista); releer y reintentar
    delete:
      summary: Baja de necesidad
      description: >-
        Baja lógica. Además (HB-19, ADR 20261109-cancelacion-de-entregas-que-no-salieron), las
        donaciones asignadas a la necesidad que todavía no salieron (ASIGNACION_REALIZADA o
        LISTA_PARA_ENTREGAR) se cancelan: quedan con cancelacionPedida = true hasta que el proveedor
        de logística confirma, y entonces vuelven a EN_DEPOSITO sin destino. Si ningún proveedor tiene
        la entrega, vuelven en el acto. Las que ya salieron (EN_TRASLADO) llegan igual. Repetir la
        baja vuelve a pedir las cancelaciones pendientes.
      operationId: eliminarNecesidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Necesidad eliminada exitosamente
        '404':
          description: Necesidad no encontrada
  /api/necesidades/{id}/periodos:
    get:
      summary: Historia de períodos de una necesidad recurrente
      description: >
        HB-18. Por período: inicio, fin, objetivo, lo asignado, lo recibido (donaciones `ENTREGADA`)
        y el resultado. Una extraordinaria devuelve la lista vacía. Las donaciones que cubren la
        necesidad salen de `GET /donaciones-independientes?necesidadId=`.
      operationId: listarPeriodosDeNecesidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Los períodos, del más viejo al en curso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeriodoNecesidadDTO'
        '404':
          description: Necesidad no encontrada
  /api/asignaciones/ejecuciones:
    post:
      summary: Ejecutar algoritmo de asignación y generar propuestas
      description: >
        Desde 1.10.0 (R11-24) cada propuesta generada trae `sugeridaPor`, y la necesidad trae la
        organización y la unidad. `situacion` viene `null` y `otrasPendientesMismaNecesidad` en 0:
        la situación se calcula al listar (`GET /api/asignaciones/propuestas`).
      operationId: ejecutarAsignacion
      responses:
        '201':
          description: Propuestas generadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropuestaDTO'
    get:
      summary: Historial de ejecuciones de asignación
      description: >
        Desde 1.10.0 (R11-24) pagina en la base, de la más reciente a la más vieja: sin `page` ni
        `size` devuelve la página 0 de 20 (antes, todas). `size=1` da la última corrida.
      operationId: historialEjecucionesAsignacion
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Historial de ejecuciones
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
        '400':
          description: '`page` negativo o `size` fuera de 1..100 (ERR-CSR-003)'
  /api/asignaciones/propuestas:
    get:
      summary: Listar propuestas de asignación
      description: >
        Desde 1.10.0 (R11-24) filtra, ordena y pagina en la base: sin `page` ni `size` devuelve la
        página 0 de 20 (antes, todas). Los filtros se combinan con Y; los valores repetidos de un
        mismo filtro, con O. Cada propuesta dice qué algoritmo la sugirió y en qué puesto
        (`sugeridaPor`) y, si está pendiente, su `situacion`.
      operationId: listarPropuestasAsignacion
      parameters:
        - name: estado
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [PENDIENTE, APROBADA, DESCARTADA] }
        - name: situacion
          in: query
          required: false
          description: >-
            Solo pendientes en esa situación. LIBRE: todo lo que pide alcanza y nadie más lo pide.
            EN_CONFLICTO: alcanza para ella sola, pero otra pendiente pide la misma donación o la
            misma necesidad. SIN_STOCK: alguna donación ya no tiene lo que pide.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [LIBRE, EN_CONFLICTO, SIN_STOCK] }
        - name: algoritmo
          in: query
          required: false
          description: >-
            Las que sugirió ese algoritmo (solo o con el otro); AMBOS, las que sugirieron los dos.
            Sin distinguir mayúsculas.
          schema:
            type: string
            enum: [COMPATIBILIDAD_SEMANTICA, PRIORIDAD_SUBATENDIDOS, AMBOS]
        - name: donacion
          in: query
          required: false
          description: Las que piden esta donación independiente.
          schema: { type: string, format: uuid }
        - name: orden
          in: query
          required: false
          description: >-
            `puesto` (por defecto): el mejor puesto primero y, con `situacion=EN_CONFLICTO`, juntas
            las que compiten por la misma donación. `reciente`: la más nueva primero.
          schema: { type: string, enum: [puesto, reciente] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Una página de propuestas
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropuestaDTO'
        '400':
          description: >-
            Un `estado`, `situacion`, `algoritmo` u `orden` desconocido, `page` negativo o `size`
            fuera de 1..100 (ERR-CSR-003)
  /api/asignaciones/propuestas/resumen:
    get:
      summary: Cuántas propuestas pendientes hay en cada situación
      description: Desde 1.10.0 (R11-24). Contado en la base.
      operationId: resumenPropuestasAsignacion
      responses:
        '200':
          description: Cuentas de pendientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenPropuestasDTO'
  /api/asignaciones/donaciones:
    get:
      summary: Donaciones que están en alguna propuesta pendiente
      description: >
        Desde 1.10.0 (R11-24). Por cada donación: lo que queda en el depósito, cuánto piden las
        pendientes y en cuántas está. Primero las que no alcanzan para todas, después por fecha de
        registro.
      operationId: listarDonacionesEnPropuestas
      parameters:
        - name: categoriaId
          in: query
          required: false
          description: Solo donaciones de una subcategoría de esta categoría.
          schema: { type: string, format: uuid }
        - name: soloEnConflicto
          in: query
          required: false
          description: Solo las que no alcanzan para todas las pendientes que las piden.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Una página de donaciones
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonacionEnPropuestasDTO'
        '400':
          description: '`page` negativo o `size` fuera de 1..100 (ERR-CSR-003)'
  /api/asignaciones/propuestas/{id}/estado:
    put:
      summary: Actualizar estado de una propuesta de asignación
      description: >
        Al aprobar se valida que la necesidad siga activa y que ninguna donación de la propuesta
        pertenezca a la propia entidad beneficiaria. Desde 1.10.0 (R11-10) la decisión queda a
        nombre de la cuenta del token (su `sub`), nunca de un dato que mande el cliente: se guarda
        en `decididaPor` con `fechaDecision` y, al aprobar, es el `actor` del cambio de estado de
        cada donación asignada. Sin token (seguridad deshabilitada), "SISTEMA". Ruta, cuerpo,
        respuestas y errores no cambian.
      operationId: actualizarEstadoPropuesta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado actualizado
        '409':
          description: >
            La necesidad ya no está activa (NECESIDAD_INACTIVA), una donación es de la propia
            entidad (DONACION_A_SI_MISMO), la transición de estado no es válida o otra operación
            guardó una de las donaciones a la vez
            (DONACION_INDEPENDIENTE_MODIFICADA_CONCURRENTEMENTE). La aprobación es atómica: si
            falla, no queda nada asignado y la propuesta sigue pendiente.
  /api/entidades:
    post:
      summary: Registrar entidad beneficiaria
      description: >
        Registro idempotente. El id de la entidad es el de su persona jurídica (`juridicaId`).
        La jurídica debe existir, no ser EMPRESA y tener dirección. Si ya era entidad no se
        duplica; si estaba de baja se reactiva (sus necesidades no se reactivan).
      operationId: registrarEntidadBeneficiaria
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntidadBeneficiariaInput'
      responses:
        '201':
          description: Entidad creada. La respuesta incluye `activo`.
        '200':
          description: La jurídica ya era entidad (activa, o reactivada ahora). No se duplica.
        '400':
          description: La persona no es jurídica, es EMPRESA o no tiene dirección
        '404':
          description: Persona no encontrada
        '409':
          description: La jurídica fue anonimizada (PERSONA_ANONIMIZADA_NO_OPERABLE)
    get:
      summary: Listar entidades beneficiarias
      description: >
        Incluye las entidades dadas de baja; cada una expone `activo`. Ordena por razón social y
        devuelve un tramo (HB-15), resuelto en la base. Desde 1.9.0 (R11-01), sin `page` ni `size`
        devuelve la página 0 de 20, ya no todas. El cuerpo es siempre un arreglo; el total de las
        que cumplen el filtro va en el header `X-Total-Count`. Desde 1.11.0 (R11-43), `estado`,
        `conNecesidades` y `rubro`, opcionales; sin ellos, la respuesta es la misma que en 1.10.0.
      operationId: listarEntidadesBeneficiarias
      parameters:
        - name: estado
          in: query
          required: false
          description: ACTIVA o BAJA; sin él, las dos. Otro valor da 400.
          schema:
            type: string
            enum: [ACTIVA, BAJA]
        - name: conNecesidades
          in: query
          required: false
          description: >-
            true, las que tienen alguna necesidad activa y no vencida hoy; false, las que no tienen
            ninguna.
          schema:
            type: boolean
        - name: rubro
          in: query
          required: false
          description: Igual al rubro de la jurídica, sin distinguir mayúsculas ni tildes.
          schema:
            type: string
        - name: nombre
          in: query
          required: false
          description: Razón social que contiene este texto, sin distinguir mayúsculas ni tildes.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          description: Número de página, desde 0. Por defecto 0.
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página. Por defecto 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Listado de entidades
          headers:
            X-Total-Count:
              description: Cantidad de entidades que cumplen el filtro, sin contar la paginación.
              schema:
                type: integer
        '400':
          description: '`page` negativo, `size` fuera de 1..100, `nombre` de más de 100 caracteres o un `estado` que no existe (ERR-CSR-003)'
  /api/entidades/publicas:
    get:
      summary: Listar entidades beneficiarias activas (ruta pública)
      description: >
        Ruta pública (D26, HB-08): solo entidades activas, con un DTO propio sin documento,
        dirección, medios de contacto ni representantes. Mismos `nombre`, `page`, `size` y header
        `X-Total-Count` que `GET /api/entidades`. Desde 1.10.0 (R11-12), `categoriaId` opcional;
        sin él, la respuesta es la misma que en 1.9.0.
      operationId: listarEntidadesPublicas
      parameters:
        - name: nombre
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/CategoriaDeLaEntidad'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Entidades activas
          headers:
            X-Total-Count:
              description: Cantidad de entidades activas que cumplen el filtro.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntidadPublicaDTO'
        '400':
          description: >-
            `page` negativo, `size` fuera de 1..100 o `categoriaId` mal escrito (ERR-CSR-003)
  /api/entidades/{id}:
    get:
      summary: Consultar entidad beneficiaria por ID
      description: El `id` es el de la persona jurídica (`juridicaId`).
      operationId: obtenerEntidadPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la entidad (incluye `activo`)
        '404':
          description: Entidad no encontrada
    put:
      summary: Revalidar entidad beneficiaria
      description: >
        Solo revalida: exige que el `id` coincida con `juridicaId` y que la jurídica siga
        cumpliendo los requisitos (no EMPRESA, con dirección). No cambia el estado de la entidad;
        los datos se editan con `PUT /api/personas/{id}`. Para reactivar una entidad de baja se
        usa `POST /api/entidades`.
      operationId: actualizarEntidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entidad revalidada
        '400':
          description: El id no coincide con juridicaId, o la jurídica ya no cumple los requisitos
        '404':
          description: Entidad no encontrada
        '409':
          description: La entidad está dada de baja
    delete:
      summary: Baja de entidad beneficiaria
      description: >
        Baja lógica e idempotente: marca la entidad como inactiva y desactiva en cascada sus
        necesidades. No borra el registro; las donaciones históricas siguen resolviéndose.
      operationId: eliminarEntidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Entidad dada de baja (o ya lo estaba)
        '404':
          description: Entidad no encontrada
  /api/donantes:
    post:
      summary: Registrar nuevo donante
      description: >
        Registro idempotente. El id del donante es el de su persona (`idPersona`). Si la persona
        ya era donante activa no se duplica ni se publica evento; si estaba de baja se reactiva y
        se publica `donante.registrado.v1`.
      operationId: registrarDonante
      responses:
        '201':
          description: Donante registrado. La respuesta incluye `activo`.
        '200':
          description: La persona ya era donante (activa, o reactivada ahora). No se duplica.
        '404':
          description: Persona no encontrada
        '409':
          description: La persona fue anonimizada (PERSONA_ANONIMIZADA_NO_OPERABLE)
    get:
      summary: Listar donantes
      description: >
        Una página de los donantes que cumplen los filtros (R11-01). Sin `canal` incluye los
        donantes dados de baja; cada uno expone `activo`. Con `canal` devuelve solo los donantes
        activos cuya persona no está anonimizada, porque el filtro sirve para contactarlos.
      operationId: listarDonantes
      parameters:
        - name: canal
          in: query
          required: false
          description: >-
            Tipo de medio de contacto: `CORREO`, `TELEFONO` (estándar) o `WHATSAPP`. Uno
            desconocido no devuelve ninguno.
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: >-
            Contiene, sin distinguir mayúsculas ni tildes, en el nombre, el apellido, la razón
            social o el número de documento. Hasta 100 caracteres.
          schema: { type: string, maxLength: 100 }
        - name: tipo
          in: query
          required: false
          schema: { type: string, enum: [HUMANA, JURIDICA] }
        - name: tipoJuridico
          in: query
          required: false
          description: Solo jurídicas de ese tipo.
          schema: { type: string, enum: [GUBERNAMENTAL, ONG, EMPRESA, INSTITUCION] }
        - name: activo
          in: query
          required: false
          schema: { type: boolean }
        - name: categoriaId
          in: query
          required: false
          description: Donó alguna vez un bien de una subcategoría de esta categoría.
          schema: { type: string, format: uuid }
        - name: orden
          in: query
          required: false
          description: >-
            NUEVOS (por fecha de alta, el más nuevo primero; por defecto), ANTIGUOS o NOMBRE
            (razón social, o apellido y nombre, sin tildes).
          schema: { type: string, enum: [NUEVOS, ANTIGUOS, NOMBRE] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de donantes
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DonanteOutputDTO' }
        '400':
          description: Tipo, orden o paginado inválidos, o `q` de más de 100 caracteres (ERR-CSR-003)
  /api/donantes/{id}:
    get:
      summary: Consultar donante por ID
      description: El `id` es el de la persona (`personaId`).
      operationId: obtenerDonantePorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del donante (incluye `activo` y, desde HB-20, `mostrarNombre`)
        '404':
          description: Donante no encontrado
    delete:
      summary: Dar de baja donante
      description: >
        Baja lógica e idempotente: marca al donante como inactivo y publica
        `donante.dado-de-baja.v1` solo si estaba activo. No borra el registro.
      operationId: eliminarDonante
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Donante dado de baja (o ya lo estaba)
        '404':
          description: Donante no encontrado
  /api/donantes/{id}/entidades:
    get:
      summary: Listar las entidades activas vistas por un donante
      description: >
        R11-12. Las entidades activas, con la misma búsqueda y el mismo orden que
        `GET /api/entidades/publicas` (por razón social sin tildes y después por id). Los filtros se
        combinan con Y y el total de `X-Total-Count` los cuenta a todos. Solo el propio donante o el
        administrador. `yaLeDono` dice si alguna donación de ese donante quedó asignada a la
        entidad, en cualquier estado; se calcula para la página con una sola consulta.
      operationId: listarEntidadesParaDonante
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: nombre
          in: query
          required: false
          description: Busca en la razón social sin distinguir mayúsculas ni tildes.
          schema:
            type: string
        - $ref: '#/components/parameters/CategoriaDeLaEntidad'
        - name: soloDonadas
          in: query
          required: false
          description: >
            Con `true`, solo las que recibieron al menos una donación de ese donante, en cualquier
            estado.
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Una página de entidades activas
          headers:
            X-Total-Count:
              description: Cantidad de entidades que cumplen todos los filtros.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntidadParaDonanteDTO'
        '400':
          description: >-
            `page` negativo, `size` fuera de 1..100 o un UUID mal escrito (ERR-CSR-003)
        '401':
          description: Sin token
        '403':
          description: Otro donante, una entidad o una cuenta sin rol de donante
        '404':
          description: Donante no encontrado
  /api/donantes/{id}/preferencias:
    patch:
      summary: Cambiar si la entidad ve el nombre del donante
      description: >
        HB-20 (ADR 20261102-nombre-visible-del-donante-y-constancia-de-los-legales). Vale desde ya
        para todas sus donaciones, también las pasadas, porque el nombre se calcula al leer. Solo el
        propio donante o el administrador.
      operationId: actualizarPreferenciasDonante
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenciasDonanteDTO' }
      responses:
        '200':
          description: Donante con la preferencia guardada (`mostrarNombre`)
        '400': { description: Falta mostrarNombre }
        '403': { description: El donante no es el del token }
        '404': { description: Donante no encontrado }
  /api/donantes/archivos:
    get:
      summary: Listar las importaciones de donantes (solo ADMIN)
      description: >
        Desde 1.10.0 (R11-20). Una página de importaciones, en curso e históricas, con la
        búsqueda y los filtros resueltos en la base; el total va en `X-Total-Count`. Sin `page` ni
        `size`, la página 0 de 20. `q` busca en el nombre con que se subió el archivo (las
        importaciones anteriores a 1.10.0 no lo tienen y no coinciden con ninguna búsqueda). Para
        contar las que están en curso sin traer la lista, pedir
        `estado=PENDIENTE&estado=PROCESANDO&size=1` y leer `X-Total-Count`.
      operationId: listarArchivosDonantes
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: estado
          in: query
          required: false
          description: Uno o varios estados, repitiendo el parámetro (`estado=PENDIENTE&estado=PROCESANDO`).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [PENDIENTE, PROCESANDO, PROCESADO, PROCESADO_CON_ERRORES, ERROR]
        - name: desde
          in: query
          required: false
          description: >
            Primer día de subida (AAAA-MM-DD, inclusivo), en la hora de Buenos Aires. Con `desde`
            o `hasta`, las importaciones sin fecha de subida quedan afuera.
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: false
          description: Último día de subida (AAAA-MM-DD, inclusivo), en la hora de Buenos Aires.
          schema: { type: string, format: date }
        - name: orden
          in: query
          required: false
          description: >
            `recientes` (por defecto) o `antiguas`, por la fecha de subida; las que no la tienen,
            siempre al final. Desempata por id.
          schema:
            type: string
            enum: [recientes, antiguas]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Una página de importaciones
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchivoDonantesResponse'
        '400':
          description: >
            `page`, `size`, `q`, `estado`, `orden` o una fecha inválidos, o `desde` posterior a
            `hasta` (ERR-CSR-003)
        '401': { description: Sin token }
        '403': { description: El token no es de ADMIN }
    post:
      summary: Cargar archivo/padrón de donantes para procesamiento asíncrono
      description: >
        Una fila cuyo correo ya pertenece a otra persona con un documento distinto no se
        importa y cuenta como error del archivo (PERSONA_DUPLICADA_EN_CONFLICTO): el conflicto
        no devuelve 409, porque el procesamiento es asíncrono.
      operationId: cargarArchivoDonantes
      requestBody:
        required: true
        description: >
          El padrón como multipart/form-data. El servicio lo guarda en el almacenamiento de
          objetos (MinIO) con una clave propia; el nombre del archivo se usa para validar la
          extensión .csv y, desde 1.10.0, se guarda como `nombre`. Reemplaza al cuerpo JSON {path} con una ruta del servidor (cambio no
          aditivo aprobado en la Entrega 6).
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Padrón CSV en UTF-8 (con o sin BOM), hasta 50 MB
      responses:
        '202':
          description: Archivo aceptado para procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivoDonantesResponse'
        '400':
          description: >
            Falta la parte 'archivo' (ERR-CSR-003), o el archivo está vacío o no es .csv
            (ERR-VAL-213)
        '413':
          description: El archivo supera el tamaño máximo (ERR-CSR-003 o ERR-VAL-214)
        '415':
          description: El cuerpo no es multipart/form-data
  /api/donantes/archivos/{id}:
    get:
      summary: Consultar estado de procesamiento de archivo de donantes
      operationId: obtenerArchivoDonantes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del archivo de donantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivoDonantesResponse'
        '404':
          description: Archivo no encontrado
  /api/donantes/archivos/{id}/filas-con-error:
    get:
      summary: Listar las filas del padrón que no se importaron
      description: >
        Resultado por fila del padrón (HB-14): solo las filas con error, ordenadas por línea del
        CSV (el encabezado es la línea 1). Sin datos de la persona: línea, motivo y código. El
        total va en el header `X-Total-Count` y coincide con `conError` del archivo, salvo que el
        archivo haya terminado en ERROR porque no se pudieron guardar sus filas. Mientras el
        archivo se procesa, la lista crece por tandas de 500 filas.
      operationId: listarFilasConErrorDelArchivo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          description: Número de página, desde 0. Por defecto 0.
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página. Por defecto 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Tramo de las filas con error
          headers:
            X-Total-Count:
              description: Cantidad total de filas con error del archivo.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilaConErrorResponse'
        '400':
          description: '`page` negativo o `size` fuera de 1..100 (ERR-CSR-003)'
        '404':
          description: Archivo no encontrado
  /api/actividad:
    get:
      summary: Listar el registro de actividad de administración (solo ADMIN)
      description: >
        Desde 1.11.0 (R11-26). Quién hizo qué y cuándo: una fila por acción de una persona de
        administración, de la más reciente a la más vieja (desempata por id), de a una página; el
        total de las que cumplen los filtros va en `X-Total-Count`. Sin `page` ni `size`, la página
        0 de 20. Una página fuera de rango devuelve un arreglo vacío con el total real. El autor es
        el `sub` del token de quien hizo la acción; el nombre se lee del proveedor de ingreso al
        mostrarlo.
      operationId: listarActividad
      parameters:
        - name: autor
          in: query
          required: false
          description: >
            El `sub` de una cuenta (hasta 64 caracteres), repitiendo el parámetro para varias
            (hasta 20). Sin `autor`, todas.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, maxLength: 64 }
        - name: accion
          in: query
          required: false
          description: Una o varias acciones, repitiendo el parámetro. Sin `accion`, todas.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AccionDeAdministracion'
        - name: desde
          in: query
          required: false
          description: Primer día (AAAA-MM-DD, inclusivo), en la hora de Buenos Aires.
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: false
          description: Último día (AAAA-MM-DD, inclusivo), en la hora de Buenos Aires.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Una página del registro
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActividadResponse'
        '400':
          description: >
            `page`, `size`, `autor`, `accion` o una fecha inválidos, más de 20 `autor`, o `desde`
            posterior a `hasta` (ERR-CSR-003)
        '401': { description: Sin token }
        '403': { description: El token no es de ADMIN }
    post:
      summary: Anotar una acción de administración hecha fuera de Donaciones (solo ADMIN)
      description: >
        Desde 1.11.0 (R11-26). Solo para lo que pasa por Keycloak o Logística: dar de alta un
        administrador, generar otra contraseña provisoria y agregar, deshabilitar o volver a
        habilitar un camión. Las acciones que pasan por Donaciones las registra Donaciones y no se
        aceptan acá. El autor (el `sub` del token) y la hora los pone Donaciones: el cuerpo no los
        trae. No es idempotente: el sitio llama una vez por acción hecha.
      operationId: anotarActividad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnotacionActividad'
      responses:
        '201':
          description: La acción anotada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActividadResponse'
        '400':
          description: >
            Otra `accion` (una de las que registra Donaciones), falta `objetoId`, un largo excedido
            o un `detalle` para una cuenta (ERR-CSR-003)
        '401': { description: Sin token }
        '403': { description: El token no es de ADMIN }
  /api/categorias:
    get:
      summary: Listar categorías de donación
      operationId: listarCategorias
      responses:
        '200':
          description: Listado de categorías
    post:
      summary: Crear categoría
      operationId: crearCategoria
      responses:
        '201':
          description: Categoría creada
  /api/categorias/{id}:
    get:
      summary: Consultar categoría por ID
      operationId: obtenerCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Detalle de categoría }
        '404': { description: Categoría no encontrada }
    put:
      summary: Actualizar categoría
      operationId: actualizarCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Categoría actualizada }
        '404': { description: Categoría no encontrada }
    delete:
      summary: Eliminar categoría
      operationId: eliminarCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Categoría eliminada exitosamente (retorna CategoriaOutputDTO) }
        '404': { description: Categoría no encontrada }
        '409': { description: Alguna de sus subcategorías tiene necesidades que la usan (SUBCATEGORIA_EN_USO) }
  /api/subcategorias:
    get:
      summary: Listar subcategorías
      operationId: listarSubcategorias
      responses:
        '200': { description: Listado de subcategorías }
    post:
      summary: Crear subcategoría
      description: El body acepta `unidad` opcional (HB-18); sin ella, la subcategoría hereda la de su categoría.
      operationId: crearSubcategoria
      responses:
        '201': { description: Subcategoría creada }
  /api/subcategorias/{id}:
    get:
      summary: Consultar subcategoría por ID
      operationId: obtenerSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Detalle de subcategoría }
        '404': { description: Subcategoría no encontrada }
    put:
      summary: Actualizar subcategoría
      description: El body acepta `unidad` opcional (HB-18); sin ella, la subcategoría vuelve a heredar la de su categoría.
      operationId: actualizarSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Subcategoría actualizada }
        '404': { description: Subcategoría no encontrada }
    delete:
      summary: Eliminar subcategoría
      operationId: eliminarSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Subcategoría eliminada exitosamente (retorna SubcategoriaOutputDTO) }
        '404': { description: Subcategoría no encontrada }
        '409': { description: Tiene necesidades que la usan (SUBCATEGORIA_EN_USO) }
  /api/subcategorias/{id}/aliases:
    post:
      summary: Agregar alias semántico a una subcategoría
      operationId: agregarAliasSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSubcategoriaInputDTO'
      responses:
        '200':
          description: Subcategoría con alias agregado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoriaOutputDTO'
        '400':
          description: Alias inválido
        '404':
          description: Subcategoría no encontrada
  /api/subcategorias/{id}/aliases/{alias}:
    delete:
      summary: Quitar alias semántico de una subcategoría
      operationId: quitarAliasSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Subcategoría con alias eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoriaOutputDTO'
        '404':
          description: Subcategoría o alias no encontrado
  /api/items-normalizados/pendientes:
    get:
      summary: Listar items normalizados pendientes de revisión
      operationId: listarItemsNormalizadosPendientes
      responses:
        '200':
          description: Listado de items normalizados pendientes de revisión
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemDonacionNormalizadoOutputDTO'
  /api/items-normalizados/{id}:
    get:
      summary: Consultar item normalizado por ID
      operationId: obtenerItemNormalizadoPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del item normalizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDonacionNormalizadoOutputDTO'
        '404':
          description: Item normalizado no encontrado
    patch:
      summary: Actualizar estado y reclasificación de item normalizado
      operationId: actualizarEstadoItemNormalizado
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemDonacionNormalizadoPatchDTO'
      responses:
        '200':
          description: Item normalizado actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDonacionNormalizadoOutputDTO'
        '400':
          description: Datos de actualización inválidos
        '404':
          description: Item normalizado no encontrado
  /api/personas:
    get:
      summary: Listar personas registradas
      description: >
        Una página de las personas que cumplen los filtros, por nombre (R11-01). Con `id` es una
        lectura por lote de esas personas.
      operationId: listarPersonasDonaciones
      parameters:
        - name: tipo
          in: query
          required: false
          schema: { type: string, enum: [HUMANA, JURIDICA] }
        - name: tipoJuridico
          in: query
          required: false
          schema: { type: string, enum: [GUBERNAMENTAL, ONG, EMPRESA, INSTITUCION] }
        - name: id
          in: query
          required: false
          description: Una o varias personas, repitiendo el parámetro; hasta 100. Un id que no existe no aparece.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          description: >-
            Contiene, sin distinguir mayúsculas ni tildes, en el nombre, el apellido, la razón
            social o el número de documento.
          schema: { type: string, maxLength: 100 }
        - name: orden
          in: query
          required: false
          description: Solo NOMBRE (por defecto).
          schema: { type: string, enum: [NOMBRE] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '400':
          description: Más de 100 `id`, tipo u orden desconocido, o paginado fuera de rango (ERR-CSR-003)
        '200':
          description: Página de personas
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonaOutputDTO' }
    post:
      summary: Crear persona
      operationId: crearPersonaDonaciones
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInputDTO' }
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaOutputDTO' }
        '400': { description: Datos de la persona inválidos }
  /api/personas/{id}:
    put:
      summary: Actualizar persona
      operationId: actualizarPersonaDonaciones
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInputDTO' }
      responses:
        '200':
          description: Persona actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaOutputDTO' }
        '400': { description: Datos de la persona inválidos }
        '404': { description: Persona no encontrada }
        '409': { description: La persona fue anonimizada y no se puede editar (PERSONA_ANONIMIZADA_NO_OPERABLE) }
    delete:
      summary: Eliminar persona
      operationId: eliminarPersonaDonaciones
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Persona eliminada }
        '404': { description: Persona no encontrada }
  /api/personas/{id}/legales:
    get:
      summary: Consultar la constancia de los legales de una persona
      description: >
        HB-20. Dice qué versión aceptó, cuándo, y si aceptó la vigente. Si no la aceptó, el sitio
        se la pide al entrar (alta por el administrador o por CSV, o versión nueva). La propia
        persona, el sitio con su token técnico o el administrador.
      operationId: consultarLegales
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Constancia de la persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalesDTO' }
        '403': { description: La persona no es la del token }
        '404': { description: Persona no encontrada }
    put:
      summary: Aceptar la versión vigente de los legales
      description: >
        HB-20. Guarda persona, versión y fecha, sin IP ni navegador. Idempotente: aceptar de nuevo la
        misma versión conserva la primera constancia. El sitio la llama al completar el perfil, con
        la casilla marcada; el alta de persona no la exige (ajuste del 2026-11-10 al ADR).
      operationId: aceptarLegales
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AceptarLegalesDTO' }
      responses:
        '200':
          description: Constancia guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalesDTO' }
        '400': { description: Falta la versión o no es la vigente (ERR-VAL-114) }
        '403': { description: La persona no es la del token }
        '404': { description: Persona no encontrada }
  /api/personas/{id}/solicitud-entidad:
    get:
      summary: Consultar la solicitud de entidad que espera la aprobación
      description: >
        R11-41. Lo que la cuenta envió al registrar su organización: razón social, rubro, tipo
        jurídico, dirección de entrega y quien la representa, con el correo del representante (solo
        lectura). La propia cuenta (con sesión y ese `personaId`, aunque todavía no tenga rol) o el
        administrador. Una jurídica está pendiente si no es entidad beneficiaria ni donante y no
        está anonimizada; si no, 409.
      operationId: consultarSolicitudEntidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudEntidadDTO' }
        '401': { description: Sin token }
        '403': { description: La persona no es la del token }
        '404': { description: Persona no encontrada }
        '409': { description: La persona no es una jurídica con la solicitud pendiente (ERR-EST-115) }
    put:
      summary: Corregir la solicitud de entidad que espera la aprobación
      description: >
        R11-41. Cambia solo la razón social, el rubro, el tipo jurídico, la dirección de entrega (el
        país, el piso y el departamento se conservan) y el nombre y el apellido del primer
        representante. El documento, los medios de contacto y los demás representantes no se tocan;
        `correo` se ignora. Publica la sincronización de la persona hacia Notificaciones. Mismo
        acceso que la lectura; si ya no está pendiente, 409 y no cambia nada.
      operationId: corregirSolicitudEntidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudEntidadDTO' }
      responses:
        '200':
          description: Lo guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudEntidadDTO' }
        '400': { description: Falta un dato o el tipo jurídico es EMPRESA; el detalle por campo va en `errors` }
        '401': { description: Sin token }
        '403': { description: La persona no es la del token }
        '404': { description: Persona no encontrada }
        '409': { description: La persona no es una jurídica con la solicitud pendiente (ERR-EST-115) }
  /api/logistica/proveedores:
    get:
      summary: Listar los proveedores de logística del broker
      description: Proveedores configurados, su transporte, si tienen adapter registrado y cuál es el preferido. Requiere la clave de administración.
      operationId: listarProveedoresLogistica
      security:
        - ApiKeyAdministracion: []
      responses:
        '200':
          description: Proveedores configurados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProveedorLogisticaDTO'
        '401': { description: Falta la clave de administración o es incorrecta }
  /api/logistica/proveedor-preferido:
    put:
      summary: Cambiar el proveedor de logística preferido
      description: Cambia en caliente el proveedor que el broker prueba primero. No persiste entre reinicios; vale para los despachos siguientes. Requiere la clave de administración.
      operationId: cambiarProveedorLogisticaPreferido
      security:
        - ApiKeyAdministracion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciaProveedorRequestDTO'
      responses:
        '200':
          description: Proveedores con el preferido actualizado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProveedorLogisticaDTO'
        '400': { description: Proveedor vacío o no configurado }
        '401': { description: Falta la clave de administración o es incorrecta }
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Número de página, desde 0. Por defecto 0 (R11-01).
      schema:
        type: integer
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      description: Tamaño de página. Por defecto 20; nunca se devuelve la lista completa (R11-01).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Q:
      name: q
      in: query
      required: false
      description: >-
        Texto buscado: "contiene", sin distinguir mayúsculas ni tildes ("gomez" encuentra
        "Gómez"). Vacío es lo mismo que no mandarlo. Hasta 100 caracteres.
      schema:
        type: string
        maxLength: 100
    CategoriaDeLaEntidad:
      name: categoriaId
      in: query
      required: false
      description: >-
        Desde 1.10.0 (R11-12). Solo las entidades con al menos una necesidad activa y no vencida
        (sin fecha límite o con fecha límite desde hoy) de una subcategoría de esa categoría. No
        descuenta lo ya asignado. Una categoría que no existe no da error: no coincide ninguna.
      schema:
        type: string
        format: uuid
  headers:
    XTotalCount:
      description: Cantidad que cumple los filtros, sin contar la paginación (R11-01).
      schema:
        type: integer
        minimum: 0
  schemas:
    AccionDeAdministracion:
      type: string
      description: >
        Desde 1.11.0 (R11-26). Las nueve primeras las registra Donaciones; las cinco últimas las
        anota el sitio con `POST /api/actividad`.
      enum:
        - PROPUESTA_APROBADA
        - PROPUESTA_DESCARTADA
        - ASIGNACION_CORRIDA
        - DONACION_REGISTRADA
        - DONACION_VENCIDA
        - DONANTE_REGISTRADO
        - IMPORTACION_SUBIDA
        - ORGANIZACION_APROBADA
        - ORGANIZACION_REGISTRADA
        - ADMINISTRADOR_DADO_DE_ALTA
        - CONTRASENA_PROVISORIA_NUEVA
        - CAMION_AGREGADO
        - CAMION_DESHABILITADO
        - CAMION_HABILITADO
    ActividadResponse:
      type: object
      description: >
        Una acción de administración (R11-26). `detalle` es un rótulo sin datos de una persona
        humana: la razón social de la organización (propuestas y organizaciones) o del donante
        persona jurídica, el nombre del archivo importado, la patente del camión o la cantidad de
        propuestas nuevas de una asignación.
      required: [id, ocurrioEn, autor, accion]
      properties:
        id: { type: string, format: uuid }
        ocurrioEn:
          type: string
          format: date-time
          description: Hora local de Argentina, sin zona (como `fechaAlta`).
        autor:
          type: string
          description: El `sub` del token de quien hizo la acción.
        accion:
          $ref: '#/components/schemas/AccionDeAdministracion'
        objetoId:
          type: string
          nullable: true
          description: >
            Lo que tocó: la propuesta, la ejecución de la asignación, la donación, el donante, el
            archivo, la organización, el `sub` de la cuenta o el id del camión.
        detalle:
          type: string
          nullable: true
          maxLength: 200
    AnotacionActividad:
      type: object
      required: [accion, objetoId]
      properties:
        accion:
          type: string
          enum:
            - ADMINISTRADOR_DADO_DE_ALTA
            - CONTRASENA_PROVISORIA_NUEVA
            - CAMION_AGREGADO
            - CAMION_DESHABILITADO
            - CAMION_HABILITADO
        objetoId:
          type: string
          maxLength: 64
          description: El `sub` de la cuenta o el id del camión.
        detalle:
          type: string
          maxLength: 20
          description: Para los camiones, la patente. Para las cuentas, no se acepta.
    EntidadBeneficiariaInput:
      type: object
      required: [juridicaId]
      properties:
        juridicaId: { type: string, format: uuid }
        origen:
          type: string
          enum: [SOLICITUD, ADMIN]
          description: >
            Desde 1.11.0 (R11-26), opcional: `SOLICITUD` al aprobar la solicitud de una
            organización; `ADMIN` (por defecto) al registrarla la administración. Solo cambia la
            acción que queda en el registro de actividad.
    ConteosDeEntidadDTO:
      type: object
      description: Las cifras de una organización (R11-43), contadas por el servicio.
      properties:
        porEstado:
          type: array
          description: Los 8 estados, siempre, en el orden del ciclo de vida, con 0 si no hay.
          items:
            $ref: '#/components/schemas/ConteoPorEstado'
        entregadasEnElMes:
          type: object
          properties:
            mes: { type: string, example: '2026-11', description: 'AAAA-MM' }
            cantidad: { type: integer, format: int64 }
        porNecesidad:
          type: array
          description: Solo las necesidades con alguna asignada; en cada una, los estados con alguna.
          items:
            type: object
            properties:
              necesidadId: { type: string, format: uuid }
              porEstado:
                type: array
                items:
                  $ref: '#/components/schemas/ConteoPorEstado'
    ConteoPorEstado:
      type: object
      properties:
        estado:
          type: string
          enum:
            - EN_DEPOSITO
            - ASIGNACION_REALIZADA
            - EN_TRASLADO
            - EN_PUERTA
            - LISTA_PARA_ENTREGAR
            - ENTREGADA
            - ENTREGA_FALLIDA
            - VENCIDA
        cantidad: { type: integer, format: int64 }
    PropuestaDTO:
      type: object
      description: Propuesta de asignación de donaciones a una necesidad.
      properties:
        id: { type: string, format: uuid }
        estado:
          type: string
          enum: [PENDIENTE, APROBADA, DESCARTADA]
        fechaCreacion: { type: string, format: date-time }
        necesidad:
          type: object
          nullable: true
          description: >-
            Resumen de la necesidad que satisface. Desde 1.10.0 (R11-24) suma `entidadId`,
            `entidadNombre` y `unidad`.
        fragmentaciones:
          type: array
          items:
            type: object
            description: >-
              Donación independiente y cantidad que aporta. Desde 1.10.0 (R11-24) suma
              `disponible` (lo que queda en el depósito) y `pedidaEnOtras` (lo que piden de ella
              las otras pendientes) y `otrasPropuestas` (cuántas otras pendientes la piden).
        decididaPor:
          type: string
          nullable: true
          description: >
            Desde 1.10.0 (R11-10). Id de la cuenta que la aprobó o descartó (el `sub` del token);
            "SISTEMA" si se decidió sin cuenta; `null` mientras está pendiente o si se decidió
            antes de este cambio. No es un nombre: quien lo muestra lo traduce.
        fechaDecision:
          type: string
          format: date-time
          nullable: true
          description: Desde 1.10.0 (R11-10). Cuándo se aprobó o descartó; `null` si no se sabe.
        sugeridaPor:
          type: array
          description: >
            Desde 1.10.0 (R11-24). Qué algoritmo la sugirió y en qué puesto de su lista de esa
            corrida. Vacío si se generó antes de este cambio. Si la sugirieron los dos, la que
            tiene `eligioLasDonaciones` en true es la del algoritmo cuyas donaciones quedaron.
          items:
            $ref: '#/components/schemas/SugerenciaDTO'
        situacion:
          type: string
          nullable: true
          enum: [LIBRE, EN_CONFLICTO, SIN_STOCK]
          description: Desde 1.10.0 (R11-24). Solo en pendientes listadas; `null` en el resto.
        otrasPendientesMismaNecesidad:
          type: integer
          minimum: 0
          description: Desde 1.10.0 (R11-24). Otras pendientes para la misma necesidad.
    SugerenciaDTO:
      type: object
      description: Desde 1.10.0 (R11-24). Un algoritmo que sugirió la propuesta.
      properties:
        algoritmo: { type: string, enum: [COMPATIBILIDAD_SEMANTICA, PRIORIDAD_SUBATENDIDOS] }
        puesto: { type: integer, minimum: 1, description: 1 es la primera de su lista. }
        deCuantas: { type: integer, minimum: 1, description: Cuántas propuso en esa corrida. }
        eligioLasDonaciones: { type: boolean }
    ResumenPropuestasDTO:
      type: object
      description: Desde 1.10.0 (R11-24). Pendientes en total y por situación.
      properties:
        pendientes: { type: integer, minimum: 0 }
        libres: { type: integer, minimum: 0 }
        enConflicto: { type: integer, minimum: 0 }
        sinStock: { type: integer, minimum: 0 }
    DonacionEnPropuestasDTO:
      type: object
      description: Desde 1.10.0 (R11-24). Una donación pedida por al menos una pendiente.
      properties:
        donacionIndependiente:
          $ref: '#/components/schemas/DonacionIndependienteResponseDTO'
        disponible: { type: integer, minimum: 0, description: Lo que queda en el depósito. }
        pedidaEnPendientes: { type: integer, minimum: 0 }
        propuestasPendientes: { type: integer, minimum: 0 }
        alcanza: { type: boolean, description: '`pedidaEnPendientes` no supera `disponible`.' }
    ResumenAdminDTO:
      type: object
      description: Cifras del inicio del administrador (R11-01), cada una contada en la base.
      required:
        - donacionesPorEstado
        - entregadasEnElMes
        - porVencer
        - donantes
        - entidadesActivas
        - propuestasPendientes
        - calculadoEn
      properties:
        donacionesPorEstado:
          type: object
          description: Cuántas donaciones independientes hay en cada estado; los 8 siempre presentes, con 0 si no hay.
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          example:
            EN_DEPOSITO: 12
            ASIGNACION_REALIZADA: 3
            EN_TRASLADO: 1
            EN_PUERTA: 0
            LISTA_PARA_ENTREGAR: 2
            ENTREGADA: 30
            ENTREGA_FALLIDA: 0
            VENCIDA: 1
        entregadasEnElMes:
          type: object
          required: [mes, cantidad]
          properties:
            mes: { type: string, description: 'Mes en curso, AAAA-MM', example: '2026-11' }
            cantidad:
              type: integer
              format: int64
              minimum: 0
              description: Las que pasaron a ENTREGADA en el mes
        porVencer:
          type: object
          required: [dias, cantidad]
          properties:
            dias: { type: integer, description: 'Cuántos días adelante mira, desde hoy' }
            cantidad:
              type: integer
              format: int64
              minimum: 0
              description: Las que siguen en depósito con algún bien que vence en esos días
            proxima:
              type: object
              nullable: true
              description: La de vencimiento más cercano; null si no hay ninguna
              properties:
                id: { type: string, format: uuid }
                descripcion: { type: string }
                fechaVencimiento: { type: string, format: date }
        donantes:
          type: object
          required: [total, activos]
          properties:
            total: { type: integer, format: int64, minimum: 0 }
            activos: { type: integer, format: int64, minimum: 0 }
        entidadesActivas: { type: integer, format: int64, minimum: 0 }
        propuestasPendientes:
          type: integer
          format: int64
          minimum: 0
          description: Propuestas de asignación que esperan respuesta
        calculadoEn: { type: string, format: date-time }
    DonanteOutputDTO:
      type: object
      required: [idDonante, activo, mostrarNombre]
      properties:
        idDonante: { type: string, format: uuid, description: Es el id de su persona }
        persona: { $ref: '#/components/schemas/PersonaOutputDTO' }
        activo: { type: boolean }
        mostrarNombre: { type: boolean, description: HB-20 }
        fechaAlta:
          type: string
          format: date-time
          description: >-
            Desde 1.9.0 (R11-01): primer registro como donante; una reactivación no la cambia. Los
            donantes previos a la migración V21 tienen la fecha de la migración.
    ContadoresPublicosDTO:
      type: object
      description: Contadores públicos de la landing (HB-02).
      required: [donantesActivos, donacionesRealizadas, beneficiariosActivos, calculadoEn]
      properties:
        donantesActivos:
          type: integer
          format: int64
          minimum: 0
        donacionesRealizadas:
          type: integer
          format: int64
          minimum: 0
        beneficiariosActivos:
          type: integer
          format: int64
          minimum: 0
        calculadoEn:
          type: string
          format: date-time
          description: Momento del cálculo, con su desplazamiento horario
    DonacionDestacadaDTO:
      type: object
      description: Donación destacada de la landing (HB-01). Sin datos del donante.
      required: [id, cantidad, fechaEntrega, fotos]
      properties:
        id:
          type: string
          format: uuid
        categoria:
          type: string
          nullable: true
        subcategoria:
          type: string
          nullable: true
        cantidad:
          type: integer
          minimum: 1
        unidad:
          type: string
          nullable: true
          description: Unidad de la categoría
        entidadId:
          type: string
          format: uuid
          nullable: true
        entidad:
          type: string
          nullable: true
          description: Razón social de la entidad que la recibió
        fechaEntrega:
          type: string
          format: date-time
          description: En UTC, como la manda Logística
        fotos:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
          description: URLs estables de las fotos de recepción, en el orden de la entrega
    EntidadPublicaDTO:
      type: object
      description: Entidad beneficiaria para rutas públicas (D26).
      properties:
        id:
          type: string
          format: uuid
        razonSocial:
          type: string
        rubro:
          type: string
    EntidadParaDonanteDTO:
      type: object
      description: >
        Una entidad activa vista por un donante (R11-12): lo de `EntidadPublicaDTO` y si ese donante
        ya le donó.
      required: [id, razonSocial, yaLeDono]
      properties:
        id:
          type: string
          format: uuid
        razonSocial:
          type: string
        rubro:
          type: string
        yaLeDono:
          type: boolean
          description: Alguna donación de ese donante quedó asignada a la entidad, en cualquier estado.
    Unidad:
      type: string
      enum: [UNIDADES, KILOGRAMO, LITROS, METRO, METRO_CUADRADO, METRO_CUBICO]
    EstadoNecesidad:
      type: string
      description: >
        Calculado en cada lectura (HB-18). `VIGENTE`: activa y, si es extraordinaria, sin cumplir ni
        vencer. `CUMPLIDA`: extraordinaria cuyo recibido llegó a la cantidad. `TERMINADA`:
        extraordinaria con la fecha límite pasada sin cumplirse. `DADA_DE_BAJA`: la entidad la dio de
        baja. Una recurrente solo está `VIGENTE` o `DADA_DE_BAJA`.
      enum: [VIGENTE, CUMPLIDA, TERMINADA, DADA_DE_BAJA]
    NecesidadDTO:
      type: object
      description: >
        Entrada y salida de `/api/necesidades` (HB-18, ADR 20261102). `estaSatisfecha`, `estado`,
        `unidad` y `ultimoCambio` son solo de salida: si llegan, se ignoran. `fechaFin` está
        deprecado como entrada (se ignora); en la salida es el fin del período en curso.
      required: [tipo, idSubcategoria, cantidadNecesitada, descripcion]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [EXTRAORDINARIA, RECURRENTE]
        idEntidad:
          type: string
          format: uuid
        idSubcategoria:
          type: string
          format: uuid
        cantidadNecesitada:
          type: integer
          minimum: 1
        descripcion:
          type: string
        estaSatisfecha:
          type: boolean
          description: Solo salida. Lo asignado (al período en curso, en las recurrentes) llegó a la cantidad.
        fechaInicio:
          type: string
          format: date
          nullable: true
          description: Día de la publicación. En una recurrente se puede mandar (no futura); si falta, hoy.
        fechaFin:
          type: string
          format: date
          nullable: true
          deprecated: true
          description: Deprecado como entrada. En la salida, el fin del período en curso de una recurrente.
        estado:
          $ref: '#/components/schemas/EstadoNecesidad'
        version:
          type: integer
          format: int64
          nullable: true
          description: Versión de la fila. En el `PUT`, si llega y no coincide, responde 409.
        fechaLimite:
          type: string
          format: date
          nullable: true
          description: Obligatoria y posterior a hoy al crear una `EXTRAORDINARIA`. Nula en las creadas antes de exigirla y en las recurrentes.
        periodicidad:
          type: string
          enum: [SEMANAL, QUINCENAL, MENSUAL]
          nullable: true
          description: Obligatoria al crear una `RECURRENTE` (7 días, 15 días o un mes). Nula en la salida de una recurrente creada antes con otro largo.
        unidad:
          type: string
          enum: [UNIDADES, KILOGRAMO, LITROS, METRO, METRO_CUADRADO, METRO_CUBICO]
          nullable: true
          description: Solo salida. La unidad de su subcategoría.
        ultimoCambio:
          type: object
          nullable: true
          description: Solo salida. El último cambio de cantidad; en una recurrente, solo mientras dure el período en que se hizo.
          properties:
            cantidadAnterior:
              type: integer
            fecha:
              type: string
              format: date
    PeriodoNecesidadDTO:
      type: object
      required: [id, inicio, fin, objetivo, asignado, recibido, resultado]
      properties:
        id:
          type: string
          format: uuid
        inicio:
          type: string
          format: date
        fin:
          type: string
          format: date
        objetivo:
          type: integer
        asignado:
          type: integer
          description: Las donaciones con destino en el período.
        recibido:
          type: integer
          description: Las donaciones del período que llegaron (`ENTREGADA`).
        resultado:
          type: string
          enum: [EN_CURSO, CUMPLIDO, INCOMPLETO]
          description: '`CUMPLIDO` apenas lo recibido llega al objetivo, también en el período en curso.'
    NecesidadPublicaDTO:
      type: object
      description: Necesidad vigente para rutas públicas (D26). `fechaFin` es el fin del período actual en las recurrentes y nulo en las extraordinarias.
      properties:
        id:
          type: string
          format: uuid
        idEntidad:
          type: string
          format: uuid
        idSubcategoria:
          type: string
          format: uuid
        descripcion:
          type: string
        cantidadNecesitada:
          type: integer
        tipo:
          type: string
          enum:
            - EXTRAORDINARIA
            - RECURRENTE
        fechaFin:
          type: string
          format: date
          nullable: true
    SolicitudSubidaFotoInputDTO:
      type: object
      required: [tipoContenido]
      properties:
        tipoContenido:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    SubidaFotoOutputDTO:
      type: object
      required: [uploadUrl, metodo, tipoContenido, referencia, expiraEn]
      properties:
        uploadUrl:
          type: string
          description: URL prefirmada de MinIO; no requiere credenciales
        metodo:
          type: string
          enum: [PUT]
        tipoContenido:
          type: string
          description: Valor del header Content-Type a enviar en la subida
        referencia:
          type: string
          example: /fotos-bienes/3f2b9c1e-7a4d-4e8f-9b0a-1c2d3e4f5a6b.jpg
        expiraEn:
          type: string
          format: date-time
    ArchivoDonantesResponse:
      type: object
      required: [id, path, estado, procesadas, creadas, actualizadas, conError]
      properties:
        id: { type: string, format: uuid }
        path:
          type: string
          description: Clave del padrón en el bucket donaciones-padrones (UUID.csv), no una ruta de disco
        estado:
          type: string
          enum: [PENDIENTE, PROCESANDO, PROCESADO, PROCESADO_CON_ERRORES, ERROR]
        totalFilas:
          type: integer
          nullable: true
          description: >
            Filas del padrón sin el encabezado ni las líneas en blanco (HB-14). Null hasta que
            el servicio lee el padrón.
        procesadas:
          type: integer
          description: Filas ya resueltas; es creadas + actualizadas + conError (HB-14)
        creadas:
          type: integer
          description: Filas que dieron de alta una persona y su donante (HB-14)
        actualizadas:
          type: integer
          description: Filas que actualizaron una persona existente (HB-14)
        conError:
          type: integer
          description: >
            Filas que no se importaron, también las mal formadas (HB-14). El detalle está en
            GET /api/donantes/archivos/{id}/filas-con-error
        ultimos:
          type: array
          maxItems: 5
          description: >
            Desde 1.9.0 (R11-01): los últimos donantes procesados, el más reciente primero, para
            mostrar el avance. Se guardan con el progreso, de a 500 filas. Vacío al empezar.
          items:
            type: object
            required: [nombre, resultado]
            properties:
              nombre:
                type: string
                description: Razón social, o apellido y nombre, tal como vino en el padrón
              resultado:
                type: string
                enum: [NUEVO, ACTUALIZADO]
        nombre:
          type: string
          nullable: true
          maxLength: 255
          description: >
            Desde 1.10.0 (R11-20): el nombre con que se subió el archivo, sin la ruta del
            navegador. Null en las importaciones anteriores a 1.10.0.
        subidoEn:
          type: string
          format: date-time
          nullable: true
          description: >
            Desde 1.10.0 (R11-20): cuándo se subió, en la hora local de Argentina y sin zona (como
            `fechaAlta` del donante), por ejemplo 2026-10-15T18:02:00. Null en las importaciones
            anteriores a 1.10.0.
    FilaConErrorResponse:
      type: object
      required: [linea, motivo]
      properties:
        linea:
          type: integer
          description: Línea del CSV, contando el encabezado como línea 1
        motivo:
          type: string
          enum: [FORMATO_INVALIDO, DATOS_INVALIDOS, DONANTE_DADO_DE_BAJA, PERSONA_DUPLICADA_EN_CONFLICTO, ERROR_INESPERADO]
        codigo:
          type: string
          nullable: true
          description: Código del catálogo de errores (por ejemplo ERR-EST-113), si la causa lo trae
    # Personas (DTI-27, ítem 3): PersonaInputDTO y PersonaOutputDTO son polimórficos por "tipo"
    # (HumanaInputDTO/JuridicaInputDTO y sus Output). Los campos opcionales de salida admiten null.
    PersonaInputDTO:
      oneOf:
        - $ref: '#/components/schemas/HumanaInputDTO'
        - $ref: '#/components/schemas/JuridicaInputDTO'
    HumanaInputDTO:
      type: object
      required: [tipo, nombre, apellido]
      properties:
        tipo: { type: string, enum: [HUMANA] }
        tipoDocumento: { type: string, enum: [DNI, PASAPORTE, LIBRETA, CUIT], nullable: true }
        documento: { type: string, nullable: true }
        direccion: { $ref: '#/components/schemas/DireccionInputDTO' }
        mediosDeContacto:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/MedioDeContactoInputDTO' }
        nombre: { type: string, minLength: 1 }
        apellido: { type: string, minLength: 1 }
        genero: { type: string, enum: [PREFIERO_NO_DECIR, HOMBRE, MUJER, NO_BINARIO], nullable: true }
        fechaNacimiento: { type: string, format: date, nullable: true }
    JuridicaInputDTO:
      type: object
      required: [tipo, razonSocial, tipoJuridico]
      properties:
        tipo: { type: string, enum: [JURIDICA] }
        tipoDocumento: { type: string, enum: [DNI, PASAPORTE, LIBRETA, CUIT], nullable: true }
        documento: { type: string, nullable: true }
        direccion: { $ref: '#/components/schemas/DireccionInputDTO' }
        mediosDeContacto:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/MedioDeContactoInputDTO' }
        razonSocial: { type: string, minLength: 1 }
        tipoJuridico: { type: string, enum: [GUBERNAMENTAL, ONG, EMPRESA, INSTITUCION] }
        rubro: { type: string, nullable: true }
        representantes:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/HumanaInputDTO' }
    PersonaOutputDTO:
      oneOf:
        - $ref: '#/components/schemas/HumanaOutputDTO'
        - $ref: '#/components/schemas/JuridicaOutputDTO'
    HumanaOutputDTO:
      type: object
      required: [tipo, id]
      properties:
        tipo: { type: string, enum: [HUMANA] }
        id: { type: string, format: uuid }
        tipoDocumento: { type: string, enum: [DNI, PASAPORTE, LIBRETA, CUIT], nullable: true }
        documento: { type: string, nullable: true }
        direccion: { $ref: '#/components/schemas/DireccionOutputDTO' }
        mediosDeContacto:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/MedioDeContactoOutputDTO' }
        nombre: { type: string, nullable: true }
        apellido: { type: string, nullable: true }
        genero: { type: string, enum: [PREFIERO_NO_DECIR, HOMBRE, MUJER, NO_BINARIO], nullable: true }
        fechaNacimiento: { type: string, format: date, nullable: true }
    JuridicaOutputDTO:
      type: object
      required: [tipo, id]
      properties:
        tipo: { type: string, enum: [JURIDICA] }
        id: { type: string, format: uuid }
        tipoDocumento: { type: string, enum: [DNI, PASAPORTE, LIBRETA, CUIT], nullable: true }
        documento: { type: string, nullable: true }
        direccion: { $ref: '#/components/schemas/DireccionOutputDTO' }
        mediosDeContacto:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/MedioDeContactoOutputDTO' }
        razonSocial: { type: string, nullable: true }
        tipoJuridico: { type: string, enum: [GUBERNAMENTAL, ONG, EMPRESA, INSTITUCION], nullable: true }
        rubro: { type: string, nullable: true }
        representantes:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/HumanaOutputDTO' }
    DireccionInputDTO:
      type: object
      nullable: true
      required: [calle, localidad, provincia, pais]
      properties:
        calle: { type: string, minLength: 1 }
        altura: { type: integer, minimum: 1, nullable: true }
        piso: { type: integer, nullable: true }
        departamento: { type: string, nullable: true }
        codigoPostal: { type: string, nullable: true }
        localidad: { type: string, minLength: 1 }
        provincia: { type: string, minLength: 1 }
        pais: { type: string, minLength: 1 }
    DireccionOutputDTO:
      type: object
      nullable: true
      properties:
        calle: { type: string, nullable: true }
        altura: { type: integer, nullable: true }
        piso: { type: integer, nullable: true }
        departamento: { type: string, nullable: true }
        codigoPostal: { type: string, nullable: true }
        localidad: { type: string, nullable: true }
        provincia: { type: string, nullable: true }
        pais: { type: string, nullable: true }
    MedioDeContactoInputDTO:
      type: object
      description: CORREO exige direccionCorreo; TELEFONO y WHATSAPP exigen numero.
      required: [tipo]
      properties:
        tipo: { type: string, enum: [CORREO, TELEFONO, WHATSAPP] }
        esPredeterminado: { type: boolean, nullable: true }
        direccionCorreo: { type: string, format: email, nullable: true }
        caracteristica: { type: string, nullable: true }
        codigoArea: { type: string, nullable: true }
        numero: { type: string, nullable: true }
    MedioDeContactoOutputDTO:
      type: object
      description: Sin formato de correo en la salida; una persona anonimizada (DTI-01) devuelve "ANONIMIZADO" en sus datos personales.
      required: [tipo]
      properties:
        tipo: { type: string, enum: [CORREO, TELEFONO, WHATSAPP] }
        esPredeterminado: { type: boolean, nullable: true }
        direccionCorreo: { type: string, nullable: true }
        caracteristica: { type: string, nullable: true }
        codigoArea: { type: string, nullable: true }
        numero: { type: string, nullable: true }
    CambioEstadoDonacionIndependienteRequestDTO:
      type: object
      required:
        - estado
      properties:
        estado:
          type: string
          enum:
            - EN_DEPOSITO
            - ASIGNACION_REALIZADA
            - EN_TRASLADO
            - EN_PUERTA
            - LISTA_PARA_ENTREGAR
            - ENTREGADA
            - ENTREGA_FALLIDA
            - VENCIDA
        justificacion: { type: string }
        necesidadId: { type: string, format: uuid }
        urlMapa:
          type: string
          description: Obligatoria si el estado es EN_TRASLADO (400 ERR-VAL-415); la exige el evento donacion.en-camino.v1
        patenteCamion:
          type: string
          description: Obligatoria si el estado es ENTREGADA (400 ERR-VAL-416); la exige el evento donacion.recibida.v1
        replanificable: { type: boolean }
    DonacionIndependienteResponseDTO:
      type: object
      required:
        - id
        - donacionOriginalId
        - estadoActual
        - fechaRegistro
      properties:
        id:
          type: string
          format: uuid
        donacionOriginalId:
          type: string
          format: uuid
        descripcion:
          type: string
        estadoActual:
          type: string
          enum:
            - EN_DEPOSITO
            - ASIGNACION_REALIZADA
            - EN_TRASLADO
            - EN_PUERTA
            - LISTA_PARA_ENTREGAR
            - ENTREGADA
            - ENTREGA_FALLIDA
            - VENCIDA
        fechaRegistro:
          type: string
          format: date-time
        historial:
          type: array
          items:
            type: object
        items:
          type: array
          items:
            type: object
        cantidad:
          type: integer
        entidadBeneficiariaId:
          type: string
          format: uuid
          nullable: true
          description: Entidad a la que se asignó la donación; null mientras no tiene destino
        necesidadId:
          type: string
          format: uuid
          nullable: true
          description: Necesidad a la que se asignó la donación (HB-17, DTI-29); null mientras no tiene destino o si se asignó sin necesidad
        cancelacionPedida:
          type: boolean
          description: >-
            HB-19: su necesidad se dio de baja y se espera que el proveedor de logística confirme la
            cancelación de la entrega; mientras tanto la donación sigue asignada ("vuelve al
            depósito"). Se limpia al volver al depósito o si la entrega sale antes.
        quienDono:
          type: object
          nullable: true
          description: >
            Quién donó, sin documento, dirección ni contactos (HB-20, ADR 20261102). Lo lee la
            entidad en sus donaciones recibidas. null solo si la donación original, su donante o su
            persona ya no existen.
          required:
            - tipo
            - donanteId
          properties:
            tipo:
              type: string
              enum: [PERSONA, EMPRESA]
            nombreVisible:
              type: string
              nullable: true
              description: >
                "Nombre Apellido" o la razón social; null si el donante lo ocultó en su perfil o en
                esa donación, o si fue anonimizado
            donanteId:
              type: string
              format: uuid
              description: >
                Va también con el nombre oculto: el cliente liviano lo usa del lado del servidor
                para pedir la categoría a Incentivos y nunca lo escribe en el HTML
    PreferenciasDonanteDTO:
      type: object
      required: [mostrarNombre]
      properties:
        mostrarNombre:
          type: boolean
          description: Si la entidad que recibe sus donaciones ve su nombre (por defecto, true)
    AceptarLegalesDTO:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: Versión de los legales que se acepta; tiene que ser la vigente
    SolicitudEntidadDTO:
      type: object
      required: [razonSocial, rubro, tipoJuridico, direccion, representante]
      properties:
        razonSocial: { type: string }
        rubro: { type: string, description: 'Qué es la organización (por ejemplo, Merendero)' }
        tipoJuridico: { type: string, enum: [ONG, INSTITUCION, GUBERNAMENTAL], description: 'EMPRESA responde 400' }
        direccion:
          type: object
          required: [calle, altura, codigoPostal, localidad, provincia]
          properties:
            calle: { type: string }
            altura: { type: integer, minimum: 1 }
            codigoPostal: { type: string }
            localidad: { type: string }
            provincia: { type: string }
        representante:
          type: object
          required: [nombre, apellido]
          properties:
            nombre: { type: string }
            apellido: { type: string }
        correo: { type: string, description: 'Del representante; solo de lectura (se ignora al corregir)' }
    LegalesDTO:
      type: object
      required: [versionVigente, vigenteAceptada]
      properties:
        versionAceptada:
          type: integer
          nullable: true
          description: La versión más alta que aceptó; null si nunca aceptó
        aceptadaEn:
          type: string
          format: date-time
          nullable: true
        versionVigente:
          type: integer
        vigenteAceptada:
          type: boolean
    DonacionInputDTO:
      type: object
      required:
        - donanteId
        - descripcion
        - items
      properties:
        donanteId:
          type: string
          format: uuid
        descripcion:
          type: string
          description: >
            Descripción general de lo que se dona. Obligatoria (400 si falta o está vacía). Cambio
            no aditivo del contrato (D-32): antes era opcional y la base la exige NOT NULL.
        mostrarNombre:
          type: boolean
          nullable: true
          description: >
            HB-20, "Esta vez, sin mi nombre". false oculta el nombre del donante en esta donación;
            null o true siguen a su perfil (nunca muestra lo que el perfil oculta)
        items:
          type: array
          items:
            type: object
            properties:
              fotoUrl:
                type: string
                nullable: true
                description: >
                  Referencia devuelta por POST /api/donaciones/fotos (/fotos-bienes/<uuid>.<ext>),
                  después de subir la foto con la uploadUrl. Al cargar la donación se verifica que
                  la foto exista y respete tipo y tamaño (400 ERR-VAL-319, 320, 318 o 321). Una URL
                  externa se acepta sin cambios. Al leer, la referencia se devuelve como URL
                  temporal de descarga (2 h).
    DonacionOutputDTO:
      type: object
      required:
        - id
        - donanteId
      properties:
        id:
          type: string
          format: uuid
        donanteId:
          type: string
          format: uuid
        descripcion:
          type: string
    AliasSubcategoriaInputDTO:
      type: object
      required:
        - alias
      properties:
        alias:
          type: string
    SubcategoriaOutputDTO:
      type: object
      required:
        - id
        - nombre
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        categoria:
          type: object
        aliases:
          type: array
          items:
            type: object
        unidad:
          allOf:
            - $ref: '#/components/schemas/Unidad'
          description: La unidad en que se pide (HB-18). La propia de la subcategoría o, si no tiene, la de su categoría.
    ItemDonacionNormalizadoOutputDTO:
      type: object
      required:
        - id
        - donacionOriginalId
        - estadoNormalizacion
      properties:
        id:
          type: string
          format: uuid
        donacionOriginalId:
          type: string
          format: uuid
        descripcionBienOriginal:
          type: string
        cantidad:
          type: integer
        subcategoria:
          $ref: '#/components/schemas/SubcategoriaOutputDTO'
        confianza:
          type: number
          format: double
        estadoNormalizacion:
          type: string
          enum:
            - PENDIENTE_REVISION
            - ACEPTADO
            - RECHAZADO
        segmentado:
          type: boolean
    ItemDonacionNormalizadoPatchDTO:
      type: object
      required:
        - estadoNormalizacion
      properties:
        estadoNormalizacion:
          type: string
          enum:
            - PENDIENTE_REVISION
            - ACEPTADO
            - RECHAZADO
        subcategoriaId:
          type: string
          format: uuid
    ProveedorLogisticaDTO:
      type: object
      required:
        - id
        - transporte
        - disponible
        - preferido
      properties:
        id: { type: string }
        transporte:
          type: string
          description: Transporte configurado (amqp, http); vacío si no tiene
        disponible:
          type: boolean
          description: Tiene adapter registrado; si no, sus pedidos se tratan como rechazados
        preferido: { type: boolean }
    PreferenciaProveedorRequestDTO:
      type: object
      required:
        - proveedorId
      properties:
        proveedorId: { type: string }
  securitySchemes:
    ApiKeyAdministracion:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave de administración del broker (LOGISTICA_ADMIN_API_KEY)