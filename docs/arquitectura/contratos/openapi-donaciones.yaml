openapi: 3.0.3
info:
  title: DonaTrack - Donaciones Service API
  version: 1.0.0
  description: API REST para gestión de donaciones independientes (máquina de 7 estados), necesidades de entidades beneficiarias, donantes y propuestas de asignación algorítmica.
servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo
paths:
  /donaciones-independientes:
    get:
      summary: Listar donaciones independientes con filtros
      operationId: listarDonacionesIndependientes
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - EN_DEPOSITO
              - ASIGNACION_REALIZADA
              - EN_TRASLADO
              - LISTA_PARA_ENTREGAR
              - ENTREGADA
              - ENTREGA_FALLIDA
              - VENCIDA
        - name: subcategoriaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: donanteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de donaciones independientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonacionIndependienteResponseDTO'
  /donaciones-independientes/{id}:
    get:
      summary: Consultar donación independiente por ID
      operationId: obtenerDonacionIndependientePorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la donación independiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionIndependienteResponseDTO'
        '404':
          description: Donación independiente no encontrada
  /donaciones-independientes/{id}/estado:
    patch:
      summary: Transicionar estado de la donación independiente (State Pattern)
      operationId: cambiarEstadoDonacionIndependiente
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Actor
          in: header
          required: true
          schema: { type: string }
          description: Identificador del actor o sistema que ejecuta la transición
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoDonacionIndependienteRequestDTO'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionIndependienteResponseDTO'
        '400':
          description: Transición inválida para el estado actual
        '409':
          description: Otra operación guardó la donación después de que se leyó (DONACION_INDEPENDIENTE_MODIFICADA_CONCURRENTEMENTE, bloqueo optimista); releer y reintentar
  /api/donaciones:
    post:
      summary: Registrar donación (donación general con ítems)
      operationId: registrarDonacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonacionInputDTO'
      responses:
        '201':
          description: Donación creada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionOutputDTO'
        '409':
          description: El donante está dado de baja (DONANTE_INACTIVO)
        '400':
          description: Datos de donación inválidos, incluida la falta de descripción (obligatoria desde la persistencia en PostgreSQL, D-32)
    get:
      summary: Listar donaciones
      operationId: listarDonaciones
      responses:
        '200':
          description: Listado de donaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonacionOutputDTO'
  /api/donaciones/{id}:
    get:
      summary: Consultar donación por ID
      operationId: obtenerDonacionPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la donación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonacionOutputDTO'
        '404':
          description: Donación no encontrada
  /api/necesidades:
    post:
      summary: Registrar necesidad de entidad beneficiaria
      operationId: registrarNecesidad
      responses:
        '201':
          description: Necesidad registrada
        '409':
          description: La entidad beneficiaria está dada de baja (ENTIDAD_BENEFICIARIA_INACTIVA)
    get:
      summary: Listar necesidades activas
      operationId: listarNecesidades
      parameters:
        - name: entidadId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: tipo
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Listado de necesidades
  /api/necesidades/{id}:
    get:
      summary: Consultar necesidad por ID
      operationId: obtenerNecesidadPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la necesidad
        '404':
          description: Necesidad no encontrada
    put:
      summary: Actualizar necesidad existente
      operationId: actualizarNecesidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Necesidad actualizada
        '400':
          description: Datos inválidos
        '404':
          description: Necesidad no encontrada
        '409':
          description: Otra operación guardó la necesidad después de que se leyó (NECESIDAD_MODIFICADA_CONCURRENTEMENTE, bloqueo optimista); releer y reintentar
    delete:
      summary: Baja de necesidad
      operationId: eliminarNecesidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Necesidad eliminada exitosamente
        '404':
          description: Necesidad no encontrada
  /api/asignaciones/ejecuciones:
    post:
      summary: Ejecutar algoritmo de asignación y generar propuestas
      operationId: ejecutarAsignacion
      responses:
        '201':
          description: Propuestas generadas
    get:
      summary: Historial de ejecuciones de asignación
      operationId: historialEjecucionesAsignacion
      responses:
        '200':
          description: Historial de ejecuciones
  /api/asignaciones/propuestas:
    get:
      summary: Listar propuestas de asignación
      operationId: listarPropuestasAsignacion
      responses:
        '200':
          description: Listado de propuestas
  /api/asignaciones/propuestas/{id}/estado:
    put:
      summary: Actualizar estado de una propuesta de asignación
      description: >
        Al aprobar se valida que la necesidad siga activa y que ninguna donación de la propuesta
        pertenezca a la propia entidad beneficiaria.
      operationId: actualizarEstadoPropuesta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado actualizado
        '409':
          description: >
            La necesidad ya no está activa (NECESIDAD_INACTIVA), una donación es de la propia
            entidad (DONACION_A_SI_MISMO), la transición de estado no es válida o otra operación
            guardó una de las donaciones a la vez
            (DONACION_INDEPENDIENTE_MODIFICADA_CONCURRENTEMENTE). La aprobación es atómica: si
            falla, no queda nada asignado y la propuesta sigue pendiente.
  /api/entidades:
    post:
      summary: Registrar entidad beneficiaria
      description: >
        Registro idempotente. El id de la entidad es el de su persona jurídica (`juridicaId`).
        La jurídica debe existir, no ser EMPRESA y tener dirección. Si ya era entidad no se
        duplica; si estaba de baja se reactiva (sus necesidades no se reactivan).
      operationId: registrarEntidadBeneficiaria
      responses:
        '201':
          description: Entidad creada. La respuesta incluye `activo`.
        '200':
          description: La jurídica ya era entidad (activa, o reactivada ahora). No se duplica.
        '400':
          description: La persona no es jurídica, es EMPRESA o no tiene dirección
        '404':
          description: Persona no encontrada
        '409':
          description: La jurídica fue anonimizada (PERSONA_ANONIMIZADA_NO_OPERABLE)
    get:
      summary: Listar entidades beneficiarias
      description: Incluye las entidades dadas de baja; cada una expone `activo`.
      operationId: listarEntidadesBeneficiarias
      responses:
        '200':
          description: Listado de entidades
  /api/entidades/{id}:
    get:
      summary: Consultar entidad beneficiaria por ID
      description: El `id` es el de la persona jurídica (`juridicaId`).
      operationId: obtenerEntidadPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de la entidad (incluye `activo`)
        '404':
          description: Entidad no encontrada
    put:
      summary: Revalidar entidad beneficiaria
      description: >
        Solo revalida: exige que el `id` coincida con `juridicaId` y que la jurídica siga
        cumpliendo los requisitos (no EMPRESA, con dirección). No cambia el estado de la entidad;
        los datos se editan con `PUT /api/personas/{id}`. Para reactivar una entidad de baja se
        usa `POST /api/entidades`.
      operationId: actualizarEntidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entidad revalidada
        '400':
          description: El id no coincide con juridicaId, o la jurídica ya no cumple los requisitos
        '404':
          description: Entidad no encontrada
        '409':
          description: La entidad está dada de baja
    delete:
      summary: Baja de entidad beneficiaria
      description: >
        Baja lógica e idempotente: marca la entidad como inactiva y desactiva en cascada sus
        necesidades. No borra el registro; las donaciones históricas siguen resolviéndose.
      operationId: eliminarEntidad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Entidad dada de baja (o ya lo estaba)
        '404':
          description: Entidad no encontrada
  /api/donantes:
    post:
      summary: Registrar nuevo donante
      description: >
        Registro idempotente. El id del donante es el de su persona (`idPersona`). Si la persona
        ya era donante activa no se duplica ni se publica evento; si estaba de baja se reactiva y
        se publica `donante.registrado.v1`.
      operationId: registrarDonante
      responses:
        '201':
          description: Donante registrado. La respuesta incluye `activo`.
        '200':
          description: La persona ya era donante (activa, o reactivada ahora). No se duplica.
        '404':
          description: Persona no encontrada
        '409':
          description: La persona fue anonimizada (PERSONA_ANONIMIZADA_NO_OPERABLE)
    get:
      summary: Listar donantes
      description: >
        Sin `canal` incluye los donantes dados de baja; cada uno expone `activo`. Con `canal`
        devuelve solo los donantes activos cuya persona no está anonimizada, porque el filtro
        sirve para contactarlos.
      operationId: listarDonantes
      parameters:
        - name: canal
          in: query
          required: false
          description: Tipo de medio de contacto (por ejemplo `CORREO` o `TELEFONO`).
          schema: { type: string }
      responses:
        '200':
          description: Listado de donantes
  /api/donantes/{id}:
    get:
      summary: Consultar donante por ID
      description: El `id` es el de la persona (`personaId`).
      operationId: obtenerDonantePorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del donante (incluye `activo`)
        '404':
          description: Donante no encontrado
    delete:
      summary: Dar de baja donante
      description: >
        Baja lógica e idempotente: marca al donante como inactivo y publica
        `donante.dado-de-baja.v1` solo si estaba activo. No borra el registro.
      operationId: eliminarDonante
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Donante dado de baja (o ya lo estaba)
        '404':
          description: Donante no encontrado
  /api/donantes/archivos:
    post:
      summary: Cargar archivo/padrón de donantes para procesamiento asíncrono
      description: >
        Una fila cuyo correo ya pertenece a otra persona con un documento distinto no se
        importa y cuenta como error del archivo (PERSONA_DUPLICADA_EN_CONFLICTO): el conflicto
        no devuelve 409, porque el procesamiento es asíncrono.
      operationId: cargarArchivoDonantes
      responses:
        '202':
          description: Archivo aceptado para procesamiento
        '400':
          description: Archivo inválido
  /api/donantes/archivos/{id}:
    get:
      summary: Consultar estado de procesamiento de archivo de donantes
      operationId: obtenerArchivoDonantes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del archivo de donantes
        '404':
          description: Archivo no encontrado
  /api/categorias:
    get:
      summary: Listar categorías de donación
      operationId: listarCategorias
      responses:
        '200':
          description: Listado de categorías
    post:
      summary: Crear categoría
      operationId: crearCategoria
      responses:
        '201':
          description: Categoría creada
  /api/categorias/{id}:
    get:
      summary: Consultar categoría por ID
      operationId: obtenerCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Detalle de categoría }
        '404': { description: Categoría no encontrada }
    put:
      summary: Actualizar categoría
      operationId: actualizarCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Categoría actualizada }
        '404': { description: Categoría no encontrada }
    delete:
      summary: Eliminar categoría
      operationId: eliminarCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Categoría eliminada exitosamente (retorna CategoriaOutputDTO) }
        '404': { description: Categoría no encontrada }
        '409': { description: Alguna de sus subcategorías tiene necesidades que la usan (SUBCATEGORIA_EN_USO) }
  /api/subcategorias:
    get:
      summary: Listar subcategorías
      operationId: listarSubcategorias
      responses:
        '200': { description: Listado de subcategorías }
    post:
      summary: Crear subcategoría
      operationId: crearSubcategoria
      responses:
        '201': { description: Subcategoría creada }
  /api/subcategorias/{id}:
    get:
      summary: Consultar subcategoría por ID
      operationId: obtenerSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Detalle de subcategoría }
        '404': { description: Subcategoría no encontrada }
    put:
      summary: Actualizar subcategoría
      operationId: actualizarSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Subcategoría actualizada }
        '404': { description: Subcategoría no encontrada }
    delete:
      summary: Eliminar subcategoría
      operationId: eliminarSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Subcategoría eliminada exitosamente (retorna SubcategoriaOutputDTO) }
        '404': { description: Subcategoría no encontrada }
        '409': { description: Tiene necesidades que la usan (SUBCATEGORIA_EN_USO) }
  /api/subcategorias/{id}/aliases:
    post:
      summary: Agregar alias semántico a una subcategoría
      operationId: agregarAliasSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSubcategoriaInputDTO'
      responses:
        '200':
          description: Subcategoría con alias agregado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoriaOutputDTO'
        '400':
          description: Alias inválido
        '404':
          description: Subcategoría no encontrada
  /api/subcategorias/{id}/aliases/{alias}:
    delete:
      summary: Quitar alias semántico de una subcategoría
      operationId: quitarAliasSubcategoria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Subcategoría con alias eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoriaOutputDTO'
        '404':
          description: Subcategoría o alias no encontrado
  /api/items-normalizados/pendientes:
    get:
      summary: Listar items normalizados pendientes de revisión
      operationId: listarItemsNormalizadosPendientes
      responses:
        '200':
          description: Listado de items normalizados pendientes de revisión
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemDonacionNormalizadoOutputDTO'
  /api/items-normalizados/{id}:
    get:
      summary: Consultar item normalizado por ID
      operationId: obtenerItemNormalizadoPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del item normalizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDonacionNormalizadoOutputDTO'
        '404':
          description: Item normalizado no encontrado
    patch:
      summary: Actualizar estado y reclasificación de item normalizado
      operationId: actualizarEstadoItemNormalizado
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemDonacionNormalizadoPatchDTO'
      responses:
        '200':
          description: Item normalizado actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDonacionNormalizadoOutputDTO'
        '400':
          description: Datos de actualización inválidos
        '404':
          description: Item normalizado no encontrado
  /api/personas:
    get:
      summary: Listar personas registradas
      operationId: listarPersonasDonaciones
      responses:
        '200': { description: Listado de personas }
    post:
      summary: Crear persona
      operationId: crearPersonaDonaciones
      responses:
        '201': { description: Persona creada }
  /api/personas/{id}:
    put:
      summary: Actualizar persona
      operationId: actualizarPersonaDonaciones
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Persona actualizada }
        '404': { description: Persona no encontrada }
        '409': { description: La persona fue anonimizada y no se puede editar (PERSONA_ANONIMIZADA_NO_OPERABLE) }
    delete:
      summary: Eliminar persona
      operationId: eliminarPersonaDonaciones
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Persona eliminada }
        '404': { description: Persona no encontrada }
  /api/logistica/proveedores:
    get:
      summary: Listar los proveedores de logística del broker
      description: Proveedores configurados, su transporte, si tienen adapter registrado y cuál es el preferido. Requiere la clave de administración.
      operationId: listarProveedoresLogistica
      security:
        - ApiKeyAdministracion: []
      responses:
        '200':
          description: Proveedores configurados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProveedorLogisticaDTO'
        '401': { description: Falta la clave de administración o es incorrecta }
  /api/logistica/proveedor-preferido:
    put:
      summary: Cambiar el proveedor de logística preferido
      description: Cambia en caliente el proveedor que el broker prueba primero. No persiste entre reinicios; vale para los despachos siguientes. Requiere la clave de administración.
      operationId: cambiarProveedorLogisticaPreferido
      security:
        - ApiKeyAdministracion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciaProveedorRequestDTO'
      responses:
        '200':
          description: Proveedores con el preferido actualizado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProveedorLogisticaDTO'
        '400': { description: Proveedor vacío o no configurado }
        '401': { description: Falta la clave de administración o es incorrecta }
components:
  schemas:
    CambioEstadoDonacionIndependienteRequestDTO:
      type: object
      required:
        - estado
      properties:
        estado:
          type: string
          enum:
            - EN_DEPOSITO
            - ASIGNACION_REALIZADA
            - EN_TRASLADO
            - LISTA_PARA_ENTREGAR
            - ENTREGADA
            - ENTREGA_FALLIDA
            - VENCIDA
        justificacion: { type: string }
        necesidadId: { type: string, format: uuid }
        urlMapa: { type: string }
        patenteCamion: { type: string }
        replanificable: { type: boolean }
    DonacionIndependienteResponseDTO:
      type: object
      required:
        - id
        - donacionOriginalId
        - estadoActual
        - fechaRegistro
      properties:
        id:
          type: string
          format: uuid
        donacionOriginalId:
          type: string
          format: uuid
        descripcion:
          type: string
        estadoActual:
          type: string
          enum:
            - EN_DEPOSITO
            - ASIGNACION_REALIZADA
            - EN_TRASLADO
            - LISTA_PARA_ENTREGAR
            - ENTREGADA
            - ENTREGA_FALLIDA
            - VENCIDA
        fechaRegistro:
          type: string
          format: date-time
        historial:
          type: array
          items:
            type: object
        items:
          type: array
          items:
            type: object
        cantidad:
          type: integer
    DonacionInputDTO:
      type: object
      required:
        - donanteId
        - descripcion
        - items
      properties:
        donanteId:
          type: string
          format: uuid
        descripcion:
          type: string
          description: >
            Descripción general de lo que se dona. Obligatoria (400 si falta o está vacía). Cambio
            no aditivo del contrato (D-32): antes era opcional y la base la exige NOT NULL.
        items:
          type: array
          items:
            type: object
    DonacionOutputDTO:
      type: object
      required:
        - id
        - donanteId
      properties:
        id:
          type: string
          format: uuid
        donanteId:
          type: string
          format: uuid
        descripcion:
          type: string
    AliasSubcategoriaInputDTO:
      type: object
      required:
