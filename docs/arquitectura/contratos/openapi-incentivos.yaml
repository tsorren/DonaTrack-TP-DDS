openapi: 3.0.3
info:
  title: DonaTrack - Incentivos Service API
  version: 1.1.0
  description: API REST para gamificación, misiones por Template Method, asignación de insignias y cómputo de ranking mensual de donantes.
servers:
  - url: http://localhost:8082
    description: Servidor local de desarrollo
paths:
  /api/incentivos/ranking/ultimo:
    get:
      summary: Obtener el último ranking mensual calculado
      operationId: obtenerUltimoRanking
      responses:
        '200':
          description: Último ranking mensual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingMensualDTO'
        '204':
          description: No hay rankings calculados todavía
  /api/incentivos/ranking/historial:
    get:
      summary: Obtener historial de rankings mensuales
      description: >-
        Desde 1.1.0 (R11-43) de a una página, del mes más reciente al más viejo. Sin `page` ni
        `size`, la página 0 de 12 meses (un año; antes, todos sin orden fijo). El total de meses
        calculados va en `X-Total-Count`. Los puestos de cada mes llegan todos.
      operationId: obtenerHistorialRankings
      parameters:
        - name: page
          in: query
          required: false
          description: Página pedida, desde 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Cuántos meses por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
      responses:
        '200':
          description: Una página del historial, del mes más reciente al más viejo
          headers:
            X-Total-Count:
              description: Cuántos meses hay calculados, sin contar la página.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingMensualDTO'
        '400':
          description: '`page` negativa o `size` fuera de 1..100 (ERR-CSR-003)'
  /api/incentivos/ranking/calcular:
    post:
      summary: Calcular y persistir ranking mensual
      operationId: calcularRanking
      parameters:
        - name: periodo
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-09'
          description: Período a calcular en formato YYYY-MM (por defecto el mes actual)
      responses:
        '200':
          description: Ranking calculado y persistido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingMensualDTO'
  /api/incentivos/ranking/posicion/{donanteId}:
    get:
      summary: Obtener posición y estado en ranking de un donante
      operationId: obtenerPosicionRanking
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: periodo
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Posición del donante en el ranking
          content:
            application/json:
              schema:
                type: integer
                example: 3
        '204':
          description: El donante no posee posición en el ranking para el período solicitado
  /api/incentivos/ranking/{periodo}:
    get:
      summary: Obtener ranking mensual de un período específico
      operationId: obtenerRankingPorPeriodo
      parameters:
        - name: periodo
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-09'
          description: Período a consultar en formato YYYY-MM
      responses:
        '200':
          description: Ranking mensual del período solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingMensualDTO'
        '400':
          description: Formato de período inválido
        '404':
          description: Ranking no encontrado para el período
  /api/incentivos/donantes/{donanteId}:
    post:
      summary: Registrar un nuevo donante en el sistema de incentivos
      operationId: registrarDonanteIncentivos
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarDonanteRequest'
      responses:
        '201':
          description: Donante registrado exitosamente en incentivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonanteRegistradoDTO'
        '400':
          description: Datos inválidos o discrepancia de ID
    delete:
      summary: Dar de baja donante en incentivos
      operationId: darDeBajaDonanteIncentivos
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Donante dado de baja exitosamente
        '404':
          description: Donante no encontrado
    patch:
      summary: Modificar atributos de donante en incentivos
      operationId: modificarDonanteIncentivos
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificarDonanteRequest'
      responses:
        '200':
          description: Donante modificado exitosamente
        '400':
          description: Payload inválido
        '404':
          description: Donante no encontrado
    get:
      summary: Consultar perfil consolidado del donante en incentivos
      operationId: obtenerDonantePerfil
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Perfil consolidado del donante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonantePerfilDTO'
        '404':
          description: Donante no encontrado
  /api/incentivos/donantes/{donanteId}/ascensos:
    get:
      summary: Consultar historial de ascensos de categoría del donante
      operationId: obtenerAscensosDonante
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historial de ascensos de categoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CambioCategoriaDTO'
        '404':
          description: Donante no encontrado
  /api/incentivos/donantes/{donanteId}/metricas:
    get:
      summary: Consultar métricas y nivel de un donante
      operationId: obtenerMetricasDonante
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Métricas del donante
        '404':
          description: Donante no encontrado
  /api/incentivos/admin/resumen:
    get:
      summary: Obtener resumen consolidado del sistema de incentivos para administración
      operationId: obtenerResumenSistema
      responses:
        '200':
          description: Resumen general de incentivos
  /api/incentivos/donantes/{donanteId}/misiones:
    get:
      summary: Listar misiones asignadas a un donante
      operationId: obtenerMisionesDonante
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de misiones del donante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MisionDTO'
        '404':
          description: Donante no encontrado
  /api/incentivos/donantes/{donanteId}/insignias:
    get:
      summary: Listar insignias obtenidas por un donante
      operationId: obtenerInsigniasDonante
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: soloVisibles
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Catálogo de insignias del donante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsigniaDTO'
  /api/incentivos/donantes/{donanteId}/insignias/{nombreInsignia}/visibilidad:
    put:
      summary: Configurar visibilidad pública de una insignia
      operationId: configurarVisibilidadInsignia
      parameters:
        - name: donanteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nombreInsignia
          in: path
          required: true
          schema:
            type: string
        - name: visible
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Visibilidad actualizada
  /api/incentivos/donaciones:
    post:
      summary: Notificar nueva donación para evaluación de misiones
      operationId: procesarNuevaDonacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaDonacionRequest'
      responses:
        '200':
          description: Evento de donación procesado
  /api/incentivos/donaciones/exitosa:
    post:
      summary: Notificar donación completada exitosamente para evaluación de misiones
      operationId: procesarDonacionExitosa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonacionExitosaRequest'
      responses:
        '200':
          description: Evento de donación exitosa procesado
  /api/incentivos/evaluaciones-inactividad:
    post:
      summary: Ejecutar evaluación de inactividad de donantes (on-demand)
      operationId: ejecutarEvaluacionInactividad
      responses:
        '200':
          description: Evaluación de inactividad ejecutada exitosamente
  /api/incentivos/verificaciones-racha:
    post:
      summary: Ejecutar verificación de vigencia de rachas (on-demand)
      operationId: ejecutarVerificacionRachas
      responses:
        '200':
          description: Verificación de rachas ejecutada exitosamente
components:
  schemas:
    RankingMensualDTO:
      type: object
      properties:
        periodo:
          type: string
          example: '2026-09'
        entradas:
          type: array
          items:
            $ref: '#/components/schemas/EntradaRankingDTO'
        podio:
          type: array
          items:
            $ref: '#/components/schemas/EntradaRankingDTO'
        calculadoEn:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se calculó el ranking; null en los calculados antes de que existiera el dato.
          example: '2026-10-01T02:59:00Z'
    EntradaRankingDTO:
      type: object
      properties:
        posicion:
          type: integer
        donanteId:
          type: string
          format: uuid
        nombreDonante:
          type: string
        misionesCompletadas:
          type: integer
    InsigniaDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        iconoUrl:
          type: string
        visible:
          type: boolean
        fechaOtorgamiento:
          type: string
          format: date-time
    RegistrarDonanteRequest:
      type: object
      required:
        - idDonante
        - idPersona
        - nombre
      properties:
        idDonante:
          type: string
          format: uuid
        idPersona:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 2
          maxLength: 100
    DonanteRegistradoDTO:
      type: object
      properties:
        donanteId:
          type: string
          format: uuid
        categoria:
          type: string
    ModificarDonanteRequest:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
    MisionDTO:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        categoria:
          type: string
          enum: [COLABORADOR, SOSTENEDOR, TRANSFORMADOR]
        progresoActual:
          type: integer
        objetivo:
          type: integer
        porcentaje:
          type: integer
        distanciaAlObjetivo:
          type: integer
        completada:
          type: boolean
        fechaCompletada:
          type: string
          format: date
        insignia:
          $ref: '#/components/schemas/InsigniaDTO'
    DonantePerfilDTO:
      type: object
      properties:
        donanteId:
          type: string
          format: uuid
        idPersona:
          type: string
          format: uuid
        nombre:
          type: string
        categoria:
          type: string
          enum: [COLABORADOR, SOSTENEDOR, TRANSFORMADOR]
        fechaRegistro:
          type: string
          format: date
        misionesCompletadas:
          type: integer
        insigniasGanadas:
          type: integer
    CambioCategoriaDTO:
      type: object
      properties:
        categoriaAnterior:
          type: string
          enum: [COLABORADOR, SOSTENEDOR, TRANSFORMADOR]
        categoriaNueva:
          type: string
          enum: [COLABORADOR, SOSTENEDOR, TRANSFORMADOR]
        fecha:
          type: string
          format: date
    NuevaDonacionRequest:
      type: object
      required:
        - donanteId
        - categorias
        - cantidadBienes
        - fecha
      properties:
        donanteId:
          type: string
          format: uuid
        categorias:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
        cantidadBienes:
          type: integer
          minimum: 1
        fecha:
          type: string
          format: date
    DonacionExitosaRequest:
      type: object
      required:
        - donanteId
        - organizacionId
      properties:
        donanteId:
          type: string
          format: uuid
        organizacionId:
          type: string
          format: uuid


