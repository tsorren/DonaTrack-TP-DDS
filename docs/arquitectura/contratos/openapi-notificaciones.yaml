openapi: 3.0.3
info:
  title: DonaTrack - Notificaciones Service API
  version: 1.1.0
  description: API REST para despacho de alertas multicanal (Email, WhatsApp, SMS), sincronización idempotente de personas replicadas y gestión de historial de notificaciones.
servers:
  - url: http://localhost:8081
    description: Servidor local de desarrollo
paths:
  /notificaciones:
    post:
      summary: Despachar notificación por evento de dominio (Legacy/Deprecated)
      description: Recibe un evento de dominio y programa el despacho asíncrono a los medios de contacto de la persona.
      operationId: procesarEventoNotificable
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoNotificableDTO'
      responses:
        '202':
          description: Evento aceptado para procesamiento asíncrono
        '400':
          description: Payload inválido o campos obligatorios faltantes
  /api/notificaciones/eventos:
    post:
      summary: Despachar notificación por evento de dominio
      description: Recibe un evento de dominio y programa el despacho asíncrono a los medios de contacto de la persona.
      operationId: procesarEventoNotificableApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoNotificableDTO'
      responses:
        '202':
          description: Evento aceptado para procesamiento asíncrono
        '400':
          description: Payload inválido o campos obligatorios faltantes
  /notificaciones/persona/{personaId}:
    get:
      summary: Obtener historial de notificaciones de una persona (Legacy/Deprecated)
      operationId: obtenerNotificacionesPorPersona
      deprecated: true
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historial de notificaciones despachadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificacionDTO'
  /api/notificaciones/persona/{personaId}:
    get:
      summary: Obtener historial de notificaciones de una persona
      operationId: obtenerNotificacionesPorPersonaApi
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: leida
          in: query
          required: false
          schema:
            type: boolean
          description: Filtro opcional. Si es false trae solo pendientes.
      responses:
        '200':
          description: Historial de notificaciones despachadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificacionDTO'
  /api/notificaciones:
    get:
      summary: Obtener notificaciones por persona y/o estado
      description: Devuelve una colección filtrada de notificaciones.
      operationId: obtenerNotificaciones
      parameters:
        - name: personaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de notificaciones devuelta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificacionDTO'
        '400':
          description: Estado inválido
  /api/notificaciones/{id}:
    get:
      summary: Obtener una notificación específica por su ID
      operationId: obtenerNotificacionPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notificación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionDTO'
        '404':
          description: Notificación no encontrada

  /api/notificaciones/persona/{personaId}/no-leidas/conteo:
    get:
      summary: Obtener el conteo de notificaciones no leídas de una persona
      operationId: contarNoLeidas
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conteo devuelto exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  noLeidas:
                    type: integer
                    format: int64

  /api/notificaciones/{id}/leida:
    patch:
      summary: Marcar una notificación como leída o no leída
      operationId: marcarLeida
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: leida
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Notificación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacionDTO'
        '404':
          description: Notificación no encontrada

  /api/notificaciones/persona/{personaId}/marcar-todas-leidas:
    patch:
      summary: Marcar todas las notificaciones de una persona como leídas
      operationId: marcarTodasComoLeidas
      parameters:
        - name: personaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Todas las notificaciones fueron marcadas como leídas

  /api/notificaciones/personas:
    put:
      summary: Sincronizar réplica de persona y medios de contacto
      description: Operación idempotente consumida vía Feign o HTTP directo para actualizar datos de contacto.
      operationId: sincronizarPersona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaReplicaDTO'
      responses:
        '200':
          description: Réplica sincronizada con éxito
        '400':
          description: Datos de réplica inválidos
  /api/notificaciones/personas/{id}:
    get:
      summary: Consultar persona replicada
      operationId: obtenerPersona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos de la persona replicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaReplicaDTO'
        '404':
          description: Persona no encontrada
    delete:
      summary: Anonimizar datos personales (Crypto-shredding / Baja)
      operationId: anonimizarPersona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Datos de la persona anonimizados o eliminados
  /api/contacto:
    post:
      tags: [Contacto]
      summary: Recibir un mensaje del formulario de contacto (HB-21)
      description: >-
        Público (ruta de la allowlist del gateway). Orden de los chequeos: primero la claveEnvio
        (si ya estaba, 200 con el número del primer mensaje, aunque el correo esté en el límite),
        después los límites (5 por hora por correo y 20 por día por IP, en configuración) y recién
        entonces se guarda. Cada mensaje nuevo avisa a la Administración en su bandeja.
      operationId: recibirMensajeContacto
      parameters:
        - name: X-Forwarded-For
          in: header
          required: false
          description: >-
            La IP del navegador va primera; el gateway suma la suya detrás. Sin el encabezado,
            solo cuenta el límite por correo.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MensajeContactoInputDTO'
      responses:
        '201':
          description: Mensaje recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumeroMensajeDTO'
        '200':
          description: La claveEnvio ya estaba; el número es el del primer mensaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumeroMensajeDTO'
        '400':
          description: Datos inválidos (ERR-CSR-003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de envíos superado (ERR-EST-903)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Contacto]
      summary: Listar los mensajes de contacto (solo ADMIN, con HB-13)
      description: Del más nuevo al más viejo, 20 por página. El total va en el header X-Total-Count.
      operationId: listarMensajesContacto
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoMensajeContacto'
        - name: pagina
          in: query
          required: false
          description: Desde 0.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de mensajes
          headers:
            X-Total-Count:
              description: Cantidad total de mensajes con ese filtro
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MensajeContactoDTO'
        '400':
          description: Estado o página inválidos (ERR-CSR-003)
  /api/contacto/{numero}:
    get:
      tags: [Contacto]
      summary: Obtener un mensaje de contacto con su respuesta (solo ADMIN, con HB-13)
      operationId: obtenerMensajeContacto
      parameters:
        - name: numero
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Mensaje encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeContactoDTO'
        '404':
          description: No hay mensaje con ese número
  /api/contacto/{numero}/respuesta:
    post:
      tags: [Contacto]
      summary: Responder un mensaje de contacto por correo (solo ADMIN, con HB-13)
      description: >-
        Manda "Respuesta a tu mensaje Nº <numero>" y el texto al correo del mensaje. Queda en
        RESPONDIDO si el correo salió, o en ENVIO_FALLIDO si el proveedor falló (se reintenta con
        el mismo pedido).
      operationId: responderMensajeContacto
      parameters:
        - name: numero
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaContactoInputDTO'
      responses:
        '200':
          description: Mensaje con su nuevo estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeContactoDTO'
        '400':
          description: Respuesta vacía o de más de 5000 caracteres (ERR-CSR-003)
        '404':
          description: No hay mensaje con ese número
components:
  schemas:
    PersonaReplicaDTO:
      type: object
      required:
        - id
        - denominacion
        - tipoPersona
      properties:
        id:
          type: string
          format: uuid
        denominacion:
          type: string
        tipoPersona:
          type: string
          enum: [HUMANA, JURIDICA]
        mediosDeContacto:
          type: array
          items:
            $ref: '#/components/schemas/MedioDeContactoReplicaDTO'
    MedioDeContactoReplicaDTO:
      type: object
      required:
        - tipo
      properties:
        tipo:
          type: string
          enum: [CORREO, TELEFONO, WHATSAPP]
        esPredeterminado:
          type: boolean
        direccionCorreo:
          type: string
        caracteristica:
          type: string
        codigoArea:
          type: string
        numero:
          type: string
    EventoNotificableDTO:
      type: object
      description: Contrato polimórfico base para eventos de dominio que desencadenan notificaciones
      discriminator:
        propertyName: tipo
        mapping:
          DONANTE_REGISTRADO: '#/components/schemas/EventoDonanteRegistradoDTO'
          DONANTE_INACTIVO: '#/components/schemas/EventoDonanteInactivoDTO'
          MISION_CUMPLIDA: '#/components/schemas/EventoMisionCumplidaDTO'
          SUBIO_CATEGORIA: '#/components/schemas/EventoSubioCategoriaDTO'
          DONACION_ASIGNADA: '#/components/schemas/EventoDonacionAsignadaDTO'
          DONACION_RECIBIDA: '#/components/schemas/EventoDonacionRecibidaDTO'
          DONACION_EN_CAMINO: '#/components/schemas/EventoDonacionEnCaminoDTO'
          ENTREGA_FALLIDA: '#/components/schemas/EventoEntregaFallidaDTO'
          DONACION_VENCIDA: '#/components/schemas/EventoDonacionVencidaDTO'
      oneOf:
        - $ref: '#/components/schemas/EventoDonanteRegistradoDTO'
        - $ref: '#/components/schemas/EventoDonanteInactivoDTO'
        - $ref: '#/components/schemas/EventoMisionCumplidaDTO'
        - $ref: '#/components/schemas/EventoSubioCategoriaDTO'
        - $ref: '#/components/schemas/EventoDonacionAsignadaDTO'
        - $ref: '#/components/schemas/EventoDonacionRecibidaDTO'
        - $ref: '#/components/schemas/EventoDonacionEnCaminoDTO'
        - $ref: '#/components/schemas/EventoEntregaFallidaDTO'
        - $ref: '#/components/schemas/EventoDonacionVencidaDTO'
    EventoDonanteRegistradoDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - credencialesDeAcceso
      properties:
        tipo:
          type: string
          enum: [DONANTE_REGISTRADO]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        credencialesDeAcceso:
          type: string
    EventoDonanteInactivoDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - diasInactivo
      properties:
        tipo:
          type: string
          enum: [DONANTE_INACTIVO]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        diasInactivo:
          type: integer
          minimum: 1
    EventoMisionCumplidaDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - nombreMision
        - recompensa
      properties:
        tipo:
          type: string
          enum: [MISION_CUMPLIDA]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        nombreMision:
          type: string
        recompensa:
          type: string
    EventoSubioCategoriaDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - categoriaNueva
        - categoriaVieja
      properties:
        tipo:
          type: string
          enum: [SUBIO_CATEGORIA]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        categoriaNueva:
          type: string
        categoriaVieja:
          type: string
    EventoDonacionAsignadaDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - personaBeneficiariaId
        - descripcion
      properties:
        tipo:
          type: string
          enum: [DONACION_ASIGNADA]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        personaBeneficiariaId:
          type: string
          format: uuid
        descripcion:
          type: string
    EventoDonacionRecibidaDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - personaBeneficiariaId
        - descripcion
      properties:
        tipo:
          type: string
          enum: [DONACION_RECIBIDA]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        personaBeneficiariaId:
          type: string
          format: uuid
        descripcion:
          type: string
        patenteCamion:
          type: string
    EventoDonacionEnCaminoDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - personaBeneficiariaId
        - descripcion
      properties:
        tipo:
          type: string
          enum: [DONACION_EN_CAMINO]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        personaBeneficiariaId:
          type: string
          format: uuid
        descripcion:
          type: string
        urlMapa:
          type: string
    EventoEntregaFallidaDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - personaBeneficiariaId
        - descripcion
        - personaAdminId
        - justificacion
        - replanificable
      properties:
        tipo:
          type: string
          enum: [ENTREGA_FALLIDA]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        personaBeneficiariaId:
          type: string
          format: uuid
        descripcion:
          type: string
        personaAdminId:
          type: string
          format: uuid
        justificacion:
          type: string
        replanificable:
          type: boolean
    EventoDonacionVencidaDTO:
      type: object
      required:
        - tipo
        - personaId
        - fecha
        - personaAdminId
        - descripcion
        - motivo
      properties:
        tipo:
          type: string
          enum: [DONACION_VENCIDA]
        personaId:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        personaAdminId:
          type: string
          format: uuid
        descripcion:
          type: string
        motivo:
          type: string
    NotificacionDTO:
      type: object
      required:
        - id
        - mensaje
        - estado
        - fechaCreacion
        - leida
      properties:
        id:
          type: string
          format: uuid
        mensaje:
          type: string
        estado:
          type: string
        fechaCreacion:
          type: string
          format: date-time
        leida:
          type: boolean
        fechaLectura:
          type: string
          format: date-time
          nullable: true
    MensajeContactoInputDTO:
      type: object
      required:
        - tema
        - texto
        - correo
        - claveEnvio
      properties:
        tema:
          type: string
          enum: [ENTREGA, DONACION, NECESIDAD, CUENTA, SITIO, OTRO]
        texto:
          type: string
          minLength: 1
          maxLength: 2000
        codigoError:
          type: string
          pattern: '^[0-9a-fA-F]{12,32}$'
          description: El código de un aviso de error del sitio (hexadecimal).
          nullable: true
        correo:
          type: string
          format: email
          maxLength: 254
        claveEnvio:
          type: string
          format: uuid
          description: La genera el formulario al abrirse; un reenvío con la misma clave no crea otro mensaje.
    NumeroMensajeDTO:
      type: object
      required:
        - numero
      properties:
        numero:
          type: integer
          format: int64
    RespuestaContactoInputDTO:
      type: object
      required:
        - texto
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 5000
    EstadoMensajeContacto:
      type: string
      enum: [RECIBIDO, RESPONDIDO, ENVIO_FALLIDO]
    MensajeContactoDTO:
      type: object
      required:
        - numero
        - tema
        - texto
        - correo
        - estado
        - recibidoEn
      properties:
        numero:
          type: integer
          format: int64
        tema:
          type: string
          enum: [ENTREGA, DONACION, NECESIDAD, CUENTA, SITIO, OTRO]
        texto:
          type: string
        codigoError:
          type: string
          nullable: true
        correo:
          type: string
        estado:
          type: string
          enum: [RECIBIDO, RESPONDIDO, ENVIO_FALLIDO]
        recibidoEn:
          type: string
          description: Hora de Buenos Aires sin offset (yyyy-MM-ddTHH:mm:ss), como la serializa LocalDateTime.
        respuesta:
          type: string
          nullable: true
        respondidoEn:
          type: string
          description: Hora de Buenos Aires sin offset (yyyy-MM-ddTHH:mm:ss), como la serializa LocalDateTime.
          nullable: true
    ErrorResponse:
      type: object
      description: Formato de error común (common-lib).
      required:
        - code
      properties:
        code:
          type: string
        type:
          type: string
        details:
          type: string
          nullable: true
        traceId:
          type: string
          nullable: true
        timestamp:
          type: string
        errors:
          type: array
          nullable: true
          items:
            type: object
