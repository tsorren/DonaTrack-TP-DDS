# PREPROD DOCKER FILE
services:
  notificaciones-service:
    image: donatrack/notificaciones-service:preprod
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
      target: ci
      args:
        JAR_FILE: notificaciones-service/target/notificaciones-service-1.0.jar
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SPRING_PROFILES_ACTIVE=postgres,preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/donatrack?currentSchema=notificaciones
      - SPRING_DATASOURCE_USERNAME=notificaciones_user
      - SPRING_DATASOURCE_PASSWORD=notif_pass_2026
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  incentivos-service:
    image: donatrack/incentivos-service:preprod
    build:
      context: .
      dockerfile: incentivos-service/Dockerfile
      target: ci
      args:
        JAR_FILE: incentivos-service/target/incentivos-service-1.0.jar
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - SPRING_PROFILES_ACTIVE=preprod
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - N8N_INSIGNIA_WEBHOOK_URL=http://n8n:5678/webhook/insignia-ganada
      - N8N_RANKING_WEBHOOK_URL=http://n8n:5678/webhook/ranking-calculado
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  donaciones-service:
    image: donatrack/donaciones-service:preprod
    build:
      context: .
      dockerfile: donaciones-service/Dockerfile
      target: ci
      args:
        JAR_FILE: donaciones-service/target/donaciones-service-1.0.jar
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=preprod
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - INCENTIVOS_SERVICE_URL=http://incentivos-service:8082
      - LOGISTICA_SERVICE_URL=http://logistica-service:8083
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - RABBITMQ_HOST=rabbitmq
      - SEED_CATALOGO_ENABLED=true
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  logistica-service:
    image: donatrack/logistica-service:preprod
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: ci
      args:
        JAR_FILE: logistica-service/target/logistica-service-1.0.jar
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - SPRING_PROFILES_ACTIVE=preprod
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - LOGISTICA_MAX_DONACIONES_POR_LOTE=${LOGISTICA_MAX_DONACIONES_POR_LOTE:-100}
      - RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=donatrack
      - RABBITMQ_DEFAULT_PASS=donatrack
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - preprod-network

  n8n:
    image: n8nio/n8n:2.37.7
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_METRICS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - ./n8n:/etc/n8n/workflows
      # TODO deuda técnica: docker-compose.yml (local) no persiste /home/node/.n8n a propósito,
      # por diseño solo se hizo para preprod. Evaluar si conviene espejarlo en local.
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5678/healthz', (res) => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
      start_interval: 1s
    networks:
      - preprod-network

  postgres:
    image: postgres:16-alpine
    container_name: donatrack-postgres
    environment:
      POSTGRES_DB: donatrack
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_secure_password
    volumes:
      - ./persistencia/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d donatrack" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - preprod-network

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: donatrack-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - preprod-network

networks:
  preprod-network:
    driver: bridge

volumes:
  n8n_data:
