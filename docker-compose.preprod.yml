# PREPROD DOCKER FILE
services:
  notificaciones-service:
    image: donatrack/notificaciones-service:preprod
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
      target: ci
      args:
        JAR_FILE: notificaciones-service/target/notificaciones-service-1.0.jar
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SPRING_PROFILES_ACTIVE=postgres,preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notificaciones?currentSchema=notificaciones
      - SPRING_DATASOURCE_USERNAME=notificaciones_user
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICACIONES_DB_PASSWORD:?ver .env.example}
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PASS=${RABBITMQ_PASS:?ver .env.example}
      # Correo de cuenta (SPEC-06 E2-06): solo se manda un enlace que apunte a nuestro Keycloak.
      - KEYCLOAK_ENLACES_PREFIJO=${KC_HOSTNAME:-http://localhost:8180}/realms/donatrack/login-actions/
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
      # Validación del token de Keycloak (SPEC-06 E2-01): apagada salvo PREPROD_SEGURIDAD=true (run-preprod-tests.sh --auth)
      - NOTIFICACIONES_SEGURIDAD_HABILITADA=${PREPROD_SEGURIDAD:-false}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KC_HOSTNAME:-http://localhost:8180}/realms/donatrack
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/donatrack/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  incentivos-service:
    image: donatrack/incentivos-service:preprod
    build:
      context: .
      dockerfile: incentivos-service/Dockerfile
      target: ci
      args:
        JAR_FILE: incentivos-service/target/incentivos-service-1.0.jar
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - SPRING_PROFILES_ACTIVE=postgres,preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/incentivos?currentSchema=incentivos
      - SPRING_DATASOURCE_USERNAME=incentivos_user
      - SPRING_DATASOURCE_PASSWORD=${INCENTIVOS_DB_PASSWORD:?ver .env.example}
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - N8N_INSIGNIA_WEBHOOK_URL=http://n8n:5678/webhook/insignia-ganada
      - N8N_RANKING_WEBHOOK_URL=http://n8n:5678/webhook/ranking-calculado
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PASS=${RABBITMQ_PASS:?ver .env.example}
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
      - INCENTIVOS_MINIO_ENABLED=true
      - INCENTIVOS_MINIO_ENDPOINT=http://minio:9000
      - INCENTIVOS_MINIO_PUBLIC_BASE_URL=http://minio:9000
      - INCENTIVOS_MINIO_ACCESS_KEY=incentivos-service
      - INCENTIVOS_MINIO_SECRET_KEY=${INCENTIVOS_MINIO_PASSWORD:?ver .env.example}
      - INCENTIVOS_MINIO_BUCKET=insignias
      # Validación del token de Keycloak (SPEC-06 E2-01): apagada salvo PREPROD_SEGURIDAD=true (run-preprod-tests.sh --auth)
      - INCENTIVOS_SEGURIDAD_HABILITADA=${PREPROD_SEGURIDAD:-false}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KC_HOSTNAME:-http://localhost:8180}/realms/donatrack
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/donatrack/protocol/openid-connect/certs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  donaciones-service:
    image: donatrack/donaciones-service:preprod
    build:
      context: .
      dockerfile: donaciones-service/Dockerfile
      target: ci
      args:
        JAR_FILE: donaciones-service/target/donaciones-service-1.0.jar
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=postgres,preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/donaciones?currentSchema=donaciones
      - SPRING_DATASOURCE_USERNAME=donaciones_user
      - SPRING_DATASOURCE_PASSWORD=${DONACIONES_DB_PASSWORD:?ver .env.example}
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - INCENTIVOS_SERVICE_URL=http://incentivos-service:8082
      - LOGISTICA_SERVICE_URL=http://logistica-service:8083
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PASS=${RABBITMQ_PASS:?ver .env.example}
      # Token de los eventos de vuelta de logística: valor sintético solo para desarrollo y pruebas
      - LOGISTICA_TOKEN_DONATRACK=${LOGISTICA_TOKEN_DONATRACK:-token-sintetico-solo-desarrollo}
      # El relay del outbox de logística corre cada 1 s (por defecto 10 s) para que los tests E2E,
      # que esperan hasta 8 s la entrega en logística, no dependan del ciclo del relay.
      - LOGISTICA_OUTBOX_INTERVALO_MS=1000
      - SEED_CATALOGO_ENABLED=true
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
      - DONACIONES_MINIO_ENABLED=true
      - DONACIONES_MINIO_ENDPOINT=http://minio:9000
      - DONACIONES_MINIO_PUBLIC_ENDPOINT=http://minio:9000
      - DONACIONES_MINIO_ACCESS_KEY=donaciones-service
      - DONACIONES_MINIO_SECRET_KEY=${DONACIONES_MINIO_PASSWORD:?ver .env.example}
      # Validación del token de Keycloak (SPEC-06 E2-01): apagada salvo PREPROD_SEGURIDAD=true (run-preprod-tests.sh --auth)
      - DONACIONES_SEGURIDAD_HABILITADA=${PREPROD_SEGURIDAD:-false}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KC_HOSTNAME:-http://localhost:8180}/realms/donatrack
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/donatrack/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  logistica-service:
    image: donatrack/logistica-service:preprod
    build:
      context: .
      dockerfile: logistica-service/Dockerfile
      target: ci
      args:
        JAR_FILE: logistica-service/target/logistica-service-1.0.jar
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - SPRING_PROFILES_ACTIVE=mongo,preprod
      - SPRING_DATA_MONGODB_URI=mongodb://${LOGISTICA_MONGO_USER:?ver .env.example}:${LOGISTICA_MONGO_PASSWORD:?ver .env.example}@mongodb:27017/logistica?replicaSet=rs0&authSource=logistica
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - LOGISTICA_MAX_DONACIONES_POR_LOTE=${LOGISTICA_MAX_DONACIONES_POR_LOTE:-100}
      - LOGISTICA_PLANIFICACION_MANUAL_ENABLED=true
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PASS=${RABBITMQ_PASS:?ver .env.example}
      # Mismo token que Donaciones espera para el proveedor donatrack (solo desarrollo y pruebas)
      - LOGISTICA_TOKEN_VUELTA=${LOGISTICA_TOKEN_DONATRACK:-token-sintetico-solo-desarrollo}
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms128m -Xmx384m
      # Fotos de recepción en MinIO (ADR-E6-08, HB-10)
      - LOGISTICA_MINIO_ENABLED=true
      - LOGISTICA_MINIO_ENDPOINT=http://minio:9000
      - LOGISTICA_MINIO_PUBLIC_ENDPOINT=http://minio:9000
      - LOGISTICA_MINIO_ACCESS_KEY=logistica-service
      - LOGISTICA_MINIO_SECRET_KEY=${LOGISTICA_MINIO_PASSWORD:?ver .env.example}
      - LOGISTICA_FOTOS_URL_PUBLICA_BASE=http://logistica-service:8083
      # Validación del token de Keycloak (SPEC-06 E2-01): apagada salvo PREPROD_SEGURIDAD=true (run-preprod-tests.sh --auth)
      - LOGISTICA_SEGURIDAD_HABILITADA=${PREPROD_SEGURIDAD:-false}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KC_HOSTNAME:-http://localhost:8180}/realms/donatrack
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/donatrack/protocol/openid-connect/certs
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  api-gateway:
    # Entrada única a los servicios (ADR-E6-02). La validación del JWT (GATEWAY_SEGURIDAD_HABILITADA) queda
    # apagada: ningún test del preprod manda token todavía (E2-07).
    image: donatrack/api-gateway:preprod
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      target: ci
      args:
        JAR_FILE: api-gateway/target/api-gateway-1.0.jar
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - SPRING_PROFILES_ACTIVE=preprod
      - DONACIONES_SERVICE_URL=http://donaciones-service:8080
      - NOTIFICACIONES_SERVICE_URL=http://notificaciones-service:8081
      - INCENTIVOS_SERVICE_URL=http://incentivos-service:8082
      - LOGISTICA_SERVICE_URL=http://logistica-service:8083
      - EXECUTION_ID=${EXECUTION_ID:-local_run}
      - SPRING_JMX_ENABLED=false
      - SPRING_MAIN_BANNER_MODE=off
      - JAVA_TOOL_OPTIONS=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xms64m -Xmx256m
      # Validación del token de Keycloak (SPEC-06 E2-01): apagada salvo PREPROD_SEGURIDAD=true (run-preprod-tests.sh --auth)
      - GATEWAY_SEGURIDAD_HABILITADA=${PREPROD_SEGURIDAD:-false}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KC_HOSTNAME:-http://localhost:8180}/realms/donatrack
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/donatrack/protocol/openid-connect/certs
    depends_on:
      donaciones-service:
        condition: service_healthy
      notificaciones-service:
        condition: service_healthy
      incentivos-service:
        condition: service_healthy
      logistica-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    networks:
      - preprod-network

  cliente-liviano:
    # El sitio (SPEC-06 E2-12b, SPEC-09 F6): ingresa por Keycloak y habla con los servicios solo por el gateway.
    # KEYCLOAK_ISSUER_URI es la URL pública de Keycloak (la del navegador y la de los tokens); como dentro del
    # contenedor "localhost" no es Keycloak, docker-entrypoint.sh la reenvía a keycloak:8080 (emisor único).
    image: donatrack/cliente-liviano:preprod
    build:
      context: .
      dockerfile: cliente-liviano/Dockerfile
      target: ci
      args:
        JAR_FILE: cliente-liviano/target/cliente-liviano-1.0.jar
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - CLIENTE_LIVIANO_SECRET=${CLIENTE_LIVIANO_SECRET:?ver .env.example}
      - KEYCLOAK_ISSUER_URI=${KC_HOSTNAME:-http://localhost:8180}/realms/donatrack
      - KEYCLOAK_LOCAL_FORWARD_TO=keycloak:8080
      # La sesión en PostgreSQL (SPEC-06 E2-02, D5): base `cliente`, rol `cliente_user`. Ver SesionesJdbcConfig.
      - CLIENTE_SESIONES_JDBC_HABILITADO=true
      - CLIENTE_SESIONES_JDBC_URL=jdbc:postgresql://postgres:5432/cliente?currentSchema=cliente
      - CLIENTE_SESIONES_JDBC_USUARIO=cliente_user
      - CLIENTE_SESIONES_JDBC_CLAVE=${CLIENTE_DB_PASSWORD:?ver .env.example}
      - DONACIONES_URL=http://api-gateway:8086
      - NOTIFICACIONES_URL=http://api-gateway:8086
      - INCENTIVOS_URL=http://api-gateway:8086
      - LOGISTICA_URL=http://api-gateway:8086
      - SPRING_MAIN_BANNER_MODE=off
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
      start_interval: 1s
    networks:
      - preprod-network

  rabbitmq:
    image: rabbitmq:3.13-alpine
    # RM-08: el consumidor espía de integration-tests captura los mensajes; solo en loopback
    ports:
      - "127.0.0.1:5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=donatrack
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?ver .env.example}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - preprod-network

  n8n:
    image: n8nio/n8n:2.37.7
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_METRICS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - ./n8n:/etc/n8n/workflows
      # TODO deuda técnica: docker-compose.yml (local) no persiste /home/node/.n8n a propósito,
      # por diseño solo se hizo para preprod. Evaluar si conviene espejarlo en local.
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5678/healthz', (res) => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
      start_interval: 1s
    networks:
      - preprod-network

  postgres:
    image: postgres:16-alpine
    container_name: donatrack-postgres
    environment:
      POSTGRES_DB: donatrack
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ver .env.example}
      NOTIFICACIONES_DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?ver .env.example}
      INCENTIVOS_DB_PASSWORD: ${INCENTIVOS_DB_PASSWORD:?ver .env.example}
      LOGISTICA_DB_PASSWORD: ${LOGISTICA_DB_PASSWORD:?ver .env.example}
      DONACIONES_DB_PASSWORD: ${DONACIONES_DB_PASSWORD:?ver .env.example}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?ver .env.example}
      CLIENTE_DB_PASSWORD: ${CLIENTE_DB_PASSWORD:?ver .env.example}
    volumes:
      - ./persistencia/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d donatrack" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - preprod-network

  keycloak:
    # IdP de DonaTrack (SPEC-06 E2-12): misma imagen que docker-compose.yml, con el realm y el tema ya
    # construidos (kc.sh build). La etiqueta es donatrack/auth-service:preprod porque así la deja
    # scripts/resolver-imagenes-ghcr.sh (el nombre del servicio en CI es el de su carpeta).
    # Ningún otro servicio depende todavía de Keycloak: lo valida el gateway en E2-01.
    image: donatrack/auth-service:preprod
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    # Solo en loopback (como rabbitmq): en preprod nadie de afuera lo necesita.
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak_user
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:?ver .env.example}
      # El correo de la cuenta (recuperar la clave, verificar el email) sale por RabbitMQ y lo manda
      # notificaciones-service (SPEC-06 E2-06). El proveedor se elige al construir la imagen; acá, solo la conexión.
      - KC_SPI_EMAIL_TEMPLATE__DONATRACK_AMQP__HOST=rabbitmq
      - KC_SPI_EMAIL_TEMPLATE__DONATRACK_AMQP__USER=donatrack
      - KC_SPI_EMAIL_TEMPLATE__DONATRACK_AMQP__PASSWORD=${RABBITMQ_PASS:?ver .env.example}
      # Admin de la consola de Keycloak (no es el ADMIN de DonaTrack). Solo se crea con la base vacía.
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:?ver .env.example}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:?ver .env.example}
      - KC_HOSTNAME=${KC_HOSTNAME:?ver .env.example}
      - KC_HTTP_ENABLED=${KC_HTTP_ENABLED:-true}
      - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED:-true}
      # Los lee el realm al importarse (${...} en auth-service/realm/donatrack-realm.json), solo con la base vacía.
      - CLIENTE_LIVIANO_SECRET=${CLIENTE_LIVIANO_SECRET:?ver .env.example}
      - CLIENTE_LIVIANO_BASE_URL=${CLIENTE_LIVIANO_BASE_URL:?ver .env.example}
      # Cuenta de servicio con el rol ADMIN para integration-tests, k6 y Postman con la seguridad encendida (SPEC-06 E2-07).
      - PRUEBAS_CLIENT_SECRET=${PRUEBAS_CLIENT_SECRET:?ver .env.example}
      - AUTH_ADMIN_EMAIL=${AUTH_ADMIN_EMAIL:?ver .env.example}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD:?ver .env.example}
      # Google como identity provider (RX-01). Opcionales: vacías, el botón de Google no anda y lo demás sí (RX-13).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    # La salud sale por el puerto de gestión (9000), que no se publica en el host: el 9000 del host
    # es de MinIO. La imagen no trae curl, así que se abre el socket con bash (/dev/tcp) y se exige
    # un 200 en /health/ready.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r estado <&3 &&
          case "$$estado" in *' 200 '*) exit 0;; *) exit 1;; esac
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
      start_interval: 2s
    networks:
      - preprod-network

  mongodb:
    # RM-05: fijada por digest (índice multi-arquitectura de mongo 7.0.45).
    # Para actualizarla: docker buildx imagetools inspect mongo:7.0 y reemplazar el digest.
    image: mongo:7.0@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
    container_name: donatrack-mongodb
    # Replica set de un nodo (lo necesitan las transacciones de logística). Con usuarios y
    # replica set mongod exige un keyfile; como hay un solo nodo, se genera en cada arranque.
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?ver .env.example}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?ver .env.example}
      LOGISTICA_MONGO_USER: ${LOGISTICA_MONGO_USER:?ver .env.example}
      LOGISTICA_MONGO_PASSWORD: ${LOGISTICA_MONGO_PASSWORD:?ver .env.example}
    volumes:
      - ./persistencia/mongo/init:/docker-entrypoint-initdb.d:ro
      - ./persistencia/mongo/replica-set.js:/opt/donatrack/replica-set.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --file /opt/donatrack/replica-set.js"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
      start_interval: 1s
    networks:
      - preprod-network

  minio:
    # quay.io/minio ya no permite pull anónimo (401). Imagen de Chainguard fijada por digest;
    # no trae curl, por eso el healthcheck usa `mc ready local`.
    image: cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    container_name: donatrack-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?ver .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?ver .env.example}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - preprod-network

  minio-init:
    # Crea un usuario de MinIO por servicio (incentivos, donaciones y logistica-service) con acceso solo
    # a sus buckets. Misma imagen que minio: trae sh y mc. Corre en cada `up` y termina.
    image: cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    entrypoint: ["sh", "/opt/donatrack/minio/init-usuarios.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?ver .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?ver .env.example}
      INCENTIVOS_MINIO_PASSWORD: ${INCENTIVOS_MINIO_PASSWORD:?ver .env.example}
      DONACIONES_MINIO_PASSWORD: ${DONACIONES_MINIO_PASSWORD:?ver .env.example}
      LOGISTICA_MINIO_PASSWORD: ${LOGISTICA_MINIO_PASSWORD:?ver .env.example}
    volumes:
      - ./persistencia/minio:/opt/donatrack/minio:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - preprod-network

  k6:
    image: grafana/k6:latest
    profiles: ["perf"]
    volumes:
      - ./tests/performance/k6:/scripts:ro
    networks:
      - preprod-network

networks:
  preprod-network:
    driver: bridge

volumes:
  n8n_data: